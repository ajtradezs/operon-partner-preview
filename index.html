<!doctype html>
<html lang="en" data-build="20261026T142232Z"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Operon partner preview with made-up data and simulated logins.">
<title>Operon Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a sticky demo banner and header with one scrolling nav row; content column up to 1280px.
   Today puts a narrow tray rail beside the Tasks board, so the trays never become the room people live in.
   Colour, type and tier tokens are copied from app/src/styles/tokens.css (Operon brand system, 13 Oct 2026). */
:root{
  --op-bg:#F7F6FB; --op-surface:#FFFFFF; --op-surface-2:#EFEEF7; --op-ink:#060D3E; --op-ink-muted:#535977;
  --op-rule:#E2E1EE; --op-border:#84879F; --op-accent:#5A2EE0; --op-accent-ink:#FFFFFF; --op-accent-soft:#EEEAFD; --op-focus:#0A6CCB;
  --op-success:#17784D; --op-warning:#8A5A00; --op-warning-soft:#FCEFD2; --op-danger:#A3301F; --op-info:#1D6BA0;
  --op-tier-auto-fg:#1D9B64; --op-tier-auto-bg:#E5F2EB; --op-tier-auto-text:#0D5234;
  --op-tier-hold-fg:#9B6E18; --op-tier-hold-bg:#FBF0DC; --op-tier-hold-text:#5E3F00;
  --op-tier-held-fg:#73231A; --op-tier-held-bg:#F6E3DF; --op-tier-held-text:#6E2016;
  --op-tier-forbidden-fg:#525765; --op-tier-forbidden-bg:#EAEBEF; --op-tier-forbidden-text:#3A3F4B;
  --op-brand-navy:#060D3E; --op-brand-1:#871EFA; --op-brand-2:#6F49F3; --op-brand-3:#4C71F0; --op-brand-4:#1EA1EE; --op-brand-5:#11BAEF;
  --op-scrim:rgba(6,13,62,.45);
  --op-shadow:0 1px 2px rgba(6,13,62,.06),0 8px 24px rgba(6,13,62,.07);
  --font-display:"Orbitron","Saira",system-ui,sans-serif;
  --font-body:"Saira",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --op-bg:#0A0C1F; --op-surface:#11142B; --op-surface-2:#191D3A; --op-ink:#ECECF7; --op-ink-muted:#A6A9C6;
    --op-rule:#272B4A; --op-border:#6E7399; --op-accent:#A796FF; --op-accent-ink:#0A0A26; --op-accent-soft:#241D52; --op-focus:#4FC3F7;
    --op-success:#5CC594; --op-warning:#E5B04F; --op-warning-soft:#3A2A0E; --op-danger:#F08B7A; --op-info:#6FB4E3;
    --op-tier-auto-fg:#60BD92; --op-tier-auto-bg:#12301F; --op-tier-auto-text:#A3E6C4;
    --op-tier-hold-fg:#EBB447; --op-tier-hold-bg:#3A2A0E; --op-tier-hold-text:#F6D592;
    --op-tier-held-fg:#DD5D45; --op-tier-held-bg:#421B16; --op-tier-held-text:#F7BDB2;
    --op-tier-forbidden-fg:#6D7383; --op-tier-forbidden-bg:#20242C; --op-tier-forbidden-text:#CDD1D9;
    --op-scrim:rgba(0,0,0,.6);
    --op-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --op-bg:#0A0C1F; --op-surface:#11142B; --op-surface-2:#191D3A; --op-ink:#ECECF7; --op-ink-muted:#A6A9C6;
  --op-rule:#272B4A; --op-border:#6E7399; --op-accent:#A796FF; --op-accent-ink:#0A0A26; --op-accent-soft:#241D52; --op-focus:#4FC3F7;
  --op-success:#5CC594; --op-warning:#E5B04F; --op-warning-soft:#3A2A0E; --op-danger:#F08B7A; --op-info:#6FB4E3;
  --op-tier-auto-fg:#60BD92; --op-tier-auto-bg:#12301F; --op-tier-auto-text:#A3E6C4;
  --op-tier-hold-fg:#EBB447; --op-tier-hold-bg:#3A2A0E; --op-tier-hold-text:#F6D592;
  --op-tier-held-fg:#DD5D45; --op-tier-held-bg:#421B16; --op-tier-held-text:#F7BDB2;
  --op-tier-forbidden-fg:#6D7383; --op-tier-forbidden-bg:#20242C; --op-tier-forbidden-text:#CDD1D9;
  --op-scrim:rgba(0,0,0,.6);
  --op-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--op-bg);color:var(--op-ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h1{font-size:1.6rem;letter-spacing:-.005em}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
a{color:var(--op-accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--op-focus);outline-offset:2px;border-radius:4px}
input.sr:focus-visible+label.btn{outline:2px solid var(--op-focus);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums slashed-zero;font-size:.92em}
.muted{color:var(--op-ink-muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--op-ink-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top: banner + header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--op-surface);border-bottom:1px solid var(--op-rule)}
.banner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--op-warning-soft);color:var(--op-ink);padding-block:5px;padding-inline:16px;font-size:13px;border-bottom:1px solid var(--op-rule)}
.banner svg{color:var(--op-warning);flex:none}
.banner .btn{min-height:28px;padding:2px 10px;font-size:13px}
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;max-width:1312px;margin:0 auto;padding-block:10px 6px;padding-inline:16px}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--op-ink);text-decoration:none}
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:.15em;margin-right:-.15em;text-transform:uppercase;font-size:18px;line-height:1}
.firm{font-size:13px;color:var(--op-ink-muted);min-width:0}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--op-ink-muted);font-weight:500}
.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--op-accent-soft);color:var(--op-ink);font-size:12px;font-weight:700;text-decoration:none}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:1312px;margin:0 auto;padding-block:2px 8px;padding-inline:12px;scrollbar-width:thin}
.nav a{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 10px;border-radius:var(--r-sm);color:var(--op-ink-muted);text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{color:var(--op-ink);background:var(--op-surface-2)}
.nav a[aria-current="page"]{color:var(--op-ink);background:var(--op-accent-soft);font-weight:600}
.nav .sep{width:1px;background:var(--op-rule);margin:6px 6px;flex:none}
@media (max-width:760px){.firm{display:none}.who label .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.bar{padding-block:6px 4px;flex-wrap:nowrap}.banner{font-size:12px;gap:6px;padding-block:4px}.banner .btn{min-height:26px}.nav{padding-block:0 6px}}
.count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--op-ink);color:var(--op-bg);line-height:18px}
.count.zero{background:var(--op-surface-2);color:var(--op-ink-muted)}

.wrap{max-width:1312px;margin:0 auto;padding-inline:16px;padding-block:20px 72px}
@media (min-width:900px){.wrap,.bar{padding-inline:24px}.nav{padding-inline:20px}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.pagehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.pagehead p{max-width:68ch}
.crumbs{font-size:13px;color:var(--op-ink-muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--op-ink-muted)}

/* Controls */
.btn{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--op-border);background:var(--op-surface);color:var(--op-ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--op-ink)}
.btn.primary{background:var(--op-accent);border-color:var(--op-accent);color:var(--op-accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--op-accent)}
.btn.danger{color:var(--op-danger);border-color:var(--op-danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--op-surface-2);border-color:transparent}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.locked{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--op-ink-muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--op-border);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--op-surface);color:var(--op-ink-muted);padding:6px 12px;cursor:pointer;min-height:34px}
.seg button+button{border-left:1px solid var(--op-rule)}
.seg button[aria-pressed="true"]{background:var(--op-accent-soft);color:var(--op-ink)}
label.f{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:14px;font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:14px;color:var(--op-ink);background:var(--op-surface);border:1px solid var(--op-border);border-radius:8px;padding:6px 10px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:96px;resize:vertical;line-height:1.45}
input[type="checkbox"],input[type="radio"]{min-height:0;width:16px;height:16px;accent-color:var(--op-accent);margin:0}
.hint{font-size:13px;color:var(--op-ink-muted);font-weight:400}
.err{color:var(--op-danger);font-size:13px;font-weight:600}
.err:empty{display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.filters label.f{font-size:12px;color:var(--op-ink-muted)}
.search{min-width:0;width:min(100%,300px)}

/* Surfaces */
.card{background:var(--op-surface);border:1px solid var(--op-rule);border-radius:var(--r);padding:16px;min-width:0}
.card.pad-s{padding:12px}
.card h2+*{margin-top:8px}
.well{background:var(--op-surface-2);border-radius:var(--r);padding:12px 14px}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--op-warning-soft);border:1px solid var(--op-warning);color:var(--op-ink);border-radius:var(--r);padding:10px 14px;font-weight:500}
.status svg{color:var(--op-warning)}
.note{border-left:3px solid var(--op-border);padding:2px 0 2px 12px;color:var(--op-ink-muted);font-size:14px}
dl.facts{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
dl.facts dt{color:var(--op-ink-muted)}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){dl.facts{grid-template-columns:1fr}dl.facts dd{margin-bottom:6px}}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tablewrap{overflow-x:auto;border:1px solid var(--op-rule);border-radius:var(--r);background:var(--op-surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--op-rule);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--op-ink-muted);font-weight:600;background:var(--op-surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--op-accent-soft)}
td.r,th.r{text-align:right}

/* Tier badges: shape + word, always */
.tier{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px 1px 8px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap;letter-spacing:.01em}
.tier svg{flex:none}
.tier.auto{background:var(--op-tier-auto-bg);color:var(--op-tier-auto-text)} .tier.auto svg{color:var(--op-tier-auto-fg)}
.tier.hold{background:var(--op-tier-hold-bg);color:var(--op-tier-hold-text)} .tier.hold svg{color:var(--op-tier-hold-fg)}
.tier.held{background:var(--op-tier-held-bg);color:var(--op-tier-held-text)} .tier.held svg{color:var(--op-tier-held-fg)}
.tier.forbidden{background:var(--op-tier-forbidden-bg);color:var(--op-tier-forbidden-text)} .tier.forbidden svg{color:var(--op-tier-forbidden-fg)}

/* Task state words, waiting-on chips, AI role labels */
.state{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--op-ink-muted);white-space:nowrap}
.wait{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:4px;padding:0 6px;line-height:20px;border:1px solid var(--op-rule);color:var(--op-ink-muted);white-space:nowrap}
.wait b{font-weight:700;color:var(--op-ink)}
.wait.you{background:var(--op-accent-soft);border-color:var(--op-accent)}
.role-l{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--op-ink-muted);border:1px solid var(--op-rule);border-radius:4px;padding:0 5px;line-height:18px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:0 8px;line-height:20px;background:var(--op-surface-2);color:var(--op-ink);white-space:nowrap}
.pill.ok{color:var(--op-success)}
.pill.warn{color:var(--op-warning);background:var(--op-warning-soft)}
.pill.bad{color:var(--op-danger)}

/* Stage strip: read-only, nobody drags it */
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.stages i{display:block;height:4px;border-radius:2px;background:var(--op-rule)}
.stages i.d{background:var(--op-ink-muted)}
.stages i.c{background:var(--op-accent)}
.stagebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stagebar div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--op-ink-muted);min-width:0}
.stagebar div i{height:6px;border-radius:3px;background:var(--op-rule)}
.stagebar div.d i{background:var(--op-ink-muted)}
.stagebar div.c i{background:var(--op-accent)}
.stagebar div.c{color:var(--op-ink);font-weight:700}

/* Tasks board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.boardsec{container-type:inline-size}
@container (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:520px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--op-surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>header{display:flex;flex-direction:column;gap:2px;padding:2px 4px 4px}
.col>header h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.col>header p{font-size:12px;color:var(--op-ink-muted)}
.jobcard{display:flex;flex-direction:column;gap:7px;background:var(--op-surface);border:1px solid var(--op-rule);border-radius:8px;padding:11px 12px;color:var(--op-ink);text-decoration:none;min-width:0}
.jobcard:hover{border-color:var(--op-accent);box-shadow:var(--op-shadow)}
.jc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.jc-client{font-size:12px;color:var(--op-ink-muted);font-weight:500;min-width:0}
.jc-title{font-weight:600;font-size:15px;line-height:1.3}
.jc-text{font-size:13px;line-height:1.45}
.jc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--op-ink-muted);align-items:center}
.empty-col{font-size:13px;color:var(--op-ink-muted);padding:8px 4px}

/* Today */
.today{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.today{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,140px) + 12px)}
@media (max-width:900px){.rail{position:static}.trays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
@media (max-width:420px){.trays{grid-template-columns:minmax(0,1fr)}}
.trays{display:flex;flex-direction:column;gap:8px}
.tray{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;background:var(--op-surface);border:1px solid var(--op-rule);border-radius:var(--r);padding:10px 12px;color:var(--op-ink);text-decoration:none}
.tray:hover{border-color:var(--op-accent)}
.tray .tn{font-weight:600}
.tray .tc{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;grid-row:span 2}
.tray .ts{font-size:12px;color:var(--op-ink-muted)}
.tray.zero .tc{color:var(--op-ink-muted)}
.going{background:var(--op-surface);border:1px solid var(--op-rule);border-radius:var(--r);padding:8px 10px;font-size:13px}
.going>button{font:inherit;font-weight:600;background:none;border:0;color:var(--op-ink);cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:4px 0;min-height:32px}
.going ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.going li{display:grid;gap:4px;border-top:1px solid var(--op-rule);padding-top:8px}
.overnight{font-size:16px;line-height:1.55;max-width:75ch}
.risk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--op-rule);color:var(--op-ink);text-decoration:none}
.risk:first-child{border-top:0}
.risk:hover .rt{text-decoration:underline}
.datebox{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;text-align:center;line-height:1.15;border:1px solid var(--op-rule);border-radius:6px;padding:4px 6px;min-width:52px}
.datebox b{display:block;font-size:16px}
.allclear{border:1px dashed var(--op-border);border-radius:var(--r);padding:16px;font-size:15px}

/* Countdown items (Going out soon) */
.cd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.cd .when{font-weight:600}
.cd .left{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--op-ink-muted)}

/* Tray screens */
.split{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.tray-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tray-list li{display:flex;gap:8px;align-items:flex-start}
.tray-list li>input{margin-top:14px}
.ti{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;background:var(--op-surface);border:1px solid var(--op-rule);border-radius:8px;padding:10px 12px;color:var(--op-ink);cursor:pointer}
.ti:hover{border-color:var(--op-border)}
.ti[aria-current="true"]{border-color:var(--op-accent);background:var(--op-accent-soft)}
.ti .why{font-size:12px;color:var(--op-ink-muted)}
.ti .t1{font-weight:600;font-size:14px}
.ti .t2{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:13px;color:var(--op-ink-muted)}
.ti .t2 .num,.ti .t2 .mono{font-size:1em}
.detail{display:flex;flex-direction:column;gap:14px}
.reasonline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.batchbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--op-surface);border:1px solid var(--op-rule);border-radius:var(--r);padding:10px 12px;font-size:14px}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checklist input{margin-top:3px}
.doc{border:1px solid var(--op-rule);border-radius:8px;padding:12px 14px;background:var(--op-surface-2);font-size:14px}
.doc table{font-size:13px}
.doc td,.doc th{background:transparent;padding:6px 8px}

/* Task page steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps>li{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 0;border-top:1px solid var(--op-rule)}
.steps>li:first-child{border-top:0}
.step-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.step-h .st{font-weight:600}
.step-m{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--op-ink-muted)}
.step-now{border:1px solid var(--op-accent);border-radius:8px;padding:10px 12px;background:var(--op-accent-soft)}

/* Log rows */
.log{list-style:none;margin:0;padding:0;border:1px solid var(--op-rule);border-radius:var(--r);background:var(--op-surface)}
.log>li{border-top:1px solid var(--op-rule)}
.log>li:first-child{border-top:0}
.logrow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:4px 12px;align-items:start;width:100%;text-align:left;font:inherit;color:var(--op-ink);background:none;border:0;padding:10px 12px;cursor:pointer}
.logrow:hover{background:var(--op-surface-2)}
@media (max-width:640px){.logrow{grid-template-columns:minmax(0,1fr)}}
.logrow .lt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--op-ink-muted);padding-top:2px}
.logrow .lx{display:flex;flex-direction:column;gap:4px;min-width:0}
.logrow .lm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--op-ink-muted);align-items:center}
.prov{padding:4px 12px 14px 116px;display:flex;flex-direction:column;gap:10px}
@media (max-width:640px){.prov{padding-left:12px}}
.hash{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere;color:var(--op-ink-muted)}

/* Client grid */
.cgrid td{min-width:150px}
.cgrid td:first-child{min-width:190px}
.cell-ok{color:var(--op-ink-muted);font-size:13px}
.cell-task{display:flex;flex-direction:column;gap:3px;color:var(--op-ink);text-decoration:none;font-size:13px}
.cell-task:hover span:first-child{text-decoration:underline}

/* Try it */
.trygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.trycard{display:flex;flex-direction:column;gap:10px}
.trycard p{font-size:14px}
.result{border-radius:8px;padding:10px 12px;background:var(--op-surface-2);font-size:14px}
.result.forb{background:var(--op-tier-forbidden-bg);color:var(--op-tier-forbidden-text);font-weight:600}

/* Sign-in */
.signin{min-height:calc(100dvh - 90px);display:grid;place-items:center;padding-block:24px}
.signin-card{width:min(440px,100%);display:flex;flex-direction:column;gap:22px;align-items:stretch}
.stacked{display:flex;flex-direction:column;align-items:center;color:var(--op-ink);text-align:center}
.stacked .wm{font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,9vw,3.25rem);line-height:1;letter-spacing:.15em;margin-right:-.15em;text-transform:uppercase;margin-top:20px}
.stacked .tag{font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:.26em;margin-right:-.26em;text-transform:uppercase;margin-top:12px}
.signin form{display:flex;flex-direction:column;gap:14px}
.code{font-family:var(--font-mono);font-size:22px;letter-spacing:.4em;text-align:center}

/* Dialog + toasts */
dialog{border:1px solid var(--op-rule);border-radius:12px;background:var(--op-surface);color:var(--op-ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:var(--op-shadow)}
dialog::backdrop{background:rgba(6,13,62,.5)}
#app:focus,#app h1:focus{outline:none}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--op-rule);position:sticky;top:0;background:var(--op-surface);z-index:1}
.dlg-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--op-rule)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--op-rule);border-radius:8px;padding:10px 12px;font-size:14px}
.opt input{margin-top:3px}
.opt.dis{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--op-border);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chips input{width:14px;height:14px}
.toasts{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:200;pointer-events:none}
.toast{pointer-events:auto;background:var(--op-ink);color:var(--op-bg);border-radius:8px;padding:10px 14px;font-size:14px;max-width:440px;box-shadow:var(--op-shadow);animation:tin .18s ease-out}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:760px){.bar{flex-wrap:wrap;min-width:0}.bar>.who{margin-left:auto}.bar>[data-act="copyPreviewLink"]{order:3;font-size:11px}.bar>.spacer{display:none}}
/* ===================== Review layer (partner-preview/src/review.css) ===================== */
/* Everything uses the --op-* tokens, so light and dark themes follow the app. Phones (<=760px): compact bar, notes as a bottom sheet. */
body.rv-on #app{padding-bottom:120px}
body.rv-arranging #app{padding-bottom:240px}
body.rv-on .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.rv-arranging .toasts{bottom:calc(var(--rv-dock-h,150px) + 28px + env(safe-area-inset-bottom,0px))}
body.rv-on .toast{pointer-events:none}
.rv-rel{position:relative}
.rv-relt{transform:translate(0,0)}
.rv-gone{display:none!important}
.rv-pre,.rv-t{white-space:pre-wrap;overflow-wrap:anywhere}

/* Review bar, tip and menu */
.rv-bar{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 32px);padding:6px;background:var(--op-surface);border:1px solid var(--op-rule);border-radius:12px;box-shadow:var(--op-shadow)}
.rv-bar[hidden],.rv-abar[hidden],.rv-tip[hidden],.rv-menu[hidden],.rv-drawer[hidden]{display:none}
.rv-bar .btn,.rv-abar .btn{min-height:32px}
.rv-sep{width:1px;align-self:stretch;background:var(--op-rule);margin:2px 2px}
.rv-s{display:none}
.rv-chip{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 10px;border-radius:999px;border:1px solid var(--op-rule);background:var(--op-surface-2);color:var(--op-ink);cursor:pointer;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-chip:hover{border-color:var(--op-border)}
.rv-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--op-border)}
.rv-ok .rv-dot{background:var(--op-success)}
.rv-busy .rv-dot{background:var(--op-info);animation:rvpulse 1.2s ease-in-out infinite}
.rv-off .rv-dot{background:var(--op-warning)}
.rv-off{background:var(--op-warning-soft)}
.rv-bad .rv-dot{background:var(--op-danger)}
.rv-bad{color:var(--op-danger)}
.rv-local{color:var(--op-ink-muted)}
@keyframes rvpulse{50%{opacity:.35}}
.rv-viewsel{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--op-ink-muted)}
.rv-viewsel select{min-height:30px;padding:2px 6px;font-size:13px;max-width:180px}
.rv-viewing{background:var(--op-accent-soft)}
.rv-more{letter-spacing:.1em}
.rv-pickmsg{font-size:14px;padding:0 6px;max-width:560px}
.rv-tip{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;gap:12px;max-width:min(460px,calc(100vw - 32px));padding:10px 12px;border-radius:12px;background:var(--op-ink);color:var(--op-bg);box-shadow:var(--op-shadow);font-size:14px}
.rv-tip .btn{flex:none}
.rv-menu{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:47;display:flex;flex-direction:column;min-width:240px;max-width:calc(100vw - 32px);padding:6px;background:var(--op-surface);border:1px solid var(--op-rule);border-radius:12px;box-shadow:var(--op-shadow)}
.rv-mi{font:inherit;font-size:14px;text-align:left;display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--op-ink);text-decoration:none;cursor:pointer;min-height:36px}
.rv-mi:hover{background:var(--op-surface-2)}
.rv-misel{cursor:default}
.rv-misel:hover{background:none}

/* Arrange bar */
.rv-abar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--op-surface);border:1px solid var(--op-accent);border-radius:12px;box-shadow:var(--op-shadow)}
.rv-arow{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.rv-amsg{font-size:14px}
.rv-aact,.rv-tb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rv-arow1 .rv-aact{margin-left:auto}
.rv-tbrow{border-top:1px solid var(--op-rule);padding-top:8px}
.rv-selname{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:14px}
.rv-selname strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.rv-ahint{max-width:90ch}

/* In-block review controls: reset what app rules such as `.going>button` or `.seg button` would otherwise apply. */
button[data-rv-ui][type]{min-height:0;margin:0;width:auto;flex:none;float:none;text-align:center;justify-content:center;text-transform:none;letter-spacing:0;line-height:1;box-sizing:border-box;border-left-width:1px}
/* Note pins */
.rv-pin[data-rv-ui]{position:absolute;top:calc(-11px + var(--rv-dy,0px));right:calc(10px + var(--rv-shift,0px));z-index:3;font:inherit;font-size:12px;font-weight:600;line-height:1;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--op-accent);background:var(--op-surface);color:var(--op-accent);cursor:pointer;white-space:nowrap;box-shadow:var(--op-shadow);text-decoration:none;letter-spacing:0;text-transform:none}
.rv-pin[data-rv-ui]:hover{background:var(--op-accent);color:var(--op-accent-ink)}
.rv-pin[data-rv-ui].rv-in{top:calc(6px + var(--rv-dy,0px))}
.rv-pin[data-rv-ui].rv-tight{pointer-events:none}
.rv-pin[data-rv-ui]:not(.rv-empty){background:var(--op-accent);color:var(--op-accent-ink)}
.rv-pin[data-rv-ui].rv-done:not(.rv-empty){background:var(--op-surface-2);color:var(--op-ink-muted);border-color:var(--op-rule)}
.rv-who{font-family:var(--font-mono);font-size:11px;opacity:.85}
.rv-pin[data-rv-ui].rv-empty{opacity:0;transition:opacity .12s}
.rv-hot>.rv-pin[data-rv-ui].rv-empty,.rv-pin[data-rv-ui].rv-empty.rv-pinhot,.rv-pin[data-rv-ui].rv-empty:focus-visible,.rv-sel>.rv-pin[data-rv-ui].rv-empty{opacity:1}
.rv-pin[data-rv-ui].rv-out{right:auto}
@media (hover:none){.rv-pin[data-rv-ui].rv-empty{opacity:.85;font-size:0;gap:0;width:22px;padding:0;justify-content:center}.rv-pin[data-rv-ui].rv-empty::before{content:"+";font-size:15px;line-height:1}
  .rv-pin[data-rv-ui]::after{content:"";position:absolute;inset:-6px;border-radius:999px}}
.rv-pin[data-rv-ui].rv-navpin{position:static;align-self:center;flex:none;margin-left:6px}
.rv-anchored{outline:2px dotted var(--op-accent);outline-offset:2px}
.rv-anchored::after{content:attr(data-rv-n);position:absolute;top:-8px;right:-8px;z-index:3;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--op-accent);color:var(--op-accent-ink);font:600 10px/16px var(--font-mono);text-align:center;pointer-events:none}
.nav a.rv-anchored::after{top:1px;right:1px}
.rv-flash{animation:rvflash 2.4s ease-out}
@keyframes rvflash{0%,40%{box-shadow:0 0 0 4px var(--op-accent)}100%{box-shadow:0 0 0 0 transparent}}

/* Pin a note anywhere */
body.rv-picking #app,body.rv-picking #app *,body.rv-picking #top,body.rv-picking #top *{cursor:crosshair!important}
.rv-pickhot{outline:2px solid var(--op-accent)!important;outline-offset:2px;background-color:var(--op-accent-soft)}

/* Arrange mode */
body.rv-arranging #app [data-rv-b]{outline:1.5px dashed var(--op-border);outline-offset:3px}
body.rv-arranging #app [data-rv-b].rv-hot{outline-color:var(--op-accent)}
body.rv-arranging #app [data-rv-b].rv-sel{outline:2px solid var(--op-accent);outline-offset:3px}
body.rv-arranging #app input,body.rv-arranging #app select,body.rv-arranging #app textarea{pointer-events:none}
body.rv-arranging #app a,body.rv-arranging #app button{cursor:grab}
body.rv-dragging,body.rv-dragging *{user-select:none!important;cursor:grabbing!important}
.rv-handle[data-rv-ui]{position:absolute;top:-12px;left:10px;z-index:4;font:inherit;font-size:12px;font-weight:600;line-height:1;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--op-border);background:var(--op-surface);color:var(--op-ink);cursor:grab;white-space:nowrap;box-shadow:var(--op-shadow);touch-action:none;text-transform:none;letter-spacing:0}
.rv-handle[data-rv-ui]{opacity:0;transition:opacity .12s}
.rv-hot>.rv-handle[data-rv-ui],.rv-sel>.rv-handle[data-rv-ui],.rv-handle[data-rv-ui]:focus-visible{opacity:1}
@media (hover:none){
  .rv-handle[data-rv-ui]{visibility:hidden;height:32px;top:-36px;padding:0 12px}
  .rv-sel>.rv-handle[data-rv-ui]{visibility:visible;opacity:1}
  body.rv-arranging #app [data-rv-b].rv-sel{margin-top:40px!important}
}
.rv-sel>.rv-handle[data-rv-ui]{background:var(--op-accent);border-color:var(--op-accent);color:var(--op-accent-ink)}
.rv-addhere[data-rv-ui]{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);z-index:4;font:inherit;font-size:12px;font-weight:600;line-height:1;height:24px;padding:0 10px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;border-radius:999px;border:1px dashed var(--op-accent);background:var(--op-surface);color:var(--op-accent);cursor:pointer;white-space:nowrap;display:none;text-transform:none;letter-spacing:0}
.rv-sel>.rv-addhere[data-rv-ui],.rv-addhere[data-rv-ui]:focus-visible{display:block}
.rv-hidden{display:none!important}
body.rv-arranging .rv-hidden.rv-arr{display:block!important;max-height:46px;min-height:46px;overflow:hidden;opacity:.85}
body.rv-arranging .rv-hidden.rv-gone{display:none!important}
.rv-ghost[data-rv-ui]{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 6px 12px;border-radius:inherit;background:repeating-linear-gradient(135deg,var(--op-surface-2) 0 8px,var(--op-surface) 8px 16px);color:var(--op-ink-muted);font-size:13px;font-weight:600}
.rv-ghost[data-rv-ui] span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-wrapzone{flex-direction:row!important;flex-wrap:wrap!important}
.rv-wrapzone>*{flex:1 1 100%;min-width:0}
.rv-wrapzone>.rv-half{flex:0 1 calc(50% - 8px);max-width:calc(50% - 8px)}
.rv-full{grid-column:1/-1}
@media (max-width:760px){.rv-wrapzone>.rv-half{flex-basis:100%;max-width:none}}
.rv-editing{outline:2px solid var(--op-focus)!important;outline-offset:2px;background:var(--op-accent-soft);cursor:text!important;border-radius:4px;user-select:text!important}
body.rv-arranging .rv-edited{text-decoration:underline dotted var(--op-accent);text-underline-offset:3px}
.rv-drag-ghost{opacity:.35}
.rv-drag-chosen{outline:2px solid var(--op-accent)!important}
.rv-drag-clone{opacity:.92!important;box-shadow:var(--op-shadow);transform:rotate(1deg)}

/* Added blocks */
.rv-added{border-style:dashed;border-color:var(--op-accent)}
.rv-added .rv-body{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.rv-added .checklist,.rv-added .tablewrap,.rv-added .actions{margin-top:10px}
.rv-want{background:var(--op-accent-soft)}
.rv-chart{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px;padding:8px;border-radius:8px;background:var(--op-surface-2)}
.rv-chart i{flex:1;border-radius:4px 4px 0 0;background:var(--op-accent);opacity:.55}
.rv-chart i:nth-child(1){height:35%}.rv-chart i:nth-child(2){height:60%}.rv-chart i:nth-child(3){height:45%}.rv-chart i:nth-child(4){height:80%}.rv-chart i:nth-child(5){height:55%}.rv-chart i:nth-child(6){height:90%}.rv-chart i:nth-child(7){height:70%}

/* Menu tabs */
.nav a{padding-inline:8px}
.nav.rv-navmore{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.rv-navhid{display:none!important}
.rv-navghost{opacity:.45;text-decoration:line-through}
.rv-navcustom .sep{display:none}
.nav a.rv-navidea{border:1px dashed var(--op-accent)}

/* Notes drawer: right panel on desktop */
.rv-drawer{position:fixed;top:calc(var(--top-h,120px) + 8px);right:8px;bottom:8px;z-index:60;width:min(440px,calc(100vw - 16px));display:flex;flex-direction:column;background:var(--op-surface);color:var(--op-ink);border:1px solid var(--op-rule);border-radius:12px;box-shadow:var(--op-shadow)}
.rv-dwh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--op-rule)}
.rv-dwh h2{font-size:1.05rem;overflow-wrap:anywhere}
.rv-dwb{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.rv-fs{border:0;padding:0;margin:0;min-width:0}
.rv-fs legend{margin-bottom:6px}
.rv-form textarea{min-height:72px}
.rv-anchorline{background:var(--op-accent-soft);border-radius:8px;padding:6px 10px}
.rv-note{border:1px solid var(--op-rule);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--op-surface)}
.rv-note.rv-focus{border-color:var(--op-accent);box-shadow:0 0 0 2px var(--op-accent-soft)}
.rv-nh{display:flex;align-items:flex-start;gap:10px}
.rv-nm{flex:1;min-width:0;line-height:1.3}
.rv-tags{gap:4px;justify-content:flex-end}
.rv-av{width:28px;height:28px;font-size:11px;flex:none}
.rv-q{font-size:12px;font-weight:600;color:var(--op-ink-muted);text-transform:uppercase;letter-spacing:.05em}
.rv-note .rv-t{font-size:14px}
.rv-strow{gap:8px}
.rv-strow select{min-height:30px;font-size:13px;padding:2px 6px}
.rv-replies{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--op-rule);display:flex;flex-direction:column;gap:8px}

function stepsFor(j) {
  const tpl = TPL[TYPES[j.type].tpl];
  const doneSteps = [], later = [];
  let running = null;
  const isDone = j.state === 'done';
  const passedStage = (st) => isDone || st < j.stage;
  tpl.forEach((s, i) => {
    let [st, text, rid] = s;
    if (j.type === 'statement' && rid === 'R10') rid = 'R11';
    if (j.type === 'query' && rid === 'R13' && j.state !== 'signoff' && !j.tray) { rid = 'R05'; }
    const r = rid === 'SV1' ? null : rule(rid);
    const tier = rid === 'SV1' ? 'auto' : (r ? r.tier : 'auto');
    const step = { st, text, rid, tier, v: ruleVersion(rid) };
    if (passedStage(st)) doneSteps.push(Object.assign(step, { at: new Date((isDone && j.doneAt ? j.doneAt : now()).getTime() - (tpl.length - i) * 2.6e6) }));
    else if (st === j.stage && !running && !['signoff', 'lodge', 'needs'].includes(j.state)) running = step;
    else later.push(step);
  });
  return { doneSteps, running, next: later[0] || null, later };
}
function evidenceFor(j, step) {
  const c = client(j.c);
  if (step.rid === 'SV1') return { ev: 'Invariants and the independent verifier', verdict: 'Passed' };
  if (step.rid === 'R01' && step.st === 0) return { ev: (TYPES[j.type].tpl === 'cipc' ? 'CIPC enquiry' : c.books) + ', ' + fWhen(step.at), verdict: 'Invariants passed' };
  if (step.rid === 'R04' || step.rid === 'R03') return { ev: 'Sent to ' + c.contacts[0].email + ' (on the allowlist)', verdict: 'Checked by Supervisor: passed' };
  return { ev: 'Working papers on the task file', verdict: 'Invariants passed' };
}

function sortTray(list) {

  if (t.kind === 'lodge') return 'Held: regulator submission (' + (t.auth === 'CIPC' ? 'CIPC' : 'SARS') + ')';

const TIER_ORDER = ['auto', 'hold', 'held'];
function projection(r, to) {
  const from = r.tier; if (from === to) return 'No change.';
  const n = r.vol; const fi = TIER_ORDER.indexOf(from), ti = TIER_ORDER.indexOf(to);
  if (to === 'held') return `Adds about ${n} items a month to ${r.id === 'R06' ? 'partners’' : 'your'} sign-off in To sign off.`;
  if (from === 'held') return `Removes about ${n} items a month from To sign off. They go out ${to === 'hold' ? 'after the ' + S.holdMin + '-minute window' : 'straight away'}.`;
  if (ti > fi) return `About ${n} items a month will wait ${S.holdMin} minutes in Going out soon. Nobody has to act on them.`;
  return `About ${n} items a month go out straight away instead of after the ${S.holdMin}-minute window.`;
}

/* ===================== Dialog, toasts, step-up ===================== */
let dlgReturn = null;
function modal(title, body, submitLabel, onSubmit, opts) {
  opts = opts || {};
  const d = $('#dlg');
  if (!d.open) dlgReturn = document.activeElement;
  d.innerHTML = `<form id="dlg-form" novalidate><div class="dlg-h"><h2 id="dlg-title">${esc(title)}</h2><button type="button" class="btn ghost sm" data-close>Close</button></div><div class="dlg-b">${body}<p class="err" id="dlg-err" role="alert"></p></div><div class="dlg-f">${opts.extra || ''}<button type="button" class="btn" data-close>${esc(opts.cancelLabel || (submitLabel ? 'Cancel' : 'Close'))}</button>${submitLabel ? `<button type="submit" class="btn ${opts.danger ? 'danger' : 'primary'}" id="dlg-ok">${esc(submitLabel)}</button>` : ''}</div></form>`;
  const f = $('#dlg-form');
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!onSubmit) return;
    const fd = {}; new FormData(f).forEach((v, k) => { fd[k] = v; });
    let res;
    try { res = onSubmit(fd, f, ev.submitter); } catch (err) { res = 'Something went wrong: ' + err.message; }
    if (res && typeof res.then === 'function') {
      const ok = $('#dlg-ok'); if (ok) { ok.disabled = true; ok.textContent = 'Saving…'; }
      try { res = await res; } catch (err) { res = (err && err.message) || 'Could not save.'; }
      if (ok) { ok.disabled = false; ok.textContent = submitLabel; }
    }
    if (typeof res === 'string') { $('#dlg-err').textContent = res; return; }
    closeDialog();
    if (typeof res === 'function') setTimeout(res, 0);
  });
  $$('[data-close]', d).forEach((b) => b.addEventListener('click', closeDialog));
  if (opts.onOpen) opts.onOpen(f);
  if (!d.open) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
  const first = f.querySelector('.dlg-b input:not([type="hidden"]):not([readonly]):not([disabled]), .dlg-b select, .dlg-b textarea:not([readonly])');
  (first || f.querySelector('[data-close]')).focus();
}
function closeDialog() {
  const d = $('#dlg');
  if (d.open) { try { d.close(); } catch (e) { d.removeAttribute('open'); } }
  d.innerHTML = '';
  if (dlgReturn && document.body.contains(dlgReturn)) { try { dlgReturn.focus(); } catch (e) { /* ignore */ } }
  dlgReturn = null;
}

function undoEntry(a, after) {
  modal('Undo', `<p>${esc(a.text)}</p><p class="small muted">Operon posts a reversing entry. Nothing is deleted, and both entries stay in the record.</p>${reasonField('ud-r', 'Reason')}`, 'Undo it', (fd) => {
    const reason = String(fd.reason || '').trim(); if (reason.length < 5) return 'Give a reason.';
    a.undone = true; if (after) after();
    addAudit({ text: 'Reversed: ' + a.text, reason, c: a.c, task: a.task, tier: a.tier, rule: a.rule, result: 'Reversed' });
    toast('Reversed. Both entries stay in the record.'); return () => render();
  });
}

function tryRun(tier) {
  const pick = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
  const log = (o) => { S.tryLog.push(o); if (S.tryLog.length > 12) S.tryLog.shift(); };
  if (tier === 'forbidden') {
    const what = pick('t-forb-k');
    addAudit({ kind: 'system', who: 'Operon', text: 'Blocked: ' + what + '. No tool exists for this.', tier: 'forbidden', result: 'Refused: no tool' });
    log({ tier, forb: true, text: 'No tool exists for this. Nothing can authorise it. (' + what + ')', href: '#observe', link: 'See it in the audit trail' });
    S.obsTab = 'audit'; toast('No tool exists for this. Nothing can authorise it.'); render(); return;
  }
  if (S.paused) { toast('Agents are paused.'); return; }
  const cid = pick('t-' + tier + '-c'); const c = client(cid); const kind = pick('t-' + tier + '-k'); const oj = openJobFor(cid);
  if (tier === 'auto') {
    const map = { chase: ['Sent a document reminder to ' + c.contacts[0].email, 'R03', 'Sent', false, 'Work Checker'], finding: ['Raised an exception: unexplained receipt of R 2,180.00', 'R01', 'Done', true, 'Work Checker'], status: ['Answered a status question from ' + c.contacts[0].name, 'R05', 'Sent', false, 'Comms Triage'] };
    const [text, r, res, rev, who] = map[kind];
    if (c.newClient) {
      const h = newHold({ task: oj ? oj.id : null, c: cid, text: kind === 'finding' ? 'Raise an exception: unexplained receipt of R 2,180.00' : 'Send ' + text.replace(/^Sent |^Answered /, ''), rule: 'R09', newClient: true, ms: S.tryFast ? 60000 : null });
      log({ tier: 'hold', text: `${c.short} is a new client, so even Auto actions wait. Goes through at ${fTime(new Date(h.fireAt))} unless cancelled.`, href: '#today', link: 'See Going out soon' });
      S.goingOpen = true; toast('New client: it waits in Going out soon.'); render(); return;
    }
    const a = addAudit({ kind: 'agent', who, text, c: cid, task: oj ? oj.id : null, tier: 'auto', rule: r, result: res, evidence: 'Try it simulation', verdict: 'Invariants passed', reversible: rev });
    if (oj) jobLog(oj, text, { tier: 'auto', who, auditId: a.id, undo: rev });
    if (kind === 'finding') S.findings.push({ e: c.entities[0], text: 'Unexplained receipt of R 2,180.00 on 9 Oct.', by: 'Work Checker', at: now(), status: 'Open' });
    log({ tier, text: 'Done straight away: ' + text + ' (' + c.short + ').', href: '#done', link: 'See it in Done' });
    toast('Done straight away. It is in Done and the audit trail.'); render(); return;
  }
  if (tier === 'hold') {

/* ===================== CSV dry run ===================== */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}
const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
function validateCsv(text) {
  if (!text.trim()) return { error: 'Paste a CSV or choose a file first.' };
  const rows = parseCSV(text);
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const need = ['name', 'registration_number', 'income_tax_number', 'vat_number', 'year_end', 'manager_email'];
  const missing = need.filter((h) => !head.includes(h));
  if (missing.length) return { error: 'Missing columns: ' + missing.join(', ') + '. The first row must name the columns.' };
  if (rows.length > 501) return { error: 'The dry run takes up to 500 rows at a time.' };
  const seen = {};
  const list = rows.slice(1).map((r, i) => {
    const v = {}; need.forEach((h) => { v[h] = (r[head.indexOf(h)] || '').trim(); });
    const errors = []; let skip = '';
    if (!v.name) errors.push('Name is missing.');
    if (!/^\d{4}\/\d{6}\/\d{2}$/.test(v.registration_number)) errors.push('Registration number must look like 2099/123456/07.');
    if (!/^\d{10}$/.test(v.income_tax_number)) errors.push('Income tax number must be 10 digits.');
    if (v.vat_number && !/^4\d{9}$/.test(v.vat_number)) errors.push('VAT number must be 10 digits starting with 4.');
    const ye = v.year_end.toLowerCase();
    if (!MONTHS.includes(ye) && !MONTHS.map((m) => m.slice(0, 3)).includes(ye)) errors.push('Year-end must be a month, for example February.');
    if (!S.people.some((p) => p.email.toLowerCase() === v.manager_email.toLowerCase())) errors.push('Manager email is not a member of your firm.');
    const dupe = S.clients.find((c) => c.reg === v.registration_number);
    if (dupe) skip = 'Already a client: ' + dupe.name + '. It would be skipped.';
    if (seen[v.registration_number]) errors.push('Same registration number as row ' + seen[v.registration_number] + '.');
    seen[v.registration_number] = i + 2;
    return { n: i + 2, v, errors, skip };
  });
  return { list };
}

function rvExport(fmt) {

  if (fmt === 'csv') {

function dcAudit(k, o) {
  return addAudit(Object.assign({ c: k.c, task: k.task && task(k.task) ? k.task : null, evidence: 'Document collection ' + k.id }, o));
}
function dcAdvanceTask(k) {
  if (!k.task || k.fed) return;
  const j = task(k.task); if (!j) return;
  if (!dcWaiting(j)) { dcAct(k, 'Task ' + j.id + ' is not waiting on the client, so it was left as it is'); return; }
  k.fed = true;
  const from = stateWord(j)[1]; const c = client(j.c); const p = dcProg(k);
  j.state = 'ai'; j.stage = Math.max(1, j.stage); j.wait = null;
  j.text = 'The documents came back through Document collections (“' + k.title + '”). The AI picked the task up again.';
  j.next = 'Works with the new documents, then the Supervisor checks';
  jobLog(j, 'Documents back from the client: “' + k.title + '” is complete. Moved from ' + from + ' to AI at work', { tier: 'auto', who: roleOf(j) });
  addAudit({ kind: 'agent', who: roleOf(j), text: 'Moved ' + j.title + ' for ' + c.short + ' from ' + from + ' to AI at work: the document collection is complete', c: j.c, task: j.id, tier: 'auto', rule: 'R02', result: 'Done', evidence: 'Document collection ' + k.id + ': ' + p.d + ' of ' + p.n + ' items in', verdict: 'Invariants passed' });
  dcAct(k, 'Task ' + j.id + ' moved from ' + from + ' to AI at work');
  toast('Task ' + j.id + ' moved to AI at work. The documents are in.');
}
function dcComplete(k, byClient) {
  if (k.status === 'complete') return;
  const p = dcProg(k);
  k.status = 'complete'; k.completedAt = now(); k.awaitingConfirm = false;
  if (byClient) {
    dcAct(k, 'Client submitted all documents. Collection complete', 'Client');
    dcAudit(k, { kind: 'system', who: 'Client portal', text: k.contact.name + ' submitted all documents for “' + k.title + '” (' + client(k.c).short + ')', result: 'Done', evidence: 'Client portal: ' + p.d + ' of ' + p.n + ' items' });
  } else {
    dcAct(k, 'Marked complete by ' + me().name, me().name);
    dcAudit(k, { text: 'Marked the document collection “' + k.title + '” complete for ' + client(k.c).short, result: 'Done', evidence: 'Document collection ' + k.id + ': ' + p.d + ' of ' + p.n + ' items in' });
  }
  dcAdvanceTask(k);
}
function dcRemindOne(k, why) {
  const c = client(k.c);
  k.reminders += 1; k.lastRem = now();
  const via = S.coll.set.wa ? 'email and WhatsApp' : 'email';
  dcAct(k, 'Reminder ' + k.reminders + ' sent by ' + via + ' (Auto, Comms Triage)');
  dcAudit(k, { kind: 'agent', who: 'Comms Triage', text: 'Sent reminder ' + k.reminders + ' to ' + k.contact.email + ' for “' + k.title + '” (' + c.short + ')', tier: 'auto', rule: 'R03', result: 'Sent', evidence: why || ('Reminder cadence: ' + dcCadWord()), verdict: 'Invariants passed' });
  const j = k.task ? task(k.task) : null;
  if (j && j.state !== 'done') { jobLog(j, 'Document reminder ' + k.reminders + ' sent for “' + k.title + '”', { tier: 'auto', who: 'Comms Triage' }); if (j.wait) j.wait.rem = (j.wait.rem || 0) + 1; }
}
function dcRunReminders() {
  const sent = [], skipped = [];
  for (const k of S.coll.list) {
    if (!dcActive(k)) continue;
    if (!S.coll.set.auto) { skipped.push({ id: k.id, why: 'Automatic reminders are off' }); continue; }
    if (k.awaitingConfirm) { skipped.push({ id: k.id, why: 'Awaiting the client’s confirmation' }); continue; }
    const n = k.due ? daysTo(k.due) : null;
    if (n != null && n > 3) { skipped.push({ id: k.id, why: 'Due in ' + n + ' days' }); continue; }
    const next = dcNextRem(k);
    if (daysTo(next) > 0) { skipped.push({ id: k.id, why: (k.lastRem ? 'Reminded ' + fDM(k.lastRem) : 'Sent ' + fDM(k.sent)) + '; next ' + fDM(next) + ', ' + dcCadWord() }); continue; }
    dcRemindOne(k, 'Today’s reminder run: ' + (n == null ? 'no due date' : n < 0 ? 'overdue' : 'due within 3 days') + ', ' + dcCadWord());
    sent.push(k.id);
  }
  addAudit({ kind: 'agent', who: 'Comms Triage', text: 'Ran today’s document reminders: ' + sent.length + ' sent, ' + skipped.length + ' skipped', tier: 'auto', rule: 'R03', result: 'Done', evidence: 'Document collections reminder run (' + dcCadWord() + ')', verdict: 'Invariants passed' });
  S.coll.lastRun = { at: now(), sent, skipped };
  toast(S.coll.set.auto ? 'Reminders run: ' + sent.length + ' sent, ' + skipped.length + ' skipped. All logged in the audit trail.' : 'Automatic reminders are off, so nothing was sent.');
}

function dcAttach(target, f) {
  const name = dcClean(f.name, 180) || 'file'; const size = Math.max(0, Number(f.size) || 0);
  if (size > DC_MAX_FILE) { toast('That file is over 50 MB. Send a smaller file.'); return; }
  if (target.kind === 'tpl') {
    const t = dcTpl(target.tpl); if (!t) return;
    t.files.push({ name, size });
    addAudit({ text: 'Added the template file “' + name + '” to ' + t.name, result: 'Done', evidence: 'Document collections templates' });
    toast('Added ' + name + ' (' + dcSize(size) + '). Only its name and size are kept.'); render(); return;
  }
  const k = dcByToken(target.token); const it = k && k.items.find((x) => x.id === target.item);
  if (!k || !it || !dcActive(k)) { toast('This request is closed. Nothing was uploaded.'); return; }
  it.state = 'uploaded'; it.file = { name, size, at: now() };
  dcAct(k, 'Client uploaded “' + name + '” (' + dcSize(size) + ') for ' + it.name, 'Client');
  dcAudit(k, { kind: 'system', who: 'Client portal', text: k.contact.name + ' uploaded “' + name + '” for ' + it.name + ' (' + client(k.c).short + ')', result: 'Done', evidence: 'Client portal upload, ' + dcSize(size) + ' (simulated: the file was not read or sent)' });
  dcMaybeProgress(k);
  toast('Uploaded ' + name + '.');
  render();
}

/* ---------- uploads: one hidden file input outside #app, so a timer render can't destroy it mid-dialog ---------- */
function dcFileInput() {
  let el = document.getElementById('dc-file');
  if (!el) {
    el = document.createElement('input');
    el.type = 'file'; el.id = 'dc-file'; el.hidden = true; el.tabIndex = -1;
    el.setAttribute('aria-hidden', 'true');
    el.addEventListener('change', () => {
      const f = el.files && el.files[0]; const target = S.coll ? S.coll.upTarget : null;
      if (S.coll) S.coll.upTarget = null;
      if (f && target) dcAttach(target, { name: f.name, size: f.size });
      el.value = '';
    });
    document.body.appendChild(el);
  }
  return el;
}
function dcPick(target) { S.coll.upTarget = target; const el = dcFileInput(); el.value = ''; el.click(); }
const dcHasFiles = (e) => { try { return !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'); } catch (x) { return false; } };
const dcOnPortal = () => { try { return routeOf().name === 'portal'; } catch (x) { return false; } };
document.addEventListener('dragover', (e) => {
  if (!dcHasFiles(e) || !dcOnPortal()) return;
  e.preventDefault();
  const row = e.target.closest && e.target.closest('[data-dc-drop]');
  $$('.dc-over').forEach((x) => { if (x !== row) x.classList.remove('dc-over'); });
  if (row) { row.classList.add('dc-over'); e.dataTransfer.dropEffect = 'copy'; } else e.dataTransfer.dropEffect = 'none';
});
document.addEventListener('dragleave', (e) => { const row = e.target.closest && e.target.closest('[data-dc-drop]'); if (row && !row.contains(e.relatedTarget)) row.classList.remove('dc-over'); });
document.addEventListener('drop', (e) => {
  if (!dcHasFiles(e) || !dcOnPortal()) return;
  e.preventDefault();
  $$('.dc-over').forEach((x) => x.classList.remove('dc-over'));
  const row = e.target.closest && e.target.closest('[data-dc-drop]');
  if (!row) { toast('Drop the file on the document it belongs to.'); return; }
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  dcAttach({ token: row.dataset.token, item: row.dataset.dcDrop }, { name: f.name, size: f.size });
});

/* ---------- shared pieces ---------- */
function dcCard(k) {
  const c = client(k.c); const p = dcProg(k); const due = dcDue(k);
  return `<a class="jobcard dc-card" href="${dcHref(k.id)}">
    <span class="jc-client">${esc(c.short)}</span>
    <div class="jc-title">${esc(k.title)}</div>
    <div class="jc-meta"><span class="pill">${esc(dcTypeName(k.type))}</span>${k.period ? `<span>${esc(k.period)}</span>` : ''}</div>
    <div class="dc-prog">${dcBar(p)}<span class="small mono">${p.d}/${p.n} docs · ${p.pct}%</span></div>
    <div class="jc-meta"><span class="dc-due${due.red ? ' bad' : ''}">${esc(due.text)}</span>${dcUnopened(k) ? '<span class="dc-bang" title="Not opened by the client in 36 hours" aria-hidden="true">!</span><span class="sr">Not opened by the client in 36 hours</span>' : ''}${k.awaitingConfirm && dcActive(k) ? '<span class="pill warn">Awaiting client confirmation</span>' : ''}</div>
    ${k.task || dcChasing(k) || k.rec ? `<div class="jc-meta">${k.task ? `<span class="wait">Feeds task <b>${esc(k.task)}</b></span>` : ''}${dcChasing(k) ? `<span class="dc-chase">AI chasing ${tierBadge('auto')}</span>` : ''}${k.rec ? `<span class="pill">Repeats ${esc(k.rec)}</span>` : ''}</div>` : ''}
  </a>`;
}
function dcRecent() {
  const out = [];
  for (const k of S.coll.list) if (k.status !== 'cancelled') for (const it of k.items) if (it.file && it.file.at) out.push({ k, it, at: it.file.at });
  return out.sort((a, b) => b.at - a.at);
}
function dcMiniRow(r) {
  return `<li><a class="dc-minirow" href="${dcHref(r.k.id)}"><span class="dc-mt">${esc(r.it.file.name)}</span><span class="small muted">${esc(r.it.name)} · ${esc(client(r.k.c).short)} · ${esc(fWhen(r.at))}</span></a></li>`;
}

/* ---------- board, templates and settings ---------- */
function viewCollections() {
  const D = S.coll; const tab = ['board', 'templates', 'settings'].includes(D.tab) ? D.tab : 'board';
  const tabs = [['board', 'Board'], ['templates', 'Templates'], ['settings', 'Reminders & settings']];
  const body = tab === 'templates' ? dcViewTemplates() : tab === 'settings' ? dcViewSettings() : dcViewBoard();
  return `<div class="stack dc">
    <div class="pagehead" data-rv-key="coll-head"><div class="stack" style="gap:6px"><h1>Document collections</h1><p class="muted">Send a client a checklist. They upload through a simple portal, Operon chases them, and the task moves on by itself when everything is in.</p></div>
      <div class="row">${btn('+ New collection', 'dcNew', { cls: 'primary' })}</div></div>
    <div class="seg dc-tabs" role="group" aria-label="Document collections sections" data-rv-key="coll-tabs">${tabs.map(([k, l]) => `<button type="button" data-act="dcTab" data-v="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>
    ${body}
  </div>`;
}
function dcViewBoard() {
  const D = S.coll; const q = D.q.trim().toLowerCase();
  const live = D.list.filter((k) => k.status !== 'cancelled' && k.status !== 'archived');
  const shown = live.filter((k) => !q || k.title.toLowerCase().includes(q) || client(k.c).name.toLowerCase().includes(q));
  const docs = D.list.reduce((a, k) => a + k.items.filter((i) => i.state === 'uploaded').length, 0);
  const stat = (key, n, label, sub) => `<div class="card dc-stat" data-rv-key="coll-stat-${key}"><span class="dc-num">${n}</span><span class="dc-lbl">${label}</span><span class="small muted">${sub}</span></div>`;
  const cols = DC_COLS.filter(([k]) => k !== 'filed' || D.set.filedCol);
  const byDue = (a, b) => (a.due ? a.due.getTime() : 9e15) - (b.due ? b.due.getTime() : 9e15);
  const recent = dcRecent().slice(0, 6);
  const closed = D.list.filter((k) => k.status === 'cancelled' || k.status === 'archived');
  return `<section class="dc-stats" aria-label="Collection numbers" data-rv-key="coll-stats" data-rv-zone="coll-stats">
      ${stat('clients', new Set(live.map((k) => k.c)).size, 'Total clients', 'with a collection on the board')}
      ${stat('active', live.filter(dcActive).length, 'Active collections', live.filter(dcOverdue).length + ' overdue')}
      ${stat('complete', live.filter((k) => k.status === 'complete').length, 'Complete', live.filter((k) => k.status === 'complete' && k.filed).length + ' filed on SARS')}
      ${stat('docs', docs, 'Documents collected', 'across all collections')}
    </section>
    <div class="dc-actions" data-rv-key="coll-actions">
      ${btn('Bulk send', 'dcBulk')}${btn('Templates', 'dcTab', { data: { v: 'templates' } })}${btn('Reminders & settings', 'dcTab', { data: { v: 'settings' } })}
      <label class="f dc-search" for="dc-q">Search<input id="dc-q" class="search" type="search" data-on="dcQ" value="${esc(D.q)}" placeholder="Client or collection"></label>
    </div>
    <section class="stack boardsec" style="gap:10px" aria-label="Collections board" data-rv-key="coll-board">
      <div class="row between"><h2>Collections board</h2><p class="small muted">Overdue is worked out from the due date. Cards move by themselves as clients upload.</p></div>
      ${q && !shown.length ? `<div class="card dc-empty"><p>No collections match “${esc(D.q.trim())}”.</p>${btn('Clear search', 'dcQClear', { cls: 'sm' })}</div>` : `<div class="board dc-board${cols.length === 5 ? ' dc-cols5' : ''}">${cols.map(([key, label, sub]) => {
        const ks = shown.filter((k) => dcColumn(k) === key || (key === 'complete' && !D.set.filedCol && dcColumn(k) === 'filed')).sort(byDue);
        return `<section class="col" aria-label="${esc(label)}" data-rv-key="coll-col-${key}"><header><h3>${esc(label)}</h3><p>${esc(sub)} · ${ks.length}</p></header>${ks.map(dcCard).join('') || '<p class="empty-col">Nothing here.</p>'}</section>`;
      }).join('')}</div>`}
    </section>
    <section class="card" data-rv-key="coll-recent"><h2>Just came back</h2><p class="small muted">The latest uploads from clients, newest first.</p>
      ${recent.length ? `<ul class="plain dc-mini">${recent.map(dcMiniRow).join('')}</ul>` : '<p class="muted">Nothing has come back yet.</p>'}</section>
    ${closed.length ? `<section class="card" data-rv-key="coll-closed"><h2>Cancelled and archived</h2><ul class="plain dc-mini">${closed.map((k) => `<li><a class="dc-minirow" href="${dcHref(k.id)}"><span class="dc-mt">${esc(k.title)}</span><span class="small muted">${esc(client(k.c).short)} · ${esc(DC_STATUS[k.status])}</span></a></li>`).join('')}</ul></section>` : ''}`;
}
function dcViewTemplates() {
  const D = S.coll;
  const sub = `<div class="seg" role="group" aria-label="Template kind" data-rv-key="coll-tpl-tabs">${[['client', 'Client types'], ['doc', 'Document types']].map(([k, l]) => `<button type="button" data-act="dcTplTab" data-v="${k}" aria-pressed="${D.tplTab === k}">${l}</button>`).join('')}</div>`;
  if (D.tplTab === 'doc') {
    const used = (dt) => {  // the whole name (or its plural), not inside another word
      const re = new RegExp('(?<![a-z0-9])' + dt.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 's?(?![a-z0-9])');
      return D.tpls.filter((t) => t.items.some((i) => re.test(i.name.toLowerCase()))).length;
    };
    return `${sub}<section class="card stack" style="gap:10px" data-rv-key="coll-doctypes"><h2>Document types</h2><p class="small muted">The documents you ask for most, with the wording clients see. Client-type checklists draw on these.</p>
      <div class="tablewrap"><table><thead><tr><th>Document</th><th>Section</th><th>What the client sees</th><th class="r">Used in</th></tr></thead><tbody>${D.dtypes.map((d) => `<tr><td>${esc(d.name)}</td><td>${esc(d.sec)}</td><td class="small">${esc(d.desc || '–')}</td><td class="r num">${used(d)}</td></tr>`).join('')}</tbody></table></div>
      <form data-form="dcDtAdd" class="dc-addform" novalidate><label class="f" for="dc-dt-sec">Section<select id="dc-dt-sec" name="sec">${DC_SECS.map((s) => `<option>${esc(s)}</option>`).join('')}</select></label>
        <label class="f" for="dc-dt-name">Document<input id="dc-dt-name" name="name" maxlength="120" placeholder="e.g. Fuel card statement"></label>
        <label class="f" for="dc-dt-desc">What the client sees (optional)<input id="dc-dt-desc" name="desc" maxlength="200"></label>
        <button class="btn primary" type="submit">+ Add document type</button></form>
      <p class="err" id="dc-dt-err" role="alert"></p></section>`;
  }
  const t = dcTpl(D.tplSel) || D.tpls[0];
  const secs = t.secs.map((s, i) => {
    const its = t.items.filter((x) => x.sec === s);
    return `<div class="dc-group"><div class="row between"><p class="eyebrow">${esc(s)}</p>${btn('Rename section', 'dcSecRen', { cls: 'sm ghost', data: { i } })}</div>
      ${its.length ? `<ul class="plain dc-titems">${its.map((x) => `<li class="dc-titem${x.parked ? ' dc-parked' : ''}"><span class="stack" style="gap:2px"><span class="dc-tn">${esc(x.name)}${x.parked ? ' <span class="pill">Parked</span>' : ''}</span>${x.desc ? `<span class="small muted">${esc(x.desc)}</span>` : ''}</span>
        <span class="actions">${btn('Edit', 'dcTiEdit', { cls: 'sm', data: { id: x.id } })}${btn(x.parked ? 'Unpark' : 'Park', 'dcTiPark', { cls: 'sm', data: { id: x.id } })}${t.secs.length > 1 ? btn('Copy to…', 'dcTiCopy', { cls: 'sm', data: { id: x.id } }) : ''}</span></li>`).join('')}</ul>` : '<p class="small muted">No items in this section yet.</p>'}</div>`;
  }).join('');
  return `${sub}<div class="dc-tplgrid" data-rv-zone="coll-tpl" data-rv-key="coll-tpl-area">
    <section class="card stack" style="gap:8px" data-rv-key="coll-tpl-types"><h2>Client types</h2><p class="small muted">Each client type has a master checklist. A new collection starts from it.</p>
      <ul class="plain dc-tlist">${D.tpls.map((x) => `<li><button type="button" class="ti" data-act="dcTplSel" data-id="${esc(x.id)}" aria-current="${x.id === t.id}"><span class="t1">${esc(x.name)}</span><span class="t2"><span>${dcPl(x.items.filter((i) => !i.parked).length, 'document')}</span><span>${dcPl(x.secs.length, 'section')}</span></span></button></li>`).join('')}</ul></section>
    <section class="card stack" style="gap:10px" data-rv-key="coll-tpl-checklist"><div class="row between"><h2>Master checklist</h2>${btn('+ Add section', 'dcSecAdd', { cls: 'sm' })}</div>
      <p class="small muted">Client type: <strong>${esc(t.name)}</strong>. Parked items stay in the template but are left out of new collections.</p>
      ${secs}
      <form data-form="dcTplAdd" class="dc-addform" novalidate><label class="f" for="dc-ta-sec">Section<select id="dc-ta-sec" name="sec">${t.secs.map((s) => `<option>${esc(s)}</option>`).join('')}</select></label>
        <label class="f" for="dc-ta-name">Document<input id="dc-ta-name" name="name" maxlength="120" placeholder="e.g. Vehicle logbook"></label>
        <label class="f" for="dc-ta-desc">Description (optional)<input id="dc-ta-desc" name="desc" maxlength="200"></label>
        <button class="btn primary" type="submit">+ Add item</button></form>
      <p class="err" id="dc-ta-err" role="alert"></p></section>
    <section class="card stack dc-files" style="gap:8px" data-rv-key="coll-tpl-files"><div class="row between"><h2>Template files</h2>${btn('+ Add a file', 'dcTplFile', { cls: 'sm' })}</div><p class="small muted">Files clients see next to this checklist, such as a request letter. Only the name and size are kept in the preview.</p>
      ${t.files.length ? `<ul class="plain dc-mini">${t.files.map((f, i) => `<li class="row between dc-frow"><span class="dc-file">${esc(f.name)} <span class="muted">· ${esc(dcSize(f.size))}</span></span>${btn('Download', 'dcFileDl', { cls: 'sm', data: { i } })}</li>`).join('')}</ul>` : '<p class="muted">No files yet.</p>'}</section>
  </div>`;
}
function dcViewSettings() {
  const st = S.coll.set; const run = S.coll.lastRun;
  const chk = (k, label, sub) => `<label class="dc-check" for="dc-s-${k}"><input type="checkbox" id="dc-s-${k}" data-on="dcSet" data-k="${k}"${st[k] ? ' checked' : ''}><span>${label}${sub ? `<br><span class="hint">${sub}</span>` : ''}</span></label>`;
  const name = (id) => { const k = dcGet(id); return k ? client(k.c).short + ': ' + k.title : id; };
  return `<div class="dc-setgrid" data-rv-zone="coll-settings" data-rv-key="coll-settings-area">
    <section class="card stack" style="gap:12px" data-rv-key="coll-rem-auto"><h2>Automatic reminders</h2>
      ${chk('auto', 'Send reminders automatically', 'Reminders are Auto tier: Comms Triage sends them and logs each one.')}
      <div class="stack" style="gap:6px"><p class="small muted">How often</p><div class="seg" role="group" aria-label="Reminder cadence">${DC_CADENCE.map(([v, l]) => `<button type="button" data-act="dcCad" data-v="${v}" aria-pressed="${st.cadence === v}">${l}</button>`).join('')}</div></div>
      ${st.cadence === 'custom' ? `<label class="f dc-narrow" for="dc-s-custom">Every how many days<input id="dc-s-custom" type="number" min="1" max="60" inputmode="numeric" data-on="dcSet" data-k="custom" value="${esc(st.custom)}"></label>` : ''}
      <p class="small">Every morning at about 9:00, Operon reminds each client who still owes documents, <span id="dc-s-cadword">${esc(dcCadWord())}</span>. Clients who have uploaded everything and only need to confirm are left alone.</p>
      ${chk('wa', 'Also remind by WhatsApp', 'Only clients who opted in. Simulated in the preview: nothing is sent.')}
    </section>
    <section class="card stack" style="gap:12px" data-rv-key="coll-rem-run"><h2>Today’s reminders</h2>
      <p class="small muted">Reminds collections that are pending or in progress and are overdue, due within 3 days, or have no due date, once the cadence has passed since the last reminder. Skips any waiting for the client’s confirmation, and sends nothing while automatic reminders are off. Everything is logged.</p>
      <div>${btn('Run today’s reminders now (demo)', 'dcRun', { cls: 'primary' })}</div>
      ${run ? `<div class="well stack" style="gap:6px"><p><strong>Last run at ${esc(fTime(run.at))}</strong>: ${run.sent.length} sent, ${run.skipped.length} skipped.</p>
        ${run.sent.length ? `<ul class="plain small">${run.sent.map((id) => `<li>Sent: ${esc(name(id))}</li>`).join('')}</ul>` : ''}
        ${run.skipped.length ? `<ul class="plain small muted">${run.skipped.map((x) => `<li>Skipped: ${esc(name(x.id))} (${esc(x.why)})</li>`).join('')}</ul>` : ''}</div>` : ''}
    </section>
    <section class="card stack" style="gap:12px" data-rv-key="coll-settings"><h2>Further settings</h2>
      ${chk('confirm', 'Ask “Is that everything?” before completing', 'The client confirms before the collection moves to Complete.')}
      ${chk('filedCol', 'Show a Filed on SARS column on the board', 'For returns that have been filed on eFiling.')}
      <label class="f dc-narrow" for="dc-s-verify">How clients verify in the portal<select id="dc-s-verify" data-on="dcSet" data-k="verify">${Object.entries(DC_VERIFY).map(([k, v]) => `<option value="${k}"${st.verify === k ? ' selected' : ''}>${esc(v[0])}</option>`).join('')}</select></label>
    </section>
  </div>`;
}

/* ---------- one collection ---------- */
function viewCollection(id) {
  if (id === 'new') return dcViewNew();
  const k = dcGet(id);
  if (!k) return `<div class="stack dc"><nav class="crumbs" aria-label="Breadcrumb" data-rv-key="coll-detail-crumbs"><a href="#collections">Document collections</a></nav>
    <h1>Collection not found</h1><p class="muted">There is no collection with that link in this demo. It may have been made before the demo data was reset.</p><p><a class="btn" href="#collections">Back to Document collections</a></p></div>`;
  const c = client(k.c); const p = dcProg(k); const due = dcDue(k); const j = k.task ? task(k.task) : null;
  const secs = []; for (const it of k.items) if (!secs.includes(it.sec)) secs.push(it.sec);
  const itemRow = (it) => {
    let st;
    if (it.state === 'uploaded') st = `<span class="pill ok">${I.check} Uploaded</span><span class="dc-file">${esc(it.file.name)} · ${esc(dcSize(it.file.size))} · ${esc(fWhen(it.file.at))}</span>${btn('Download', 'dcDl', { cls: 'sm', data: { id: k.id, item: it.id } })}`;
    else if (it.state === 'na') st = '<span class="pill">Not applicable</span>';
    else st = '<span class="pill bad">Missing</span>';
    return `<li class="dc-item"><span class="stack" style="gap:2px"><strong>${esc(it.name)}</strong>${it.desc ? `<span class="small muted">${esc(it.desc)}</span>` : ''}</span>
      <span class="dc-istate">${st}${it.due && it.state === 'missing' ? `<span class="pill warn">Due ${esc(fDM(it.due))}</span>` : ''}</span></li>`;
  };
  const A = (l, a, o) => btn(l, a, Object.assign({ cls: 'sm' }, o, { data: Object.assign({ id: k.id }, (o && o.data) || {}) }));
  let acts = '';
  if (dcActive(k)) acts = A('Preview portal', 'dcPreview', { cls: 'sm primary' }) + A('Copy portal link', 'dcCopy') + A('Resend portal link', 'dcResend') + A('Send via WhatsApp', 'dcWa') + A('Send a reminder now', 'dcRemind') + A('Mark complete', 'dcDone') + A('Download all (.zip)', 'dcZip') + A('Cancel', 'dcCancel', { cls: 'sm danger' });
  else if (k.status === 'complete') acts = A('Preview portal', 'dcPreview') + A('Reopen', 'dcReopen') + A('Download all (.zip)', 'dcZip') + A(k.filed ? 'Unfile' : 'File on SARS', 'dcFile') + A('Archive', 'dcArchive');
  else if (k.status === 'archived') acts = A('Unarchive', 'dcUnarchive') + A('Download all (.zip)', 'dcZip');
  else acts = A('Reopen', 'dcReopen') + A('Preview portal', 'dcPreview');
  const next = dcChasing(k) ? (() => { const d = dcNextRem(k); return daysTo(d) > 0 ? fDM(d) + ', about 09:00' : 'due today'; })() : (dcActive(k) ? (k.awaitingConfirm ? 'none while the client confirms' : 'Automatic reminders are off') : '–');
  return `<div class="stack dc">
    <nav class="crumbs" aria-label="Breadcrumb" data-rv-key="coll-detail-crumbs"><a href="#collections">Document collections</a><span>/</span><a href="#client-${c.id}">${esc(c.name)}</a></nav>
    <div class="pagehead" data-rv-key="coll-detail-head"><div class="stack" style="gap:6px"><h1>${esc(k.title)}</h1>
      <div class="row">${dcStatusPill(k)}<span class="dc-due${due.red ? ' bad' : ''}">${esc(due.text)}</span><span class="pill">${esc(dcTypeName(k.type))}</span>${k.period ? `<span class="small muted">${esc(k.period)}</span>` : ''}${k.awaitingConfirm && dcActive(k) ? '<span class="pill warn">Awaiting client confirmation</span>' : ''}${dcUnopened(k) ? '<span class="pill warn">Not opened in 36 hours</span>' : ''}</div></div></div>
    <div class="dc-detail" data-rv-key="coll-detail-body">
      <div class="stack" data-rv-zone="coll-detail-main">
        <section class="card stack" style="gap:10px" data-rv-key="coll-detail-checklist"><div class="row between"><h2>Checklist</h2><span class="small muted">${p.d} of ${p.n} done · ${p.up} uploaded, ${p.na} not applicable</span></div>
          <div class="dc-prog">${dcBar(p)}<span class="small mono">${p.pct}%</span></div>
          ${secs.map((s) => `<div class="dc-group"><p class="eyebrow">${esc(s)}</p><ul class="plain dc-items">${k.items.filter((i) => i.sec === s).map(itemRow).join('')}</ul></div>`).join('')}
          <p class="small muted">No per-document accept or reject: when everything you need is in, the collection is complete.</p></section>
        <section class="card stack" style="gap:8px" data-rv-key="coll-detail-activity"><h2>Activity</h2><p class="small muted">Also written to the audit trail. Reminders and chases are Auto tier (Comms Triage).</p>
          <ul class="steps">${k.act.slice().reverse().map((a) => `<li><div class="step-h"><span class="st">${esc(a.text)}</span></div><div class="step-m"><span class="mono">${esc(fWhen(a.at))}</span><span>${esc(a.by)}</span></div></li>`).join('')}</ul></section>
      </div>
      <div class="stack dc-side" data-rv-zone="coll-detail-side">
        <section class="card stack" style="gap:10px" data-rv-key="coll-detail-actions"><h2>Send and manage</h2><p class="small muted">All simulated: nothing is sent, downloaded or filed for real.</p><div class="actions">${acts}</div></section>
        <section class="card" data-rv-key="coll-detail-facts"><h2>Details</h2><dl class="facts">
          <dt>Client</dt><dd><a href="#client-${c.id}">${esc(c.short)}</a></dd>
          <dt>Contact</dt><dd>${esc(k.contact.name)}<br><span class="mono small">${esc(k.contact.email)}</span><br><span class="mono small">${esc(k.contact.phone)}</span> <span class="small muted">(demo)</span></dd>
          <dt>Sent</dt><dd>${k.sent ? esc(fWhen(k.sent)) : '–'} · ${esc(k.via)}</dd>
          <dt>Last opened</dt><dd>${k.opened ? esc(fWhen(k.opened)) : 'Not opened yet'}</dd>
          <dt>Reminders</dt><dd>${k.reminders} sent · next ${esc(next)}</dd>
          <dt>Repeats</dt><dd>${k.rec ? esc(k.rec) + (k.titleTpl ? ` <span class="small muted">(${esc(k.titleTpl)})</span>` : '') : 'No'}</dd>
          <dt>Portal check</dt><dd>${esc(DC_VERIFY[S.coll.set.verify][0])}</dd></dl></section>
        <section class="card stack" style="gap:10px" data-rv-key="coll-detail-task"><h2>Linked task</h2>
          ${j ? `<p class="small muted">${k.fed ? 'This collection fed the task when it was completed.' : dcWaiting(j) ? 'When this collection is complete, the task moves from Awaiting client to AI at work.' : 'Task ' + esc(j.id) + ' is not waiting on the client, so ' + (k.status === 'complete' || k.status === 'archived' ? 'completing this collection left it as it is.' : 'completing this collection will not move it.')}</p>${jobCard(j)}` : '<p class="muted">Not linked to a task.</p>'}</section>
      </div>
    </div>
  </div>`;
}

/* ---------- new collection ---------- */
function dcTplRows(tid) {
  const t = dcTpl(tid); if (!t) return [];
  return t.items.filter((x) => !x.parked).map((x) => ({ id: dcNid('r'), sec: x.sec, name: x.name, desc: x.desc, due: '' }));
}
function dcDefaultType(cid) { return cid === 'C20' ? 'newclient' : 'company'; }
function dcDraft() {
  if (!S.coll.draft) {
    S.coll.draft = { c: '', title: '', period: '', due: dcIso(day(7)), mode: 'template', type: 'company', rows: dcTplRows('company'), send: 'email', rec: '', feeds: '', err: '' };
  }
  return S.coll.draft;
}
function dcDraftSetClient(d, cid) {
  d.c = client(cid) ? cid : '';
  d.type = dcDefaultType(d.c);
  if (d.mode === 'template') d.rows = dcTplRows(d.type);
  const w = S.tasks.find((j) => j.c === d.c && dcWaiting(j));
  d.feeds = w ? w.id : '';
}
