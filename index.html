        <p class="hint">${esc('You record them as ' + S.role + ' (' + me().name + '). Leave a row empty to drop it. The AI reading is simulated, so a person keys in what the document shows. Recalculate afterwards to use them.')}</p>`,
      'Record values', (fd) => {
        const used = new Set(all.filter((l) => l.docId !== d.id).map((l) => l.id));
        let next = all.reduce((m, l) => Math.max(m, +(/^L(\d+)$/.exec(l.id) || [0, 0])[1]), 0);
        const lines = [];
        for (let i = 0; i < ROWS; i++) {
          const f = String(fd['f' + i] || ''); const ref = String(fd['r' + i] || '').trim(); const raw = String(fd['a' + i] || '').replace(/[\sR,]/g, '');
          if (!f && !ref && !raw) continue;
          if (!fields.includes(f)) return 'Row ' + (i + 1) + ': choose the calculator field.';
          if (raw === '' || !/^-?\d+(\.\d{1,2})?$/.test(raw)) return 'Row ' + (i + 1) + ': give the amount as a number, for example 455000 or 1234.56.';
          const amount = Number(raw); const was = mine[i];
          let id = was && was.id && !used.has(was.id) ? was.id : null;
          if (!id) { do { next += 1; id = 'L' + next; } while (used.has(id)); }
          used.add(id);
          const line = { id, docId: d.id, ref: ref || CALC.FIELDS[f].label, field: f, amount };
          if (was && was.decided && was.field === f && was.amount === amount) line.decided = was.decided;
          lines.push(line);
        }
        const inputs = Object.assign({}, c.inputs || {}, { lines: all.filter((l) => l.docId !== d.id).concat(lines) });
        if (d.kind === 'medical') {
          const months = Number(fd.months); const deps = Number(fd.deps);
          if (!Number.isInteger(months) || months < 0 || months > 12) return 'Months on the medical scheme: a whole number from 0 to 12.';
          if (!Number.isInteger(deps) || deps < 0) return 'Dependants: a whole number, 0 or more.';
          inputs.medical = Object.assign({}, inputs.medical || {}, { months, dependants: deps });
        }
        if (!inputs.medical) inputs.medical = { months: 0, dependants: 0 };
        return finish(ENGINE.setInputs(c, ACTOR.me(), inputs, { note: 'Recorded the values read from the ' + kindLabel + ' (' + d.id + ')' }),
          'Recorded ' + plural(lines.length, 'value') + ' from the ' + kindLabel + '. Recalculate to use them.');
      });
    },
    // The remedy route after the client instructs the firm (ENGINE.chooseRemedy): the route, with its statutory deadline shown,
    // and the grounds and evidence. Choosing again changes the route or updates the evidence.
    'cases.remedy': (t) => {
      const c = caseOf(t); if (!c) return;
      const routes = REMEDY_FN.concat(['advice']); const cur = c.remedy ? c.remedy.route : '';
      const opt = (r) => {
        const label = r === 'advice' ? 'Documented advice, no SARS action' : SARS_FN[r].label;
        const dl = r === 'advice' ? null : ENGINE.remedyDeadline(c, r); const p = PERIODS[r];
        const note = r === 'advice' ? 'No SARS transaction: the advice is recorded and G15 passes on the Tax Consultant’s release.'
          : (dl && dl.deadline ? 'Due ' + fDate(VK.toDay(dl.deadline)) + ': ' + p.days + ' business days from ' + dl.basis + ', 16 Dec to 15 Jan not counted (' + p.rule + ').'
            : (dl && dl.basis ? VK.scrub(dl.basis) : 'No statutory deadline in the preview.')) + (SARS_FN[r].approved ? '' : ' Outside the SARS interface the documents assume: sending it raises INT-08.');
        return `<label><input type="radio" name="route" value="${esc(r)}"${r === cur ? ' checked' : ''}> <span><strong>${esc(label)}</strong><br><span class="small muted">${esc(note)}</span></span></label>`;
      };
      modal((c.remedy ? 'Change the remedy for ' : 'Choose the remedy for ') + c.id, `${VK.facts([['Case', VK.caseWho(c)], ['Client decision', c.decision ? esc(c.decision.choice === 'instruct' ? 'Instructed the firm to dispute the assessment' : c.decision.choice) + (c.decision.note ? '<div class="small muted">' + esc(VK.scrub(c.decision.note)) + '</div>' : '') : '<span class="muted">None yet</span>']])}
        <fieldset class="ops-radios"><legend class="small muted">Remedy route</legend>${routes.map(opt).join('')}</fieldset>
        <label class="f" for="cs-rem-ev">Grounds and evidence (required)<textarea id="cs-rem-ev" name="evidence" maxlength="1000">${esc(c.remedy && c.remedy.evidence ? c.remedy.evidence : '')}</textarea></label>
        <p class="hint">${esc('You choose as ' + S.role + ' (' + me().name + '). The client then authorises the route in the PaperSync portal (simulated); G15 and G18 follow before anything is sent to SARS, which is simulated too.')}</p>`,
      'Choose remedy', (fd) => {
        const route = String(fd.route || '');
        if (!routes.includes(route)) return 'Choose a remedy route.';
        const evidence = String(fd.evidence || '').trim();
        if (!evidence) return 'Record the grounds and evidence.';
        const r = ENGINE.chooseRemedy(c, ACTOR.me(), route, { evidence });
        const label = route === 'advice' ? 'documented advice' : SARS_FN[route].label;
        return finish(r, 'Chose the remedy: ' + label + (r && r.deadline ? ', due ' + fDate(VK.toDay(r.deadline)) : '') + '.');
      });
    },
  });
})();

/* ===================== itr12/views-clients.js ===================== */
/* Clients: the permanent client master (the Phase 1 field groups of the master workflow document), the KYC repository (G01)
   and a side-by-side comparison with the SARS registered details (G02, MD-* codes).
   This file also defines ADM, the few helpers the admin screens share (views-deadlines, views-controls, views-records and
   views-import): the Phase 1 field list, downloads, outside links and the modal result helper.
   Views only read state: a KYC change goes through ENGINE.setKyc with ACTOR.me(), and opening the year's ITR12 case through
   ENGINE.newCase (an Administrator or a Tax Consultant); ENGINE audits every refusal. */
const ADM = (() => {
  /* ---------- The Phase 1 field groups, as the master document lists them (Phase 1, step 1) ---------- */
  const P1 = ((WORKFLOW.phases.find((p) => p.n === 1) || { steps: [] }).steps[0]) || { groups: [], responsible: '', reviewer: '' };
  const GROUP_TITLES = ['Taxpayer identification', 'Contact details', 'Residential and postal information', 'Marital information', 'Tax residency', 'Banking information'];
  const GROUPS = GROUP_TITLES.map((t) => { const g = P1.groups.find((x) => x.title === t); return { title: t, items: g ? g.items.slice() : [] }; });
  const PROVINCES = ['Eastern Cape', 'Free State', 'Gauteng', 'KwaZulu-Natal', 'Limpopo', 'Mpumalanga', 'North West', 'Northern Cape', 'Western Cape'];
  // One column per Phase 1 item. grp is the index into GROUPS (6 = a column the preview adds). mask: 'id' shows the date of birth only,
  // 'tail' the last 4 characters. kind drives the import checks.
  const F = (key, label, grp, o) => Object.assign({ key, label, grp, kind: 'text', req: false, mask: null, hint: '' }, o || {});
  const FIELDS = [
    F('surname', 'Surname', 0, { req: true }),
    F('first_name', 'First name', 0, { req: true }),

  function activityBlock(cl) {
    const items = S.audit.filter((a) => a.client === cl.id || a.who === cl.id).slice(-12).reverse().map(ADM.auditRow);
    return VK.section('adm-client-activity', 'Recent activity', VK.list(items, { empty: 'Nothing recorded for this client yet.' }), {
      intro: esc('The latest entries for this client from the audit trail, newest first.'), actions: '<a href="#audit">Audit trail</a>',
    });
  }
  VIEWS.client = (id) => {
    const cl = ENGINE.clientOf(String(id || ''));
    if (!cl) return VK.page('Client not found', esc('There is no client ' + (id || '') + '. ') + '<a href="#clients">All clients</a>', '', { key: 'adm-client' });
    const intro = `${esc(cl.id)} · permanent client master in PaperSync · ${cl.provisional ? 'provisional taxpayer' : 'not a provisional taxpayer'} · <a href="#clients">All clients</a>`;
    return VK.page(cl.name, intro, masterBlock(cl) + `<div class="grid2 vk-grid" data-rv-key="adm-client-columns">${kycClientBlock(cl)}${casesBlock(cl)}</div>` + sarsClientBlock(cl) + activityBlock(cl), { key: 'adm-client' });
  };

  /* ---------- Actions ---------- */
  Object.assign(ACT, {
    'adm.newCase': (t) => {
      const cl = ENGINE.clientOf(t.dataset.client); if (!cl) { toast('That client is no longer here.'); render(); return; }
      const year = FILING_2026.year;
      if (caseOfClient(cl).some((c) => c.year === year)) { toast('Not done: ' + cl.name + ' already has a ' + year + ' ITR12 case.'); render(); return; }
      const tcs = S.people.filter((p) => p.role === 'Tax Consultant');
      const mine = S.role === 'Tax Consultant' ? me().id : (tcs[0] ? tcs[0].id : 'TC1');
      modal('Open the ' + year + ' ITR12 case', `${VK.facts([['Client', esc(cl.id + ' · ' + cl.name)], ['Year of assessment', esc(year + ' (' + FILING_2026.period + ')')], ['Filing', esc(cl.provisional ? 'Provisional taxpayer' : 'Not a provisional taxpayer')]])}
        <label class="f" for="adm-nc-tc">Tax Consultant<select id="adm-nc-tc" name="consultant">${tcs.map((p) => `<option value="${esc(p.id)}"${p.id === mine ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
        <p class="hint">${esc('You open it as ' + S.role + ' (' + me().name + '). The case starts at G01 (the KYC documents), then the SARS details check (G02) and the client’s questionnaire in the PaperSync portal (simulated). Operon records it in the audit trail.')}</p>`,
      'Open the case', (fd) => {
        if (!OPENERS.includes(S.role)) return 'Not done: only an Administrator or a Tax Consultant opens a case.';
        if (caseOfClient(cl).some((c) => c.year === year)) return 'Not done: ' + cl.name + ' already has a ' + year + ' ITR12 case.';
        const consultant = tcs.some((p) => p.id === fd.consultant) ? String(fd.consultant) : mine;
        const c = ENGINE.newCase(cl, { year, consultant }, ACTOR.me());
        if (!c || c.ok === false || !c.id) return 'Not done: ' + ((c && c.why) || 'Operon refused this.');
        return () => VK.done({ ok: true }, 'Opened ' + c.id + ', the ' + year + ' ITR12 case for ' + cl.name + '.');
      });
    },
    'adm.kyc': (t) => {
      const cl = ENGINE.clientOf(t.dataset.client); if (!cl) { toast('That client is no longer here.'); render(); return; }
      const k = cl.kyc.find((x) => x.key === t.dataset.key); if (!k) return;
      const ok = t.dataset.ok === '1';
      VK.done(ENGINE.setKyc(cl, k.key, ok, ACTOR.me()), (ok ? 'Marked as received: ' : 'Marked as missing: ') + k.label + '.');
    },
    'adm.clf': (t) => { UI.f = ['all', 'kyc', 'sars'].includes(t.dataset.v) ? t.dataset.v : 'all'; render(); },
  });
  EXT_FIELD['adm.clq'] = (el) => { UI.q = String(el.value || '').slice(0, 80); };
})();

/* ===================== itr12/views-approvals.js ===================== */
/* Approvals: every gate waiting for the signed-in role, the G18 two-person
   sign-offs on the simulated SARS link, and the severity and override requests the Records/Compliance Owner approves.
   Read-only: releases and G18 sign-offs use the kit's shared actions (ACT 'vk.release'); the request buttons use 'ops.sevOk' and
   'ops.ovOk' (views-exceptions.js), which call ENGINE with ACTOR.me(). */
(() => {
  const G18_ROLES = RELEASE.G18.roles;

  // Who releases a gate, in plain words (RELEASE in workflow.js).
  function releaser(g) {
    const r = RELEASE[g];
    switch (r.by) {
      case 'client': return 'The client, in the PaperSync portal (simulated)';
      case 'system': return 'Operon itself, when its checks pass';
      case 'ai': return 'The AI check with the independent reviewer (both simulated); otherwise the ' + r.role;
      case 'dual': return 'Two people: the ' + r.roles.join(' and the ');
      default: return 'The ' + r.role;
    }
  }
  const releasedBy = (g, role) => { const r = RELEASE[g]; return r.role === role || (r.roles || []).includes(role); };

  // What still stands between a gate and its release: blocking exceptions, then unmet criteria, then anything else canRelease says.
  function leftCell(r) {
    if (r.kind === 'incident') {
      return r.ready ? `<p class="vk-okline">${I.check} Every step is recorded</p>`
        : `<div class="small">Still to record:</div><ul class="ops-miss">${r.missing.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>`;
    }
    const bl = ENGINE.gateBlockers(r.c, r.g); const miss = ENGINE.criteria(r.c, r.g);
    if (r.ready) return `<p class="vk-okline">${I.check} Criteria met; nothing blocks it</p>`;
    const parts = [];
    if (bl.length) parts.push(`<div class="small">Blocked by</div><div class="vk-codes">${bl.map((x) => VK.codeChip(x.code, x) + VK.sevChip(x.sev, { short: true })).join(' ')}</div>`);
    if (miss.length) parts.push(`<div class="small">Not met yet</div><ul class="ops-miss">${miss.map((m) => `<li>${esc(VK.scrub(m))}</li>`).join('')}</ul>`);
    if (!parts.length && r.why) parts.push(`<div class="small">${esc(VK.scrub(r.why))}</div>`);
    return parts.join('');
  }

  function gatesBlock(role) {
    const rows = VK.waitingGates(role).filter((r) => r.kind !== 'g18');
    const ready = rows.filter((r) => r.ready).length;
    const caseCell = (r) => {
      if (!r.c) return '<span class="muted">No case</span>';
      const ai = RELEASE[r.g] && RELEASE[r.g].by === 'ai' && r.c.gates[r.g] && r.c.gates[r.g].routed ? `<div class="small muted">The AI check routed it to you (simulated)</div>` : '';
      return VK.caseWho(r.c) + ai;
    };
    const what = (r) => `<strong>${esc(r.kind === 'incident' ? r.label : VK.gateName(r.g))}</strong><div class="small muted">Release when: ${esc(GATE[r.g].criterion || '')}</div>`;
    const table = VK.table([{ label: 'Gate' }, { label: 'Case' }, { label: 'What it approves' }, { label: 'Still to do' }, { label: '', cls: 'vk-act' }],
      rows.map((r) => ({ cls: r.ready ? 'ops-ready' : '', cells: [r.c ? VK.gateChip(r.c, r.g) : `<span class="vk-gate vk-g-prog"><b>${esc(r.g)}</b> Open</span>`, caseCell(r), what(r), leftCell(r), VK.releaseBtn(r)] })),
      { caption: 'Gates waiting for the ' + role, empty: 'No gates are waiting for the ' + role + ' role.' });
    const intro = rows.length
      ? esc(plural(ready, 'gate') + ' ready to release, ' + (rows.length - ready) + ' waiting on something else. The criteria and blockers come from the gate engine; releasing is a human approval and goes in the audit trail.')
      : esc('Nothing is waiting for the ' + role + ' role. ' + (ROLE_INFO[role] || ''));
    return VK.section('ops-approvals-gates', 'Gates waiting for you', table, { count: rows.length, intro });
  }

  function g18Block(role) {
    const txs = S.txs.filter((t) => t.status === 'awaiting G18');
    const mine = G18_ROLES.includes(role);
    const signed = (t) => G18_ROLES.map((rl) => {
      const s = t.signoffs.find((x) => x.role === rl);
      return `<div class="small">${s ? I.check + ' ' : ''}<span class="muted">${esc(rl)}:</span> ${s ? esc(VK.who(s.id)) + ' · ' + VK.when(s.at) : 'not yet'}</div>`;
    }).join('');
    const checks = (t) => {
      const ck = ENGINE.g18Checks(t); const bad = ck.filter((k) => !k.ok); const gb = ENGINE.g18Blockers(t);
      return `${VK.pill(ck.length - bad.length + ' of ' + ck.length + ' checks pass', bad.length ? 'bad' : 'ok')}${bad.map((k) => `<div class="small">${esc(k.n + '. ' + VK.scrub(k.why))}</div>`).join('')}${gb.length ? `<div class="small err">Blocked by ${esc(gb.join(', '))}</div>` : ''}`;
    };
    const act = (t) => {
      if (!mine) return `<span class="lock">${I.lock}${esc('The Integration Administrator and the Tax Consultant sign')}</span>`;
      const me0 = t.signoffs.find((s) => s.role === role);
      if (me0) { const other = G18_ROLES.find((r) => r !== role); return `<span class="lock">${I.hourglass}${esc('You signed. The ' + other + ' signs next.')}</span>`; }
      const ok = !ENGINE.g18Checks(t).some((k) => !k.ok) && !ENGINE.g18Blockers(t).length;
      return btn('Sign G18', 'vk.release', { cls: 'sm' + (ok ? ' primary' : ''), data: { case: t.caseId, gate: 'G18', tx: t.id } });
    };
    const table = VK.table([{ label: 'Transaction' }, { label: 'Case' }, { label: 'Signed so far' }, { label: 'The 8 G18 checks' }, { label: '', cls: 'vk-act' }],
      txs.map((t) => [`<span class="mono">${esc(t.id)}</span> ${esc(t.label)}<div class="small muted">Version ${esc(t.version)} · queued ${VK.when(t.created)}</div>`, VK.caseWho(t.caseId), signed(t), checks(t), act(t)]),
      { caption: 'SARS transactions awaiting the G18 two-person sign-off', empty: 'No SARS transaction is waiting for a G18 sign-off.' });
    return VK.section('ops-approvals-g18', 'G18 two-person sign-off', table, {
      count: txs.length,
      intro: esc('Every outbound SARS transaction needs two different people: the Integration Administrator and the Tax Consultant. Each signs only when all eight checks pass. The SARS link is simulated: nothing is sent to SARS.'),
      actions: '<a href="#sars">SARS link</a>',
    });
  }

  function requestsBlock(role) {
    const rco = role === 'Records/Compliance Owner';
    const rows = [];
    S.exceptions.forEach((x) => {
      if (x.sevRequest && x.sevRequest.status === 'pending') rows.push({ kind: 'sev', x, by: x.sevRequest.by, at: x.sevRequest.at, reason: x.sevRequest.reason, what: 'Lower ' + x.sevRequest.from + ' to ' + x.sevRequest.to });
      if (x.override && x.override.status === 'requested') rows.push({ kind: 'ov', x, by: x.override.requestedBy, at: x.override.at, reason: x.override.reason, evidence: x.override.evidence, what: 'Override on version ' + x.override.version });
    });
    rows.sort((p, q) => p.at - q.at);
    const act = (r) => {
      if (!rco) return `<span class="lock">${I.hourglass}${esc('Waiting for the Records/Compliance Owner')}</span>`;
      if (r.kind === 'sev') return `<span class="ops-btns">${btn('Approve', 'ops.sevOk', { cls: 'sm primary', data: { ex: r.x.id, v: '1' } })}${btn('Decline', 'ops.sevOk', { cls: 'sm', data: { ex: r.x.id, v: '0' } })}</span>`;
      return btn('Approve override', 'ops.ovOk', { cls: 'sm primary', data: { ex: r.x.id } });
    };
    const table = VK.table([{ label: 'Request' }, { label: 'Exception' }, { label: 'Case' }, { label: 'Asked by' }, { label: 'Reason' }, { label: '', cls: 'vk-act' }],
      rows.map((r) => [esc(r.what), `${VK.codeChip(r.x.code, r.x)} ${VK.sevChip(r.x.sev, { short: true })} ${VK.exLink(r.x)}`, r.x.caseId ? VK.caseWho(r.x.caseId) : '<span class="muted">No case</span>',
        `${esc(VK.who(r.by))}<div class="small muted">${VK.when(r.at)}</div>`, `${esc(VK.scrub(r.reason))}${r.evidence ? `<div class="small muted">Evidence: ${esc(VK.scrub(r.evidence))}</div>` : ''}`, act(r)]),
      { caption: 'Severity and override requests', empty: 'No severity or override request is waiting.' });
    return VK.section('ops-approvals-requests', 'Severity and override requests', table, {
      count: rows.length,
      intro: esc('Lowering an S1 or S2 severity, and overriding an S2 exception, need the Records/Compliance Owner’s approval, and the approver must not be the person who asked. ' +
        (S.policy.overridable.length ? '' : 'No S2 code is on the override list yet (pending Johan), so override requests are refused.')),
    });
  }

  function whoBlock(role) {
    const items = GATE_IDS.map((g) => `<div class="vk-row ops-who${releasedBy(g, role) ? ' ops-mine' : ''}"><span class="vk-gate vk-g-idle"><b>${esc(g)}</b></span><div class="vk-row-b">
      <div class="vk-row-t">${esc(VK.gateName(g))}</div><div class="vk-meta"><span>${esc(releaser(g))}</span>${releasedBy(g, role) ? VK.pill('Your role', 'info') : ''}</div></div></div>`);
    return VK.section('ops-approvals-who', 'Who releases each gate', VK.list(items, { cls: 'ops-wholist' }), {
      intro: esc('No AI or system may release G09. The client gates pass only through the client’s own PaperSync portal action, and a client’s silence is never approval.'),
    });
  }

  VIEWS.approvals = () => {
    const role = S.role;
    const intro = `${esc(role)} · ${esc(me().name)}. ` + esc('Every gate waiting for your role, with its criteria and what still blocks it.');
    return VK.page('Approvals', intro, gatesBlock(role) + g18Block(role) + requestsBlock(role) + whoBlock(role), { key: 'ops-approvals' });
  };
})();

/* ===================== itr12/views-exceptions.js ===================== */
/* Exceptions: the live register with filters (family, severity, gate, owner, status and a search), and the page for one exception
   (route exception-<id>): the full exception object (EX_OBJECT), its links, the resolution and secondary review, severity changes
   and their approval, override requests, the manual fallback for Conditional codes, and raising a further exception by hand.
   Views only read state: every button calls ENGINE with ACTOR.me(), and a refusal shows ENGINE's reason (ENGINE audits it).
   The filters live in this module only (they are not case data). */
(() => {
  /* ---------- helpers ---------- */
  // Modal flows: success closes the dialog, toasts and renders (then runs `then`); a refusal keeps the dialog open with the reason.
  const finish = (r, msg, then) => (r && r.ok ? () => { VK.done(r, msg); if (then) then(); } : 'Not done: ' + ((r && r.why) || 'Operon refused this.'));
  const exNow = (t) => { const x = ENGINE.exById(t.dataset.ex); if (!x) { toast('That exception is no longer here.'); render(); } return x; };
  const caseOfX = (x) => (x && x.caseId ? ENGINE.caseById(x.caseId) : null);
  const fam = (code) => String(code).split('-')[0];
  const famName = (f) => { const d = Object.values(CODE).find((c) => c.fam === f); return d ? d.family : f; };
  const head = (x) => `<p class="row">${VK.codeChip(x.code)}${VK.sevChip(x.sev)}<strong>${esc(x.title)}</strong></p>`;
  const caseText = (x) => (x.caseId ? VK.caseWho(x.caseId) : (x.clientId ? VK.clientLink(x.clientId) : '<span class="muted">No case</span>'));

  /* ---------- filters ---------- */
  const F0 = { fam: '', sev: '', gate: '', owner: '', status: 'live', q: '' };
  const F = Object.assign({}, F0);
  const OWNERS = ROLES.concat(['Client', 'AI Agent', 'Operon (system)', 'Platform team (simulated)']);
  const STATUS = [
    ['live', 'Not closed', (x) => x.status !== 'closed'],
    ['open', 'Open (to resolve)', (x) => ENGINE.isOpen(x)],
    ['blocking', 'Blocking now', (x) => ENGINE.blocksNow(x)],
    ['awaiting client', 'Awaiting client', (x) => x.status === 'awaiting client'],
    ['resolved', 'Resolved, to close', (x) => x.status === 'resolved'],
    ['closed', 'Closed', (x) => x.status === 'closed'],
    ['all', 'All', () => true],
  ];
  function ownerMatch(x, o) {
    if (o === 'Platform team (simulated)') return /^Platform /.test(x.owner);
    if (ROLES.includes(o)) return VK.ownedBy(x.owner, o);
    return x.owner === o;
  }
  function filtered() {
    const st = (STATUS.find((s) => s[0] === F.status) || STATUS[0])[2];
    const q = F.q.trim().toLowerCase();
    return S.exceptions.filter((x) => (!F.fam || fam(x.code) === F.fam) && (!F.sev || x.sev === F.sev) && (!F.gate || x.gates.includes(F.gate))
      && (!F.owner || ownerMatch(x, F.owner)) && st(x)
      && (!q || [x.id, x.code, x.title, x.caseId, VK.clientName(x.clientId), x.owner, x.note].some((v) => String(v || '').toLowerCase().includes(q))))
      .sort((p, q2) => ((p.status === 'closed') - (q2.status === 'closed')) || (SEV.indexOf(p.sev) - SEV.indexOf(q2.sev)) || (p.at - q2.at));
  }
  EXT_FIELD['ops.exF'] = (el) => { const k = el.dataset.k; if (!(k in F)) return false; F[k] = String(el.value || '').slice(0, 80); return true; };
  const sel = (k, label, opts) => `<label class="f" for="ops-exf-${k}">${esc(label)}<select id="ops-exf-${k}" data-on="ops.exF" data-k="${k}">${opts.map(([v, t]) => `<option value="${esc(v)}"${F[k] === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;

  function filtersBlock(n) {
    const live = S.exceptions.filter((x) => x.status !== 'closed');
    const sum = SEV.map((s) => `<span class="ops-sumi">${VK.sevChip(s)}<b>${live.filter((x) => x.sev === s).length}</b></span>`).join('');
    const blocking = S.exceptions.filter((x) => ENGINE.blocksNow(x)).length;
    const body = `<div class="ops-filters">
      ${sel('fam', 'Family', [['', 'All families']].concat(FAMILY_ORDER.map((f) => [f, f + ' · ' + famName(f)])))}
      ${sel('sev', 'Severity', [['', 'All severities']].concat(SEV.map((s) => [s, SEV_LABEL[s]])))}
      ${sel('gate', 'Gate', [['', 'All gates']].concat(GATE_IDS.map((g) => [g, g + ' · ' + VK.gateName(g)])))}
      ${sel('owner', 'Owner', [['', 'Anyone']].concat(OWNERS.map((o) => [o, o])))}
      ${sel('status', 'Status', STATUS.map((s) => [s[0], s[1]]))}
      <label class="f" for="ops-exf-q">Search<input id="ops-exf-q" type="search" data-on="ops.exF" data-k="q" value="${esc(F.q)}" maxlength="80" autocomplete="off" placeholder="Code, case, client or ID"></label>
    </div>
    <div class="row ops-sum"><span class="small muted">Not closed:</span>${sum}<span class="small muted">${esc(plural(blocking, 'exception') + ' blocking now')}</span></div>`;
    const changed = Object.keys(F0).some((k) => F[k] !== F0[k]);
    return VK.section('ops-exceptions-filters', 'Filter the register', body, {
      intro: esc('Showing ' + plural(n, 'exception') + ' of ' + S.exceptions.length + '. Each exception follows Johan’s register: its severity, blocking rule, owner and secondary reviewer come from the code.'),
      actions: `${btn('Owned by my role', 'ops.exMine', { cls: 'sm' })}${changed ? btn('Clear filters', 'ops.exClear', { cls: 'sm ghost' }) : ''}`,
    });
  }
  function listBlock(rows) {
    const status = (x) => `${VK.exStatus(x)}${ENGINE.blocksNow(x) ? `<div class="small">${esc(x.blocking === 'Conditional' ? 'Blocks until the fallback is reconciled' : 'Blocking now')}</div>` : ''}`;
    const owner = (x) => `${esc(x.owner)}${x.assignee && ENGINE.isOpen(x) ? `<div class="small muted">${esc(VK.who(x.assignee))}</div>` : ''}${x.secondary ? `<div class="small muted">Closes: ${esc(x.secondary)}</div>` : ''}`;
    const table = VK.table([{ label: 'Severity' }, { label: 'Exception' }, { label: 'Case' }, { label: 'Gates' }, { label: 'Owner' }, { label: 'Status' }],
      rows.map((x) => [VK.sevChip(x.sev), `${VK.codeChip(x.code, x)} ${VK.exLink(x, x.title)}<div class="small muted">${esc(x.id)} · raised ${VK.when(x.at)}</div>`, caseText(x),
        `<span class="mono small">${esc(x.gates.join(' · '))}</span>`, owner(x), status(x)]),
      { caption: 'Exception register', empty: 'No exception matches these filters.' });
    return VK.section('ops-exceptions-list', 'Exceptions', table, { count: rows.length });
  }

  VIEWS.exceptions = () => {
    const rows = filtered();
    const intro = esc('The live exception register for every case. Open one to see the full record, change its severity, ask for an override or record a fallback. Every change is audited.');
    return VK.page('Exceptions', intro, filtersBlock(rows.length) + listBlock(rows), { key: 'ops-exceptions', actions: btn('Raise an exception', 'ops.raise', { cls: 'primary' }) });
  };

  /* ---------- one exception ---------- */
  function fieldHtml(x, c, k) {
    const none = '<span class="muted">—</span>';
    switch (k) {
      case 'id': return `<span class="mono">${esc(x.id)}</span>`;
      case 'code': return `${VK.codeChip(x.code)} ${esc(x.title)}`;
      case 'clientId': return x.clientId ? VK.clientLink(x.clientId) : none;
      case 'year': return x.year ? 'tax year ' + esc(x.year) : none;
      case 'caseId': return x.caseId ? VK.caseLink(x.caseId) : none;
      case 'stage': return esc(x.stage);
      case 'gates': return `<span class="vk-codes">${x.gates.map((g) => (c ? VK.gateChip(c, g) : `<span class="vk-gate vk-g-idle"><b>${esc(g)}</b></span>`)).join(' ')}</span>`;
      case 'severity': return VK.sevChip(x.sev) + (CODE[x.code] && CODE[x.code].sev !== x.sev ? ` <span class="small muted">register default ${esc(CODE[x.code].sev)}</span>` : '');
      case 'blocking': return `${esc(x.blocking)} ${ENGINE.blocksNow(x) ? VK.pill('Blocking now', 'bad') : VK.pill('Not blocking now', '')}`;
      case 'trigger': return esc(x.trigger);
      case 'source': return '<span class="small muted">Source:</span> ' + esc(x.source);
      case 'raisedBy': return `${esc({ AI: 'AI (simulated)', system: 'System', SARS: 'SARS (simulated)', human: 'Human' }[x.raisedBy] || x.raisedBy)} · ${esc(VK.who(x.raisedById))}`;
      case 'owner': return `${esc(x.owner)}${x.assignee ? ` <span class="small muted">(${esc(VK.who(x.assignee))})</span>` : ''}`;
      case 'secondary': return '<span class="small muted">Secondary reviewer:</span> ' + (x.secondary ? esc(x.secondary) : 'none');
      case 'clientAction': return x.clientAction ? esc(x.clientAction) : '<span class="muted">None</span>';
      case 'clientDue': return x.clientDue ? '<span class="small muted">due</span> ' + VK.date(x.clientDue) : '';
      case 'sarsDeadline': return x.sarsDeadline ? `${VK.date(x.sarsDeadline)} ${VK.leftPill(VK.bizLeft(x.sarsDeadline, /^REM-/.test(x.code)))}` : none;
      case 'related': return x.related.length ? x.related.map((id) => { const y = ENGINE.exById(id); return y ? VK.codeChip(y.code, y) + ' ' + VK.exLink(y) : esc(id); }).join(', ') : none;
      case 'parent': { const p = x.parent ? ENGINE.exById(x.parent) : null; return p ? `<span class="small muted">parent</span> ${VK.codeChip(p.code, p)} ${VK.exLink(p)}` : ''; }
      case 'resolution': return x.resolution ? esc(VK.scrub(x.resolution)) : none;

  }
  function objectBlock(x, c) {
    const rows = EX_OBJECT.map((f) => [esc(f.label), f.keys.map((k) => fieldHtml(x, c, k)).filter(Boolean).join('<span class="muted" aria-hidden="true"> · </span>'), `<span class="mono small muted">${esc(f.keys.join(', '))}</span>`]);
    return VK.section('ops-exception-object', 'The exception record', VK.table([{ label: 'Field' }, { label: 'Value' }, { label: 'Stored as' }], rows, { caption: 'The 14 mandatory fields' }), {
      intro: esc('The 14 mandatory fields from the master workflow document (Phase 20), and the field names Operon stores them under.'),
    });
  }
  function linksBlock(x, c) {
    const pairs = [];

    const parent = x.parent ? ENGINE.exById(x.parent) : null;
    if (parent) pairs.push(['Parent', `${VK.codeChip(parent.code, parent)} ${VK.exLink(parent, parent.id + ' ' + parent.title)} ${VK.exStatus(parent)}`]);
    const kids = S.exceptions.filter((y) => y.parent === x.id || (x.related.includes(y.id) && y.id !== x.parent));
    if (kids.length) pairs.push(['Related', kids.map((y) => `<div>${VK.codeChip(y.code, y)} ${VK.exLink(y, y.id + ' ' + y.title)} ${VK.exStatus(y)}</div>`).join('')]);
    const inc = x.incidentId ? ENGINE.incById(x.incidentId) : null;
    if (inc) pairs.push(['Incident (G17)', `${VK.link('incident', inc.id)} ${VK.pill(inc.status === 'open' ? 'Open' : 'Closed', inc.status === 'open' ? 'bad' : 'ok')} <span class="small muted">${esc(inc.codes.join(', '))}</span>`]);
    const t = x.txId ? ENGINE.txById(x.txId) : null;
    if (t) pairs.push(['SARS transaction', `<span class="mono">${esc(t.id)}</span> ${esc(t.label)} ${VK.pill(t.status, '')} <a href="#sars">SARS link</a>`]);
    const it = x.inboundId ? S.inbound.find((y) => y.id === x.inboundId) : null;
    if (it) pairs.push(['SARS inbound item', `<span class="mono">${esc(it.id)}</span> ${esc(it.label)} <span class="mono small">${esc(it.ref || '')}</span> <a href="#sars">SARS link</a>`]);
    const d = x.docId && c ? c.docs.find((y) => y.id === x.docId) : null;

    const others = c ? ENGINE.exOf(c).filter((y) => y.id !== x.id && y.status !== 'closed' && !kids.includes(y) && y !== parent) : [];
    if (others.length) pairs.push(['Also open on this case', `<span class="vk-codes">${others.map((y) => VK.codeChip(y.code, y)).join(' ')}</span>`]);
    if (x.note) pairs.push(['Note when raised', esc(VK.scrub(x.note))]);
    return VK.section('ops-exception-links', 'Links', pairs.length ? VK.facts(pairs) : VK.empty('Nothing is linked to this exception.'));
  }
  function resolutionBlock(x, c) {
    const def = CODE[x.code] || {};
    const pairs = [['Resolved when', esc(def.resolution || '')], ['Status', VK.exStatus(x)]];
    if (x.resolution) pairs.push(['What was done', esc(VK.scrub(x.resolution)) + (x.evidence ? `<div class="small muted">Evidence: ${esc(VK.scrub(x.evidence))}</div>` : '')], ['Resolved by', `${esc(x.resolvedBy || '')} · ${VK.when(x.resolvedAt)}`]);
    if (x.secondary) pairs.push(['Secondary review', x.closedBy ? `${esc(x.closedBy)} · ${VK.when(x.closedAt)}` : esc('By a different person in the ' + x.secondary + ' role, once resolved')]);
    else if (x.closedBy) pairs.push(['Closed', `${esc(x.closedBy)} · ${VK.when(x.closedAt)}`]);
    let act = '';

  }
  function severityBlock(x) {
    const def = CODE[x.code] || {}; const rq = x.sevRequest;

    const btns = [];

      else btns.push(`<span class="lock">${I.hourglass}${esc('Waiting for the Records/Compliance Owner')}</span>`);
    }
    return VK.section('ops-exception-severity', 'Severity', VK.facts(pairs) + (btns.length ? `<div class="row ops-btns">${btns.join('')}</div>` : ''), {
      intro: esc('S1 is a hard stop for the whole case. Otherwise the register’s Blocking column decides: a blocking code stops the gates it is mapped to, whether it is S2 or S3. Anyone may raise a severity at once. Lowering an S1 or S2 needs the Records/Compliance Owner’s approval, by a different person.'),
    });
  }
  function overrideBlock(x) {
    const why = ENGINE.overrideWhy(x); const ov = x.override;
    const list = S.policy.overridable.length ? S.policy.overridable.join(', ') : 'Empty: no S2 code may be overridden until Johan decides (pending Johan)';
    const pairs = [['Can it be overridden?', why ? `${VK.pill('No', 'bad')} ${esc(why)}` : VK.pill('Yes, on the policy list', 'ok')], ['Override policy list', esc(list)],
      ['Never overridden', esc('S1; missing taxpayer authority (' + NEVER_OVERRIDE.authority.join(', ') + '); security (SEC-*, ' + NEVER_OVERRIDE.security.join(', ') + '); SARS-interface authorisation (INT-*); statutory holds (RET-*)')]];
    if (ov) pairs.push(['Request', `${esc(VK.scrub(ov.reason))}<div class="small muted">${esc(VK.who(ov.requestedBy) + ' (' + ov.role + ') · version ' + ov.version + ' · ' + ov.status)}${ov.approvedBy ? esc(' by ' + VK.who(ov.approvedBy)) : ''}</div><div class="small muted">Evidence: ${esc(VK.scrub(ov.evidence))}</div>`]);
    const btns = [];
    if (ENGINE.isOpen(x) && !(ov && (ov.status === 'requested' || ov.status === 'approved'))) btns.push(btn('Ask for an override', 'ops.ovReq', { cls: 'sm', data: { ex: x.id } }));
    if (ov && ov.status === 'requested') {
      if (S.role === 'Records/Compliance Owner') btns.push(btn('Approve override', 'ops.ovOk', { cls: 'sm primary', data: { ex: x.id } }));
      else btns.push(`<span class="lock">${I.hourglass}${esc('Waiting for the Records/Compliance Owner')}</span>`);
    }
    return VK.section('ops-exception-override', 'Override', VK.facts(pairs) + (btns.length ? `<div class="row ops-btns">${btns.join('')}</div>` : ''), {
      intro: esc('An override lets an S2 exception stop blocking for one version. It records who asked, why and the evidence, and needs the Records/Compliance Owner’s approval.'),
    });
  }
  // The Conditional codes from the register (AI-06, INT-03, INT-13, INT-15).
  const CONDITIONAL = Object.values(CODE).filter((d) => d.blocking === 'Conditional').map((d) => d.code);
  function fallbackBlock(x) {
    const fb = x.fallback;
    if (!fb) return VK.section('ops-exception-fallback', 'Manual fallback', VK.empty(x.code + ' is not a Conditional code, so it has no manual fallback. Only ' + CONDITIONAL.join(', ') + ' have one.'));
    const rec = fb.recorded; const rcn = fb.reconciled;
    const pairs = [['Recorded', rec ? `${esc(VK.who(rec.by))} · ${VK.when(rec.at)}${rec.ref ? ` · <span class="mono">${esc(VK.scrub(rec.ref))}</span>` : ''}${rec.note ? `<div class="small muted">${esc(VK.scrub(rec.note))}</div>` : ''}` : '<span class="muted">Not yet</span>'],
      ['Independently reconciled', rcn ? `${esc(VK.who(rcn.by))} · ${VK.when(rcn.at)}${rcn.found === false ? ' · ' + esc('not processed') : ''}${rcn.note ? `<div class="small muted">${esc(VK.scrub(rcn.note))}</div>` : ''}` : '<span class="muted">Not yet</span>']];
    // Only AI-06 records a free-text fallback. The others have a real fallback action: the manual filing on the SARS link page

    const btns = []; let how = '';
    const it = x.code === 'INT-15' && x.inboundId ? S.inbound.find((y) => y.id === x.inboundId) : null;

      if (x.code === 'INT-15' && it) btns.push(btn('Confirm the dates', 'ops.in.date', { cls: 'sm primary', data: { in: it.id } }));

    } else if (!rcn) {
      if (via && ENGINE.isOpen(via)) how = 'Recorded by the manual filing ' + via.id + ' (INT-13). Reconcile that one; this closes with it.';
      else btns.push(btn('Reconcile independently', 'ops.fbRecon', { cls: 'sm primary', data: { ex: x.id } }));
    }
    const intro = {
      'INT-13': ' The manual filing itself is recorded on the SARS link page.',
      'INT-15': ' The fallback is confirming the dates from the notice itself; no deadline runs until then.',
      'INT-03': ' The fallback is a manual filing (INT-13), recorded on the SARS link page.',
    }[x.code] || '';
    const tail = (how ? `<p class="small muted">${esc(how)} <a href="#sars">SARS link</a></p>` : '') + (btns.length ? `<div class="row ops-btns">${btns.join('')}</div>` : '');
    return VK.section('ops-exception-fallback', 'Manual fallback', VK.facts(pairs) + tail, {

    });
  }
  function historyBlock(x) {
    const rows = S.audit.filter((a) => a.exceptionId === x.id).slice(-15).reverse();
    const items = rows.map((a) => `<div class="vk-row vk-row-log"><span class="vk-when">${VK.when(a.at)}</span><div class="vk-row-b">
      <div class="vk-row-t">${esc(VK.scrub(a.text))}${a.result === 'Refused' ? ' ' + VK.pill('Refused', 'bad') : ''}</div>
      <div class="vk-meta">${esc(VK.who(a.who) + (a.role ? ' · ' + a.role : ''))}</div></div></div>`);
    return VK.section('ops-exception-history', 'History', VK.list(items, { empty: 'No audit entries name this exception yet.' }), {
      intro: esc('Audit entries for this exception, newest first, refusals included.'), actions: '<a href="#audit">Audit trail</a>',

  VIEWS.exception = (id) => {

    const c = caseOfX(x);
    const intro = `${VK.sevChip(x.sev)} ${VK.exStatus(x)} ${esc(x.title)} · ${caseText(x)} · <a href="#exceptions">All exceptions</a>`;
    const actions = btn('Raise a related exception', 'ops.raise', { cls: 'sm', data: { case: x.caseId || '', parent: x.id } });
    return VK.page(x.id + ' · ' + x.code, intro,
      `<div class="grid2 vk-grid" data-rv-key="ops-exception-columns">${resolutionBlock(x, c)}${linksBlock(x, c)}</div>` +

  /* ---------- actions ---------- */
  function actSev(t) {
    const x = exNow(t); if (!x) return;
    // No severity is pre-selected: submitting the defaults must not raise an exception (an S1 is a hard stop for the whole case).
    const opts = '<option value="" selected>Choose the new severity</option>' + SEV.filter((s) => s !== x.sev).map((s) => `<option value="${esc(s)}">${esc(SEV_LABEL[s] + (SEV.indexOf(s) < SEV.indexOf(x.sev) ? ' (raise: applies at once)' : (x.sev === 'S1' || x.sev === 'S2' ? ' (lower: needs approval)' : ' (lower)')))}</option>`).join('');

      <label class="f" for="ops-sev-to">New severity<select id="ops-sev-to" name="to">${opts}</select></label>

      <label class="f" for="ops-ov-why">Reason (required)<textarea id="ops-ov-why" name="reason" maxlength="500"></textarea></label>
      <label class="f" for="ops-ov-ev">Evidence (required)<input id="ops-ov-ev" name="evidence" maxlength="300" autocomplete="off" placeholder="A file name or reference"></label>
      <p class="hint">${esc((ENGINE.vN(caseOfX(x)) ? 'The override covers version ' + ENGINE.vN(caseOfX(x)) + ' only' : 'An override covers one version only (this case has none yet)') + ' and needs the Records/Compliance Owner’s approval. Refusals are recorded in the audit trail.')}</p>`,
    'Ask for override', (fd) => finish(ENGINE.requestOverride(x, ACTOR.me(), { reason: String(fd.reason || '').trim(), evidence: String(fd.evidence || '').trim() }), 'Asked to override ' + x.id + '.'));
  }
  const actOvOk = (t) => { const x = exNow(t); if (!x) return; VK.done(ENGINE.approveOverride(x, ACTOR.me()), 'Approved the override of ' + x.id + '.'); };
  function actFbRec(t) {

    modal('Record the manual fallback for ' + x.id, `${head(x)}
      <label class="f" for="ops-fb-note">What was done instead<textarea id="ops-fb-note" name="note" maxlength="500"></textarea></label>

  function actFbRecon(t) {

      ${rec ? VK.facts([['Recorded by', esc(VK.who(rec.by))], ['Reference', esc(VK.scrub(rec.ref || 'None'))], ['Note', esc(VK.scrub(rec.note || ''))]]) : ''}

  // Raise any of the register's codes by hand on a case. The code list is narrowed to the case's stage (the register's Stage Map);
  // "All codes" lists all of them.
  const phaseOf = (c) => { const g = c ? ENGINE.currentGate(c) : null; return g && GATE[g] ? GATE[g].phase : null; };
  function stageCovers(stage, n) {
    if (/^Any\b/i.test(stage) || n == null) return true;
    const rx = /(\d+)\s*-\s*(\d+)|(\d+)/g; let m;
    while ((m = rx.exec(stage))) { if (m[3] ? +m[3] === n : (n >= +m[1] && n <= +m[2])) return true; }
    return false;
  }
  function codeOptions(c, scope) {

    }).join('');
  }
  function actRaise(t) {

      <label class="f" for="ops-raise-case">Case<select id="ops-raise-case" name="case">${cases.map((c) => `<option value="${esc(c.id)}"${c === pre ? ' selected' : ''}>${esc(c.id + ' · ' + VK.clientName(c.clientId))}</option>`).join('')}</select></label>

      <label class="f" for="ops-raise-code">Exception code<select id="ops-raise-code" name="code">${codeOptions(pre, 'stage')}</select></label>
