    {"n": 1, "title": "Permanent Client Onboarding / KYC", "steps": [{"n": 1, "title": "Create permanent client master record", "responsible": "Administrator", "system": "PaperSync", "reviewer": "AI Agent for completeness checks", "text": ["The client master is maintained independently from annual ITR12 cases. Capture and confirm the following:"], "items": [], "ordered": false, "groups": [{"title": "Taxpayer identification", "items": ["Surname", "First name", "Other names, where applicable", "Full initials", "Date of birth", "RSA identity number", "Gender", "Income tax reference number", "If no RSA ID: passport number, issue date, passport country, nationality/citizenship and relevant foreign tax information"]}, {"title": "Contact details", "items": ["Email address", "Cell/mobile number", "Home telephone, where applicable", "Business telephone, where applicable", "Preferred contact method"]}, {"title": "Residential and postal information", "items": ["Unit number and complex name, where applicable", "Street number and street/farm name", "Suburb/district, city/town and province", "Postal code and country, where applicable", "Postal address if different"]}, {"title": "Marital information", "items": ["Marital status", "Marriage regime: in community of property, out of community of property, or not applicable", "Spouse full names, RSA ID/passport and income tax reference number where required"]}, {"title": "Tax residency", "items": ["Current RSA tax-residency status", "Whether never an RSA resident", "Date residency commenced, ceased or was reinstated, where applicable", "Foreign country of tax residence and foreign tax identification number, where applicable"]}, {"title": "Banking information", "items": ["Account-holder legal name", "Bank, branch and branch code", "Account number and account type", "Confirmation account is held by taxpayer", "Confirmation whether details agree with SARS"]}]}], "gates": []},
    {"n": 2, "title": "Permanent Supporting Documentation", "steps": [{"n": 2, "title": "Establish Permanent Client/KYC Repository", "responsible": "Administrator", "system": "PaperSync", "reviewer": "Information Officer for privacy controls", "text": [], "items": ["Copy of RSA ID document: ID card front and back or green barcoded ID; passport and relevant identity/residency documentation for a foreign national.", "Proof of residential address.", "Proof of bank account details showing account-holder legal name, account number, account type, branch code and bank identification.", "Signed POPIA Privacy Notice/Acknowledgement and consent where applicable.", "Signed firm ITR12 Appointment Letter/Mandate, including scope, responsibilities, fees, authority to obtain SARS information, prepare the return, correspond with SARS, and the requirement for client approval before submission."], "ordered": true, "groups": []}], "gates": [{"gate": "G01", "control": "Permanent Client/KYC approved", "owner": "Administrator", "pass": "Activate SARS master-data reconciliation.", "notes": ["KYC-01 missing item; KYC-02 invalid/stale/unreadable evidence; KYC-03 identity mismatch.", "KYC-04 refusal/inability; KYC-05 defective mandate; KYC-06 incomplete privacy documentation.", "CLT-01 onboarding non-response. Annual ITR12 case activation remains blocked."]}]},
    {"n": 3, "title": "SARS Registered-Details Reconciliation", "steps": [{"n": 3, "title": "Compare PaperSync client master with SARS", "responsible": "AI Agent", "system": "PaperSync ↔ SARS approved integration", "reviewer": "Tax Consultant", "text": [], "items": ["Name and surname", "ID/passport and income tax reference number", "Contact information and residential address", "Marital status and tax residency", "Banking information where available/applicable"], "ordered": false, "groups": []}], "gates": [{"gate": "G02", "control": "SARS registered-details reconciliation approved", "owner": "Tax Consultant", "pass": "Proceed to annual case creation.", "notes": ["MD-01 general difference; MD-02 PaperSync/client record incorrect; MD-03 SARS amendment required.", "MD-04 residency/marital conflict; MD-05 banking mismatch; MD-06 identity/tax-reference linkage failure.", "Material identity, residency or banking discrepancies require human clearance; AI may not resolve them by assumption."]}]},
    {"n": 4, "title": "Create Annual ITR12 Case", "steps": [{"n": 4, "title": "Open annual case", "responsible": "PaperSync", "system": "PaperSync", "reviewer": "", "text": ["Create a distinct case, for example “2026 ITR12 Income Tax Return”. The annual repository contains the current questionnaire, pre-populated ITR12, annual tax documents, correspondence, calculations, approvals, SARS interactions, Declaration Alert, verification/audit records, ITA34 and post-assessment actions. Permanent KYC documents remain in the client master repository and are referenced rather than duplicated unnecessarily."], "items": [], "ordered": false, "groups": []}], "gates": []},
    {"n": 5, "title": "Current-Year Client Tax Questionnaire", "steps": [{"n": 5, "title": "Client completes structured current-year questionnaire", "responsible": "Client", "system": "PaperSync", "reviewer": "AI Agent for contradiction detection", "text": [], "items": ["Employment and pension/annuity income", "Investment income, interest and dividends", "Rental property", "Property, share and crypto disposals; capital gains/losses", "Medical scheme, additional medical expenses and disability", "Retirement annuity and donations", "Travel allowance, company vehicle and business travel", "Home-office claims", "Trade/business/self-employment", "Trust distributions", "Foreign income, assets, taxes and residency changes", "Other income, deductions and material changes from the prior year"], "ordered": false, "groups": []}], "gates": [{"gate": "G03", "control": "Current-year questionnaire complete", "owner": "Client / PaperSync", "pass": "Run four-source document requirement analysis.", "notes": ["QUE-01 incomplete; QUE-02 contradictory; QUE-03 material new tax event; QUE-04 prior-year item unexpectedly disappears.", "PaperSync requests targeted clarification. AI does not remove a prior-year item merely because the current questionnaire omits it."]}]},
    {"n": 6, "title": "Four-Source AI Document Requirement Engine", "steps": [{"n": 6, "title": "AI compares four sources", "responsible": "AI Agent", "system": "PaperSync", "reviewer": "Tax Consultant for material exceptions", "text": ["AI identifies recurring items, new items, disappeared items, significant year-on-year changes, new deductions/income streams, SARS pre-populated information, potential omissions and the evidence required."], "items": ["Previous submitted ITR12.", "Current SARS pre-populated ITR12.", "Previous firm supporting-document request.", "Current-year client tax questionnaire."], "ordered": true, "groups": []}, {"n": 7, "title": "Generate personalised annual document checklist", "responsible": "", "system": "", "reviewer": "", "text": ["Create an Annual ITR12 Supporting Documentation Repository separate from permanent KYC. Applicable items may include IRP5/IT3(a), investment certificates, medical certificates and expenditure, ITR-DD, retirement annuity certificates, section 18A certificates, travel logbook, rental schedules, capital-gains records, trade/business records, foreign income/tax documents and trust information."], "items": [], "ordered": false, "groups": []}], "gates": []},
    {"n": 7, "title": "Client Document Upload", "steps": [{"n": 8, "title": "Issue secure PaperSync upload request", "responsible": "PaperSync", "system": "PaperSync", "reviewer": "Administrator", "text": [], "items": ["Personalised request and secure upload link", "Outstanding-document dashboard", "Due date and automated reminders", "Upload against the relevant checklist item", "File scanning and format validation before AI processing"], "ordered": false, "groups": []}], "gates": []},
    {"n": 8, "title": "AI Document Validation", "steps": [{"n": 9, "title": "Process and validate every document", "responsible": "AI Agent", "system": "PaperSync", "reviewer": "Tax Consultant for material variances", "text": [], "items": ["Identify document type and taxpayer.", "Identify applicable tax year.", "Extract relevant values and retain source lineage.", "Associate the document with the requested item.", "Check completeness, duplication and file integrity.", "Compare against SARS pre-populated information.", "Compare materially with the previous year.", "Identify inconsistencies and missing evidence.", "Maintain source document → extracted value → tax category → calculator-field traceability."], "ordered": true, "groups": []}], "gates": [{"gate": "G04", "control": "Annual supporting documentation complete and consistent", "owner": "AI Agent; Tax Consultant for exceptions", "pass": "Populate the firm’s tax calculator.", "notes": ["DOC-01 missing; DOC-02 variance; DOC-03 wrong year; DOC-04 wrong taxpayer; DOC-05 duplicate; DOC-06 conflict; DOC-07 incomplete; DOC-08/09 SARS evidence mismatch.", "DOC-10 malware/unsafe file; DOC-11 unprocessable/encrypted file.", "AI-01 low confidence; AI-02 unclassifiable document. Unresolved items return to the client or consultant and are revalidated."]}]},
    {"n": 9, "title": "Automated Tax Calculator", "steps": [{"n": 10, "title": "Populate firm’s tax calculator", "responsible": "AI Agent", "system": "PaperSync / approved tax calculator", "reviewer": "Tax Consultant", "text": [], "items": ["Employment, investment, foreign, rental, trade/business and capital-gains information", "Exemptions, deductions, medical information, retirement contributions and donations", "Tax credits, PAYE/provisional tax and applicable supporting schedules", "Source document, extracted value, target field, AI/ruleset version and audit timestamp"], "ordered": false, "groups": []}, {"n": 11, "title": "Generate calculation pack", "responsible": "", "system": "", "reviewer": "", "text": [], "items": ["Comprehensive income-tax calculation", "Supporting schedules", "Reconciliation schedules", "Exception report", "Client tax report", "Relevant proposed/pre-populated ITR12 information"], "ordered": false, "groups": []}], "gates": []},
    {"n": 10, "title": "Technical Tax Review", "steps": [{"n": 12, "title": "Tax Consultant technical review", "responsible": "Tax Consultant", "system": "PaperSync", "reviewer": "Optional internal specialist escalation", "text": [], "items": ["Tax calculator, schedules and supporting evidence", "ITR12 data and material year-on-year changes", "AI exceptions and assumptions", "Residence, capital gains, foreign income/exemptions, trade losses, ring-fencing, trust distributions, unusual deductions and other judgement matters", "Completeness and proper disclosure"], "ordered": false, "groups": []}], "gates": [{"gate": "G05", "control": "Tax calculation and technical treatment approved", "owner": "Tax Consultant", "pass": "Release client review pack.", "notes": ["TAX-01 calculation error; TAX-02 judgement required; TAX-03 insufficient evidence; TAX-04 unresolved position; TAX-05 unexplained variance; TAX-06 tax ruleset/rate configuration error.", "AI-03 field mapping failure; AI-04 anomaly; AI-05 unsupported judgement; AI-07 model/ruleset change.", "Correction, recalculation, evidence request or internal escalation returns the case to G05."]}]},
    {"n": 11, "title": "Client Review and Explicit Approval", "steps": [{"n": 13, "title": "Send client review package", "responsible": "PaperSync", "system": "PaperSync", "reviewer": "Tax Consultant", "text": [], "items": ["Tax calculation.", "Supporting calculation schedules.", "Proposed ITR12 information.", "Explanatory report.", "Material matters requiring attention."], "ordered": true, "groups": []}, {"n": 14, "title": "Obtain affirmative version-specific client declaration", "responsible": "", "system": "", "reviewer": "", "text": ["The client confirms that the information, tax calculation and proposed ITR12 were reviewed; information supplied is complete and accurate to the best of the client’s knowledge; material disclosures are complete; and the firm is authorised to submit the identified ITR12 version to SARS."], "items": [], "ordered": false, "groups": []}], "gates": [{"gate": "G06", "control": "Client review and explicit submission authority", "owner": "Client", "pass": "Freeze approved versions.", "notes": ["CLT-02 rejection; CLT-03 new information; CLT-04 authority withheld; CLT-05 non-response; CLT-06 approval withdrawn.", "No implied approval through silence. PaperSync records client, timestamp, case, calculator version, ITR12 version and approval event."]}]},
    {"n": 12, "title": "Version Freeze", "steps": [{"n": 15, "title": "Freeze approved versions and evidence index", "responsible": "PaperSync", "system": "PaperSync", "reviewer": "Tax Consultant", "text": [], "items": ["Approved tax calculator", "Supporting schedules", "Proposed ITR12", "Supporting-document index", "Client approval event and exact approved versions"], "ordered": false, "groups": []}], "gates": [{"gate": "G07", "control": "Approved version frozen and no invalidating change", "owner": "PaperSync", "pass": "Proceed to final pre-submission validation.", "notes": ["VER-01 material post-approval change; VER-02 unauthorised change; VER-03 approval/version mismatch; VER-04 source document changed.", "Any material change creates a new version and returns the case for appropriate technical and client reapproval."]}]},
    {"n": 13, "title": "Final Pre-Submission Validation", "steps": [{"n": 16, "title": "Final AI cross-check", "responsible": "AI Agent", "system": "PaperSync", "reviewer": "Tax Consultant", "text": ["Reconcile Supporting Documents ↔ Tax Calculator ↔ Supporting Schedules ↔ ITR12. Confirm completeness, numbers, disclosures, schedules, versions, client authority and exception status."], "items": [], "ordered": false, "groups": []}], "gates": [{"gate": "G08", "control": "Final AI pre-submission validation passed", "owner": "AI Agent / PaperSync", "pass": "Route to final consultant approval.", "notes": ["PRE-01 reconciliation failure; PRE-02 blocking exception open; PRE-03 invalid authority; PRE-04 filing deadline risk.", "Detailed exception report is assigned, resolved and validation is rerun."]}, {"gate": "G09", "control": "Final firm submission approval", "owner": "Tax Consultant", "pass": "Release the exact approved transaction to G18.", "notes": ["Consultant confirms valid client approval, correct locked versions, resolved exceptions, complete ITR12 and appropriate disclosure.", "No system or AI may approve this gate."]}]},
    {"n": 14, "title": "SARS-Approved Integration and Submission", "steps": [{"n": 17, "title": "G18 integration gatekeeper checks", "responsible": "Integration Administrator / PaperSync", "system": "SARS-approved PaperSync ↔ eFiling integration", "reviewer": "Relevant substantive gate owner", "text": [], "items": ["Correct taxpayer and tax reference.", "Correct tax year and SARS function.", "Correct user/system authority and eFiling rights.", "Relevant client authority and Tax Consultant gate approval remain valid.", "Correct document/return version and file hash.", "No blocking S1/S2 exception.", "Interface function is within SARS-approved capability.", "Prior transaction status is known; unknown calls are not blindly retried."], "ordered": true, "groups": []}, {"n": 18, "title": "Submit ITR12", "responsible": "Tax Consultant authorises; integration transmits", "system": "PaperSync ↔ SARS eFiling", "reviewer": "Integration Administrator", "text": ["PaperSync stores consultant, submission timestamp, submitted ITR12 version, calculator version, client-approval version, file hash and SARS submission/reference evidence."], "items": ["SUB-01 submission rejected", "SUB-02 submitted version mismatch", "SUB-03 confirmation missing", "SUB-04 post-submission error discovered", "SUB-05 submission after authority withdrawal"], "ordered": false, "groups": []}], "gates": [{"gate": "G18", "control": "SARS integration transaction validation", "owner": "Integration Administrator plus substantive gate owner", "pass": "Execute, capture SARS response/reference and reconcile transaction.", "notes": ["INT-01 to INT-15 cover authentication, rights, outages, unknown status, duplicate risk, taxpayer mismatch, integrity, unsupported functions, rejection, missing response, gate bypass, schema changes, manual fallback, inbound routing and timestamp consistency.", "INT-04 rule: determine whether SARS processed the original call before retry. INT-11 rule: gate bypass is always blocked."]}]},
    {"n": 15, "title": "2026 SARS Declaration Alert", "steps": [{"n": 19, "title": "Detect and manage Declaration Questionnaire", "responsible": "AI Agent prepares; Tax Consultant approves", "system": "PaperSync ↔ SARS", "reviewer": "Client where clarification is needed", "text": [], "items": ["Analyse SARS questions and tax areas", "Locate and link evidence", "Draft proposed answers", "Identify missing information", "Assess whether any response conflicts with the filed return", "Control due date and escalation"], "ordered": false, "groups": []}], "gates": [{"gate": "G10", "control": "SARS Declaration Alert response approved", "owner": "Tax Consultant", "pass": "Submit approved response through G18 or move to verification.", "notes": ["DA-01 alert; DA-02 additional client info; DA-03 inconsistency; DA-04 routed to verification; DA-05 deadline risk.", "No material Declaration Questionnaire response is autonomously submitted by AI."]}]},
    {"n": 16, "title": "SARS Verification and Audit", "steps": [{"n": 20, "title": "Verification workflow", "responsible": "Tax Consultant", "system": "PaperSync ↔ SARS", "reviewer": "AI Agent prepares evidence index", "text": [], "items": ["Download and classify official SARS notice", "Capture due date", "Map each SARS request to repository evidence", "Identify missing documentation", "Prepare indexed response pack", "Validate completeness before one-time upload/release", "Submit through G18 and monitor outcome"], "ordered": false, "groups": []}, {"n": 21, "title": "Audit or expanded enquiry workflow", "responsible": "", "system": "", "reviewer": "", "text": ["A formal audit or expanded enquiry opens a controlled Tax Consultant-led workstream. AI may organise and draft, but scope, evidence, representations and submission remain human-controlled."], "items": [], "ordered": false, "groups": []}], "gates": [{"gate": "G11", "control": "SARS verification/audit response approved", "owner": "Tax Consultant", "pass": "Submit complete approved response and track outcome.", "notes": ["VRF-01 to VRF-05 cover verification initiation, missing evidence, due-date risk, outcome adjustment and incomplete one-time upload pack.", "AUD-01 to AUD-03 cover audit initiation, expanded requests and audit findings/adjustments."]}]},
    {"n": 17, "title": "ITA34 Assessment", "steps": [{"n": 22, "title": "Receive and reconcile ITA34", "responsible": "AI Agent", "system": "PaperSync ↔ SARS", "reviewer": "Tax Consultant", "text": ["Compare the final approved firm calculation to the ITA34, including taxable income, normal tax, rebates, medical credits, PAYE, provisional tax, other credits, refund/payment and other material assessed values."], "items": [], "ordered": false, "groups": []}], "gates": [{"gate": "G12", "control": "ITA34 reconciliation completed", "owner": "AI Agent; Tax Consultant for exceptions", "pass": "Prepare assessment communication for consultant approval.", "notes": ["ASM-01 delay; ASM-02 difference; ASM-03 unexplained difference; ASM-04 client evidence needed; ASM-05 wrong taxpayer/period/version; ASM-06 refund/payment status mismatch.", "AI prepares firm value, SARS value, difference, explanation and recommended action; unexplained reasons are not presented as fact."]}]},
    {"n": 18, "title": "Assessment Human Approval", "steps": [{"n": 23, "title": "Consultant reviews assessment pack", "responsible": "Tax Consultant", "system": "PaperSync", "reviewer": "", "text": [], "items": ["ITA34 and AI reconciliation", "Nature and cause of differences", "Plain-language client explanation", "Recommended next action", "Correct versions and supporting evidence"], "ordered": false, "groups": []}], "gates": [{"gate": "G13", "control": "Consultant approves assessment reconciliation and communication", "owner": "Tax Consultant", "pass": "Release assessment package to client.", "notes": ["If not approved, return for further investigation, evidence or reconciliation.", "The AI cannot decide that a material difference is acceptable."]}]},
    {"n": 19, "title": "Client Assessment Decision and SARS Remedies", "steps": [{"n": 24, "title": "Send client assessment package", "responsible": "PaperSync", "system": "PaperSync", "reviewer": "Tax Consultant", "text": [], "items": ["Confirmation of ITR12 submission", "ITA34", "Final firm calculation", "Reconciliation and plain-language explanation", "Recommended action where applicable"], "ordered": false, "groups": []}, {"n": 25, "title": "Determine appropriate SARS remedial route", "responsible": "Tax Consultant", "system": "PaperSync ↔ SARS", "reviewer": "AI Agent prepares supporting pack", "text": [], "items": ["Request for Correction where procedurally available", "Request for Reasons", "Notice of Objection", "Appeal or next dispute stage", "Additional client authority/evidence", "Procedural deadline control", "Payment/suspension considerations where applicable"], "ordered": false, "groups": []}], "gates": [{"gate": "G14", "control": "Client accepts assessment or instructs further action", "owner": "Client", "pass": "Close assessment stage or open remedial-action workstream.", "notes": ["CLT-07/REM-01 where the client requests investigation; silence is not acceptance.", "Client instruction is captured with timestamp and relevant assessment version."]}, {"gate": "G15", "control": "Tax Consultant approves SARS remedial action", "owner": "Tax Consultant", "pass": "Submit authorised remedy through G18 and track outcome.", "notes": ["REM-01 to REM-10 govern investigation, RFC, unavailable RFC, reasons, objection, appeal, authority/evidence, outcome, deadline and payment/suspension matters.", "SUB-04 feeds into this gate when a post-submission error is discovered."]}]},
    {"n": 20, "title": "Audit Trail", "steps": [{"n": 26, "title": "Maintain immutable event and exception history", "responsible": "PaperSync", "system": "PaperSync", "reviewer": "Compliance Owner", "text": [], "items": ["Case, actor and whether human/system/AI", "Date/time and action", "Source document and SARS transaction", "Previous and new values", "Document/calculation/return version", "Exception code, owner, severity and resolution", "Client queries/responses and consultant interventions", "Gate approvals and releases", "SARS references and outcomes"], "ordered": false, "groups": [{"title": "Mandatory exception object", "items": ["Exception ID and code", "Client and tax year/case", "Workflow stage and approval gate", "Severity and blocking status", "Trigger and source", "Raised by AI/system/human/SARS", "Owner and secondary reviewer", "Client action required and due date", "SARS statutory/procedural deadline", "Related exception", "Resolution action/evidence", "Resolved by/timestamp", "Human approval required", "Gate released status"]}]}], "gates": []},
    {"n": 21, "title": "Record Retention", "steps": [{"n": 27, "title": "Apply retention period and holds", "responsible": "Records Owner", "system": "PaperSync", "reviewer": "Tax Consultant / Compliance Owner", "text": ["At submission, PaperSync calculates the minimum tax-record retention/review date and prevents premature deletion. Verification, audit, investigation, dispute and other legal holds extend control until formally released."], "items": [], "ordered": false, "groups": []}], "gates": [{"gate": "G16", "control": "Retention/legal-hold release", "owner": "Records/Compliance Owner", "pass": "Approve controlled disposal/archiving only when all criteria are satisfied.", "notes": ["RET-01 verification/audit hold; RET-02 dispute/investigation hold; RET-03 retention period reached; RET-04 other legal hold; RET-05 incorrect retention metadata.", "No automatic deletion merely because a calendar date has been reached."]}]},
    {"n": 22, "title": "POPIA / Information Security", "steps": [{"n": 28, "title": "Parallel privacy and security incident path", "responsible": "Information Officer", "system": "PaperSync", "reviewer": "Integration Administrator / Tax Consultant as relevant", "text": [], "items": ["SEC-01 wrong-client data", "SEC-02 unauthorised access/disclosure", "SEC-03 incorrect recipient", "SEC-04 security compromise", "SEC-05 excessive access", "SEC-06 integration credential compromise", "SEC-07 lawful-purpose/processing conflict"], "ordered": false, "groups": []}], "gates": [{"gate": "G17", "control": "Information-security/privacy incident closure", "owner": "Information Officer", "pass": "Resume affected processing only when containment and required remediation are complete.", "notes": ["Security incidents operate in parallel with the tax workflow but can hard-stop affected transactions.", "DOC-04 is a detection exception and must link to SEC-01 for privacy incident management."]}]},
  ],
  sections: [
    {"title": "Working-document principle", "text": ["Future revisions must preserve existing fine-grained detail and add improvements without deleting prior controls unless a change is explicitly approved and documented."], "bullets": [], "numbered": [], "tables": [], "subs": []},
    {"title": "Document status and design assumptions", "text": [], "bullets": ["This document consolidates the detailed end-to-end workflow, approval gates, role allocation, exception paths and the final exception-code architecture.", "PaperSync maintains two distinct repositories: a permanent Client/KYC Repository and a separate annual ITR12 case repository.", "The proposed PaperSync to SARS eFiling integration is assumed to be formally compliant and approved by SARS. Automation is restricted to interface functions actually authorised by SARS.", "Automated transport does not constitute authorisation. Every outbound SARS action must first pass the relevant substantive approval gate and G18 integration validation.", "AI may extract, classify, compare, calculate, populate, reconcile and draft. Material tax judgement, client authority and SARS submissions remain human-controlled.", "The master code list is maintained in the accompanying Excel Exception Register. Codes printed in this workflow must map to that register."], "numbered": [], "tables": [], "subs": [{"title": "Core control principle", "text": ["AI performs automated processing and prepares recommendations; PaperSync controls the process and evidence; the Client confirms facts and grants version-specific authority; the Tax Consultant remains accountable for material tax judgement and SARS submissions."], "bullets": [], "numbered": [], "tables": [], "subs": []}]},
    {"title": "Roles and responsibilities", "text": [], "bullets": [], "numbered": [], "tables": [[["Role", "Primary responsibility", "Mandatory approvals / controls"], ["Client", "Supplies information/documents, answers queries, confirms completeness, approves return and instructs the firm on post-assessment action.", "G03, G06, G14 and client-input portions of G04/G10/G11/G15."], ["Administrator", "Permanent onboarding, KYC administration, document administration, reminders and administrative exception handling.", "G01 and assigned S3 administrative resolutions."], ["Tax Consultant", "Professional tax judgement, technical review, exception resolution, SARS submission and remedial processes.", "G02, G05, G09, G10, G11, G13 and G15."], ["PaperSync", "Portal, workflow orchestration, repositories, reminders, audit trail, versioning, locks, gate enforcement and integration transaction records.", "G07, G08 control enforcement and prevention of gate bypass."], ["AI Agent", "Classification, extraction, comparison, validation, calculator population, reconciliation, exception detection and drafting.", "Cannot approve material tax positions or final submissions."], ["Integration Administrator", "Maintains SARS-approved interface, authentication, transaction integrity, retry control and interface monitoring.", "G18, with substantive approval owner."], ["Information Officer", "Privacy/security incident management, access governance and POPIA incident assessment.", "G17."], ["Records/Compliance Owner", "Retention schedules, legal/tax holds, disposal review and control oversight.", "G16 and critical control override governance."], ["SARS/eFiling", "Registered taxpayer data, pre-populated ITR12, Declaration Alerts, verification/audit processes, assessments and remedial outcomes.", "External system response does not replace firm/client approvals."]]], "subs": []},
    {"title": "Approval gate register", "text": [], "bullets": [], "numbered": [], "tables": [[["Gate", "Control", "Owner", "Release criterion"], ["G01", "Permanent Client/KYC approved", "Administrator", "No annual case activation until mandatory client data, documents, POPIA documentation and appointment/mandate are valid."], ["G02", "SARS registered-details reconciliation approved", "Tax Consultant", "Material identity, residency, marital, tax-reference and banking differences must be cleared or formally controlled."], ["G03", "Current-year questionnaire complete", "Client / PaperSync", "All mandatory current-year questions answered and contradictions resolved."], ["G04", "Annual supporting documentation complete and consistent", "AI Agent; Tax Consultant for exceptions", "Documents are complete, correctly classified, linked to the taxpayer/year and reconciled to SARS/pre-populated data."], ["G05", "Tax calculation and technical treatment approved", "Tax Consultant", "Material tax positions, calculations, schedules, disclosures and exceptions have been reviewed."], ["G06", "Client review and explicit submission authority", "Client", "Affirmative, version-specific approval. Silence is never approval."], ["G07", "Approved version frozen and unchanged", "PaperSync", "Any material post-approval change creates a new version and invalidates affected approvals."], ["G08", "Final AI pre-submission validation passed", "AI Agent / PaperSync", "Supporting documents, calculator, schedules and ITR12 reconcile; no blocking exception remains."], ["G09", "Final firm submission approval", "Tax Consultant", "Consultant confirms correct versions, valid client authority and readiness to submit."], ["G10", "SARS Declaration Alert response approved", "Tax Consultant", "No material Declaration Questionnaire response is submitted without human review."], ["G11", "SARS verification/audit response approved", "Tax Consultant", "Complete response pack, correct taxpayer/period, indexed evidence and deadline control."], ["G12", "ITA34 reconciliation completed", "AI Agent; Tax Consultant for exceptions", "ITA34 is reconciled to the final approved calculation and all material differences are explained."], ["G13", "Consultant approves ITA34 reconciliation and client communication", "Tax Consultant", "Assessment pack and recommended action are approved before release."], ["G14", "Client accepts assessment or instructs further action", "Client", "Client explicitly accepts or gives a specific instruction to investigate or use an appropriate SARS remedy."], ["G15", "Tax Consultant approves SARS remedial action", "Tax Consultant", "Correct procedural route selected, authority/evidence present and deadline controlled."], ["G16", "Retention/legal-hold release", "Records/Compliance Owner", "Statutory retention satisfied and no verification, audit, investigation, dispute or other legal hold remains."], ["G17", "Information-security/privacy incident closure", "Information Officer", "Containment, investigation, remediation and notification assessment completed."], ["G18", "SARS integration transaction validation", "Integration Administrator + substantive gate owner", "Correct taxpayer, year, authority, function, version, file integrity and SARS transaction status confirmed."]]], "subs": []},

/* ===================== itr12/dates.js ===================== */
/* Due-date engine. The business-day logic is ported line for line from the firm's "SARS Business Day Calculator V4"
   (5 Oct 2026): South African public holidays with Sunday→Monday observance, Easter, the Chapter 9 exclusion
   (16 December to 15 January, inclusive) and the 21-business-day verification tracker (submission date = Day 0).
   Dates are calendar days handled in UTC, exactly as the calculator does. tests/test_dates.py checks parity with the calculator. */
const DATES = (() => {
  const DAY = 86400000;
  function dt(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    const [y, m, d] = s.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1, d));
    return x.getUTCFullYear() === y && x.getUTCMonth() === m - 1 && x.getUTCDate() === d ? x : null;
  }
  const add = (d, n) => new Date(d.getTime() + n * DAY);
  const iso = (d) => d.toISOString().slice(0, 10);
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
      h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = (h + l - 7 * m + 114) % 31 + 1;
    return new Date(Date.UTC(y, mo - 1, da));
  }
  const FIXED = [[1, 1, "New Year's Day"], [3, 21, 'Human Rights Day'], [4, 27, 'Freedom Day'], [5, 1, "Workers' Day"], [6, 16, 'Youth Day'],
    [8, 9, "National Women's Day"], [9, 24, 'Heritage Day'], [12, 16, 'Day of Reconciliation'], [12, 25, 'Christmas Day'], [12, 26, 'Day of Goodwill']];
  const cache = new Map();
  function holidays(y) {
    if (cache.has(y)) return cache.get(y);
    const m = new Map(); const put = (d, n) => { const k = iso(d); m.set(k, m.has(k) ? m.get(k) + '; ' + n : n); };
    FIXED.forEach(([mo, d, n]) => put(new Date(Date.UTC(y, mo - 1, d)), n));
    const e = easter(y); put(add(e, -2), 'Good Friday'); put(add(e, 1), 'Family Day');
    [...m].forEach(([k, n]) => { const d = dt(k); if (d.getUTCDay() === 0) put(add(d, 1), n + ' observed'); });
    cache.set(y, m); return m;
  }
  // Additional declared public holidays (verified separately, each with its source). Same role as the calculator's "custom" box.
  const EXTRA = new Map();
  // Declared under s2A of the Public Holidays Act: Proclamation Notice 346 of 2026, Government Gazette 55352, 8 Sep 2026.
  // https://www.gov.za/sites/default/files/gcis_document/202609/55352-rg12046pr346.pdf
  EXTRA.set('2026-11-04', 'Local government elections');
  const isChapter9 = (d) => { const mo = d.getUTCMonth() + 1, da = d.getUTCDate(); return (mo === 12 && da >= 16) || (mo === 1 && da <= 15); };
  // A business day excludes Saturday, Sunday and a public holiday; Chapter 9 periods also exclude 16 Dec–15 Jan.
  function biz(d, o) {
    const w = d.getUTCDay();
    return w !== 0 && w !== 6 && !holidays(d.getUTCFullYear()).has(iso(d)) && !EXTRA.has(iso(d)) && !(o && o.ch9 && isChapter9(d));
  }
  function nextBiz(d, o) { do { d = add(d, 1); } while (!biz(d, o)); return d; }
  // n business days after d (d itself is Day 0).
  function addBusinessDays(d, n, o) { let k = 0; while (k < n) { d = add(d, 1); if (biz(d, o)) k++; } return d; }
  // Business days from a to b: a is Day 0, so tomorrow-if-a-business-day is 1. Negative when b is before a.
  function businessDaysBetween(a, b, o) {
    if (iso(a) === iso(b)) return 0;
    const sign = b > a ? 1 : -1; let n = 0; let d = a;
    while (iso(d) !== iso(b)) { d = add(d, sign); if (biz(d, o)) n += sign; }
    return n;
  }
  // The calculator's 21-business-day verification tracker. method 'after' (recommended): submission date is Day 0.
  // method 'include': the submission date is Day 1 if it is a business day.
  function verification21(submitted, method) {
    let d = new Date(submitted); let n = 0; const rows = [];
    if (method === 'include' && biz(d)) { n = 1; rows.push([n, new Date(d)]); }
    while (n < 21) { d = add(d, 1); if (biz(d)) { n++; rows.push([n, new Date(d)]); } }
    return { submitted, day1: rows[0][1], target: new Date(d), follow: nextBiz(d), method, rows };
  }
  // The calculator's "business days between dates". mode: 'es' exclude start/include end, 'both', 'neither', 'ee' include start/exclude end.
  function countRange(s, e, mode, ch9) {
    let a = new Date(s), z = new Date(e);
    if (mode === 'es' || mode === 'neither') a = add(a, 1);
    if (mode === 'ee' || mode === 'neither') z = add(z, -1);
    const rows = []; let b = 0, x = 0, t = 0;
    for (let d = a; d <= z; d = add(d, 1)) {
      t++; const rs = []; const w = d.getUTCDay(); const h = holidays(d.getUTCFullYear()).get(iso(d)); const ch = EXTRA.get(iso(d));
      if (w === 0 || w === 6) rs.push(w === 0 ? 'Sunday' : 'Saturday');
      if (h || ch) rs.push([h, ch].filter(Boolean).join('; '));
      if (ch9 && isChapter9(d)) rs.push('Chapter 9 exclusion');
      if (rs.length) x++; else b++;
      rows.push({ date: iso(d), business: !rs.length, reason: rs.join(' | ') || 'Counted' });
    }
    return { business: b, total: t, excluded: x, rows };
  }
  // Bridges between the app's local-time Dates and the calculator's UTC calendar days.
  const fromLocal = (d) => new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const toLocal = (u, h = 17, mi = 0) => new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), h, mi);
  const holidayName = (d) => holidays(d.getUTCFullYear()).get(iso(d)) || EXTRA.get(iso(d)) || null;
  return { DAY, dt, add, iso, easter, holidays, EXTRA, isChapter9, biz, nextBiz, addBusinessDays, businessDaysBetween, verification21, countRange, fromLocal, toLocal, holidayName };
})();

/* ===================== itr12/calc.js ===================== */
/* The income tax calculation for an individual (ITR12), from the values extracted from the case's documents.
   CALC.compute(inputs, profile, ruleset) and CALC.forCase(c) are pure: they never change the case or the state.
   Lineage: document → extracted value (an input line: docId, ref, amount) → tax category → calculator field → calculation line.
   Judgement items (home office, travel, trade, foreign income, trusts, a deceased taxpayer) are never calculated by the preview:
   until the Tax Consultant records the amount and the rationale (line.decided), they are left out and listed in calc.pending with
   the code the engine raises (TAX-02, or AI-05 where interpretation goes beyond the approved rules).

   Order of the calculation (Income Tax Act):
     income = employment income + local interest − interest exemption (s10(1)(i)) + net rental + decided other income
     less decided deductions (home office, travel)                                  → "before s11F", excluding capital gains
     taxable capital gain (Eighth Schedule paras 5-10): aggregate gain less the annual exclusion, less any assessed capital loss
       brought forward, × the inclusion rate; a loss is reduced by the exclusion and carried forward
     s11F(2) = lowest of: the cap; 27.5% × the greater of remuneration and (before s11F + taxable capital gain); before s11F
     s18A = 10% × taxable income before s18A (capital gain included)
     normal tax on taxable income; less rebates (s6), s6A and s6B credits, other credits, each limited to the tax left
     result = tax after credits − PAYE − provisional tax paid (positive: payable; negative: refund) */
const CALC = (() => {
  const own = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
  // Calculator fields: the tax category each extracted value belongs to, how it is used, and which documents it may come from.
  const FIELDS = {
    remuneration:     { cat: 'Employment income', label: 'Remuneration', use: 'employment', kinds: ['irp5'] },
    medicalFringe:    { cat: 'Employment income', label: 'Employer-paid medical scheme fees (taxable fringe benefit)', use: 'employment', kinds: ['irp5'] },
    paye:             { cat: 'Tax paid', label: 'Employees’ tax (PAYE)', use: 'paye', kinds: ['irp5'] },
    provisionalPaid:  { cat: 'Tax paid', label: 'Provisional tax paid', use: 'provisional', kinds: ['notice'], sars: true },
    interest:         { cat: 'Local interest', label: 'Local interest', use: 'interest', kinds: ['it3b'] },
    dividends:        { cat: 'Local dividends', label: 'Local dividends (exempt)', use: 'exempt', kinds: ['it3b'] },
    rentalIncome:     { cat: 'Rental', label: 'Rental income', use: 'rental', kinds: ['rental'] },
    rentalExpenses:   { cat: 'Rental', label: 'Rental expenses', use: 'rentalCost', kinds: ['rental'] },
    capitalGain:      { cat: 'Capital gains', label: 'Capital gain or loss on a disposal', use: 'cgt', kinds: ['it3c'], signed: true },
    retirementFund:   { cat: 'Retirement fund contributions (s11F)', label: 'Pension or provident fund contributions', use: 's11f', kinds: ['irp5'] },
    ra:               { cat: 'Retirement fund contributions (s11F)', label: 'Retirement annuity contributions', use: 's11f', kinds: ['ra', 'irp5'] },
    medicalFees:      { cat: 'Medical (s6A and s6B)', label: 'Medical scheme fees paid by the taxpayer, including employer-paid fees taxed as a fringe benefit', use: 'fees', kinds: ['medical'] },
    medicalExpenses:  { cat: 'Medical (s6B)', label: 'Qualifying medical expenses not recovered', use: 'expenses', kinds: ['medical'] },
    donations:        { cat: 'Donations (s18A)', label: 'Donations with s18A receipts', use: 's18a', kinds: ['donation'] },
    homeOffice:       { cat: 'Home office', label: 'Home office expenses', use: 'deduction', kinds: ['homeoffice'], judgement: 'TAX-02' },
    travel:           { cat: 'Travel', label: 'Business travel (logbook)', use: 'deduction', kinds: ['logbook'], judgement: 'TAX-02' },
    trade:            { cat: 'Trade', label: 'Trade income (net)', use: 'other', kinds: null, judgement: 'TAX-02', signed: true },
    foreignIncome:    { cat: 'Foreign income', label: 'Foreign income', use: 'other', kinds: ['foreign'], judgement: 'AI-05', signed: true },
    foreignTaxCredit: { cat: 'Foreign income', label: 'Foreign tax credit (s6quat)', use: 'credit', kinds: ['foreign'], judgement: 'AI-05' },
    trust:            { cat: 'Trust distributions', label: 'Trust distribution', use: 'other', kinds: null, judgement: 'AI-05', signed: true },
  };
  const fieldOf = (k) => (own(FIELDS, k) ? FIELDS[k] : null);
  const rulesetOf = (v) => (own(RULESETS, v) ? RULESETS[v] : null);
  // Document kinds whose values belong in the calculation: a validated one with no extracted value fails the reconciliation.
  const FEEDS = ['irp5', 'it3b', 'it3c', 'medical', 'ra', 'rental', 'logbook', 'homeoffice', 'donation', 'foreign'];

  // Rounding to the cent, half away from zero on the decimal value (toPrecision strips binary noise), never −0.
  const r2 = (x) => { const v = Math.round(Number((Math.abs(x) * 100).toPrecision(15))) / 100; return v === 0 ? 0 : (x < 0 ? -v : v); };
  // Truncation to the cent, as SARS's worked examples do for the s6B credit (IT07).
  const t2 = (x) => Math.floor(Number((Math.max(0, x) * 100).toPrecision(15))) / 100;
  const cents = (a) => Math.abs(Number((a * 100).toPrecision(15)) - Math.round(a * 100)) < 1e-6;
  const rand = (n) => { const [i, d] = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '−R' : 'R') + i.replace(/\B(?=(\d{3})+$)/g, ',') + '.' + d; };
  const pct = (x) => r2(x * 100) + '%';

  // Normal tax from the brackets: base of the highest bracket the income passes, plus its rate on the amount above it.
  function bracketTax(rs, ti) {
    if (!(ti > 0)) return 0;
    const row = rs.brackets.slice().reverse().find((b) => ti > b[0]);
    return r2(row[2] + row[1] * (ti - row[0]));
  }
  // The tax threshold: the taxable income at which normal tax equals the rebates (rounded up to the rand, as SARS publishes it).
  function threshold(rs, age) {
    if (!(typeof age === 'number' && age >= 0)) return null;
    const reb = rs.rebates.primary + (age >= 65 ? rs.rebates.secondary : 0) + (age >= 75 ? rs.rebates.tertiary : 0);
    const rows = rs.brackets;
    for (let i = 0; i < rows.length; i++) {
      const next = rows[i + 1];
      if (!next || reb < next[2]) return Math.ceil(rows[i][0] + (reb - rows[i][2]) / rows[i][1] - 1e-6) || 0;
    }
    return null;
  }

  // Dates of birth and age on the last day of the year of assessment.
  const realDate = (y, m, d) => { const x = new Date(Date.UTC(y, m - 1, d)); return x.getUTCFullYear() === y && x.getUTCMonth() === m - 1 && x.getUTCDate() === d ? x.toISOString().slice(0, 10) : null; };
  const yearEnd = (year) => (Number.isInteger(year) ? new Date(Date.UTC(year, 2, 0)).toISOString().slice(0, 10) : null);
  function ageOn(dob, iso) {
    if (!dob || !iso) return null;
    const [y, m, d] = dob.split('-').map(Number); const [Y, M, D] = iso.split('-').map(Number);
    return Y - y - (M < m || (M === m && D < d) ? 1 : 0);
  }
  // The client's recorded date of birth when it is a real date; otherwise the first six digits of the SA ID number (YYMMDD).
  // The ID gives no century: a 20xx reading after the year end is 19xx; a reading that makes the filer younger than 16 could
  // equally be a centenarian, so the date of birth must then be recorded (null here).
  function dobOf(cl, year) {
    if (cl && cl.dob) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(cl.dob); const d = m && realDate(+m[1], +m[2], +m[3]); if (d) return d; }
    const m = /^(\d{2})(\d{2})(\d{2})\d{7}$/.exec(String((cl && cl.idNo) || ''));
    if (!m || !Number.isInteger(year)) return null;
    const yy = +m[1]; const end = yearEnd(year);
    const d1900 = realDate(1900 + yy, +m[2], +m[3]);
    if (yy > year % 100) return d1900;
    const d2000 = realDate(2000 + yy, +m[2], +m[3]);
    if (!d2000 || d2000 > end) return d1900;
    return ageOn(d2000, end) < 16 ? null : d2000;
  }
  function profileOf(cl, year, inputs) {
    const end = yearEnd(year); const dob = dobOf(cl, year);
    return { year, yearEnd: end, dob, age: ageOn(dob, end), disability: !!(inputs && inputs.medical && inputs.medical.disability), deceased: !!(cl && cl.deceased) };
  }

  const ZERO = () => ({ taxableIncome: 0, normalTax: 0, rebates: 0, medicalCredits: 0, paye: 0, provisional: 0, otherCredits: 0, result: 0 });
  const mtcFor = (rs, deps) => rs.mtc.main + (deps >= 1 ? rs.mtc.first : 0) + Math.max(0, deps - 1) * rs.mtc.additional;

  function compute(inputs, prof, rs, version) {
    inputs = inputs && typeof inputs === 'object' ? inputs : {};
    const errors = []; const pending = []; const used = [];
    const ver = rs ? rs.version : (version || null);
    if (!rs) errors.push('Ruleset ' + (version || '(none)') + ' is not defined');
    if (!Number.isInteger(prof.year)) errors.push('The case has no valid year of assessment');
    else if (prof.age == null) errors.push('The age cannot be determined: record the date of birth (the ID number does not settle it)');
    // A ruleset for another year is not a validation error (TAX-01) but a configuration error (TAX-06): the engine raises it.
    const wrongYear = !!(rs && Number.isInteger(prof.year) && rs.year !== prof.year);
    const seen = new Set();
    (Array.isArray(inputs.lines) ? inputs.lines : []).forEach((l, i) => {
      if (!l || typeof l !== 'object') { errors.push('Extracted value ' + (i + 1) + ' is empty'); return; }
      const f = fieldOf(l.field);
      if (!l.id || seen.has(l.id)) { errors.push('Every extracted value needs its own id' + (l.id ? ': ' + l.id + ' is used twice' : '')); return; }
      seen.add(l.id);
      if (!f) { errors.push(l.id + ': unknown calculator field ' + l.field); return; }
      if (typeof l.amount !== 'number' || !isFinite(l.amount)) { errors.push(l.id + ': ' + f.label + ' is not a number'); return; }
      if (!cents(l.amount)) { errors.push(l.id + ': ' + f.label + ' is not a whole number of cents'); return; }
      if (l.amount < 0 && !f.signed) { errors.push(l.id + ': ' + f.label + ' cannot be negative'); return; }
      if (f.judgement && !(l.decided && l.decided.by && String(l.decided.rationale || '').trim())) {
        pending.push({ line: l.id, field: l.field, label: f.label, amount: r2(l.amount), code: f.judgement }); return;
      }
      used.push(l);
    });
    // Medical scheme membership: months and dependants, or periods of { months, dependants } when the cover changed in the year,
    // and the taxpayer's share of the fees when someone else paid part of them (s6A(3A)).
    const med = inputs.medical && typeof inputs.medical === 'object' ? inputs.medical : {};
    const periods = Array.isArray(med.periods) && med.periods.length ? med.periods
      : [{ months: med.months == null ? 0 : med.months, dependants: med.dependants == null ? 0 : med.dependants }];
    periods.forEach((p) => {
      if (!(p && Number.isInteger(p.months) && p.months >= 0 && p.months <= 12)) errors.push('Medical scheme months must be a whole number from 0 to 12');
      if (!(p && Number.isInteger(p.dependants) && p.dependants >= 0)) errors.push('The number of medical scheme dependants must be a whole number');
    });
    const months = periods.reduce((a, p) => a + ((p && Number.isInteger(p.months)) ? p.months : 0), 0);
    if (months > 12) errors.push('The medical scheme periods add up to more than 12 months');
    const share = med.share == null ? 1 : med.share;
    if (!(typeof share === 'number' && share > 0 && share <= 1)) errors.push('The share of the medical scheme fees must be more than 0 and at most 1');
    const carried = inputs.carried && typeof inputs.carried === 'object' ? inputs.carried : {};
    const cf = (k) => { const v = carried[k]; if (v == null) return 0; if (typeof v === 'number' && v >= 0 && cents(v)) return v; errors.push('Carried-forward ' + k + ' must be zero or a positive amount in cents'); return 0; };
    const cfS11f = cf('s11f'); const cfS18a = cf('s18a'); const cfLoss = cf('capitalLoss');
    if (prof.deceased) pending.push({ line: 'deceased', field: null, label: 'Deceased taxpayer: the year of assessment ends on the date of death', amount: 0, code: 'AI-05' });

    const tot = (use) => r2(used.filter((l) => FIELDS[l.field].use === use).reduce((a, l) => a + l.amount, 0));
    const ids = (...uses) => used.filter((l) => uses.includes(FIELDS[l.field].use)).map((l) => l.id);
    const lines = []; const put = (key, label, amount, basis, from) => { const v = r2(amount); lines.push({ key, label, amount: v, basis: basis || '', from: from || [] }); return v; };
    if (!rs || prof.age == null || !Number.isInteger(prof.year) || prof.deceased) {
      return { ruleset: ver, year: rs ? rs.year : null, summary: ZERO(), lines, pending, errors, wrongYear, profile: prof, schedules: null, used };
    }

    const senior = prof.age >= 65; const over75 = prof.age >= 75;
    const fees = tot('fees'); const exp = tot('expenses');
    if (fees > 0 && !months) errors.push('Medical scheme fees are recorded but no months of membership');
    // Income
    const emp = put('employment', 'Employment income', tot('employment'), 'Remuneration and taxable fringe benefits from the IRP5', ids('employment'));
    const intGross = put('interest', 'Local interest', tot('interest'), '', ids('interest'));
    const exLimit = senior ? rs.interestExemption.over65 : rs.interestExemption.under65;
    const intEx = Math.min(intGross, exLimit);
    put('interestExempt', 'Less: interest exemption', -intEx, 's10(1)(i): up to ' + rand(exLimit) + (senior ? ' (65 or older)' : ' (under 65)'));
    const rentIn = tot('rental'); const rentOut = tot('rentalCost');
    const rental = put('rental', 'Net rental income', rentIn - rentOut, rand(rentIn) + ' income less ' + rand(rentOut) + ' expenses', ids('rental', 'rentalCost'));
    const other = put('otherIncome', 'Other income (Tax Consultant’s decision)', tot('other'), 'Judgement items with a recorded decision', ids('other'));
    const income = put('income', 'Income', emp + intGross - intEx + rental + other, 'Gross income less exempt income');
    const ded = tot('deduction');
    put('deductions', 'Less: deductions (Tax Consultant’s decision)', -ded, 'Judgement items with a recorded decision', ids('deduction'));
    const beforeRf = r2(income - ded);
    // Capital gains (Eighth Schedule): the annual exclusion, then any assessed capital loss brought forward, then the inclusion rate.
    const agg = put('capitalGains', 'Aggregate capital gain or loss', tot('cgt'), 'Sum of the gains and losses on disposals', ids('cgt'));
    const excl = rs.cgt.exclusion;
    const aggGain = agg > 0 ? Math.max(0, agg - excl) : 0;
    const aggLoss = agg < 0 ? Math.max(0, -agg - excl) : 0;
    const netGain = r2(Math.max(0, aggGain - cfLoss));
    const lossCarried = r2(aggLoss + Math.max(0, cfLoss - aggGain));
    let cgBasis;
    if (!agg && !cfLoss) cgBasis = 'No disposals';
    else if (agg < 0) cgBasis = 'Loss of ' + rand(-agg) + ' reduced by the ' + rand(excl) + ' annual exclusion' + (cfLoss ? ', plus ' + rand(cfLoss) + ' brought forward' : '') + ': assessed capital loss of ' + rand(lossCarried) + ' carried forward';
    else if (agg <= excl && !cfLoss) cgBasis = 'Gain of ' + rand(agg) + ' within the ' + rand(excl) + ' annual exclusion';
    else cgBasis = '(' + rand(agg) + ' less the ' + rand(excl) + ' annual exclusion' + (cfLoss ? ' and the ' + rand(cfLoss) + ' assessed capital loss brought forward' : '') + ') × ' + pct(rs.cgt.inclusion) + ' inclusion rate' + (lossCarried ? '; ' + rand(lossCarried) + ' still carried forward' : '');
    const tcg = put('taxableCapitalGain', 'Taxable capital gain', netGain * rs.cgt.inclusion, cgBasis);
    // Retirement fund contributions (s11F)
    const contrib = r2(tot('s11f') + cfS11f);
    const base27 = Math.max(emp, beforeRf + tcg);
    const lim = { cap: rs.s11f.cap, pct: r2(rs.s11f.rate * base27), ti: Math.max(0, beforeRf) };
    const d11f = Math.min(contrib, lim.cap, lim.pct, lim.ti);
    put('s11f', 'Less: retirement fund contributions (s11F)', -d11f,
      contrib ? 'Lowest of ' + rand(lim.cap) + ', ' + pct(rs.s11f.rate) + ' of ' + rand(base27) + ' (' + rand(lim.pct) + ') and ' + rand(lim.ti) + '; contributions ' + rand(contrib) : 'No contributions', ids('s11f'));
    // Donations (s18A)
    const before18a = r2(beforeRf - d11f + tcg);
    const don = r2(tot('s18a') + cfS18a);
    const lim18a = r2(Math.max(0, rs.s18a.rate * before18a));
    const d18a = Math.min(don, lim18a);
    put('s18a', 'Less: donations (s18A)', -d18a, don ? 'Up to ' + pct(rs.s18a.rate) + ' of ' + rand(before18a) + ' (' + rand(lim18a) + '); donated ' + rand(don) : 'No donations', ids('s18a'));
    const tiRaw = r2(before18a - d18a);
    const ti = put('taxableIncome', 'Taxable income', Math.max(0, tiRaw), tiRaw < 0 ? 'Assessed loss of ' + rand(-tiRaw) + ' carried forward' : '');
    // Tax
    const row = ti > 0 ? rs.brackets.slice().reverse().find((b) => ti > b[0]) : rs.brackets[0];
    const nt = put('normalTax', 'Normal tax', bracketTax(rs, ti), ti > 0 ? rand(row[2]) + ' + ' + pct(row[1]) + ' of the amount above ' + rand(row[0]) : 'No taxable income');
    const rebFull = rs.rebates.primary + (senior ? rs.rebates.secondary : 0) + (over75 ? rs.rebates.tertiary : 0);
    const reb = Math.min(rebFull, nt);
    put('rebates', 'Less: rebates', -reb, 'Primary ' + rand(rs.rebates.primary) + (senior ? ' + secondary ' + rand(rs.rebates.secondary) : '') + (over75 ? ' + tertiary ' + rand(rs.rebates.tertiary) : '') +
      ' (age ' + prof.age + ' on ' + prof.yearEnd + ')' + (reb < rebFull ? '; limited to the normal tax' : ''));
    let left = r2(nt - reb);
    // Medical credits: s6A per month of membership (apportioned by the share of the fees paid), then s6B (truncated to the cent).
    const s6aFull = fees > 0 ? r2(periods.reduce((a, p) => a + mtcFor(rs, p.dependants) * p.months, 0)) : 0;
    const s6a = r2(s6aFull * share);
    const s6aUsed = Math.min(s6a, left); left = r2(left - s6aUsed);
    const seniorMed = senior || !!med.disability;
    const feesOver = seniorMed ? Math.max(0, fees - rs.s6b.multipleSenior * s6a) : Math.max(0, fees - rs.s6b.multiple * s6a);
    const s6b = seniorMed ? t2(rs.s6b.rateSenior * feesOver + rs.s6b.rateSenior * exp) : t2(rs.s6b.rate * Math.max(0, feesOver + exp - rs.s6b.floor * ti));
    const s6bUsed = Math.min(s6b, left); left = r2(left - s6bUsed);
    const per = periods.length === 1 ? rand(mtcFor(rs, periods[0].dependants)) + ' a month × ' + months + ' months'
      : periods.map((p) => rand(mtcFor(rs, p.dependants)) + ' × ' + p.months + ' months').join(' + ');
    put('s6a', 'Less: medical scheme fees tax credit (s6A)', -s6aUsed,
      fees > 0 && !months ? 'Fees recorded but no months of membership' : !fees ? 'No medical scheme fees'
        : per + (share < 1 ? ' × ' + pct(share) + ' share of the fees (s6A(3A))' : '') + (s6aUsed < s6a ? '; limited to the tax left' : ''), ids('fees'));
    const limitedNote = s6bUsed < s6b ? '; limited to the tax left' : '';
    put('s6b', 'Less: additional medical expenses tax credit (s6B)', -s6bUsed, seniorMed
      ? pct(rs.s6b.rateSenior) + ' × excess fees ' + rand(feesOver) + ' (fees ' + rand(fees) + ' − ' + rs.s6b.multipleSenior + ' × ' + rand(s6a) + ', not below nil) + ' + pct(rs.s6b.rateSenior) + ' × expenses ' + rand(exp) + (senior ? ' (65 or older)' : ' (disability)') + limitedNote
      : pct(rs.s6b.rate) + ' × (excess fees ' + rand(feesOver) + ' (fees ' + rand(fees) + ' − ' + rs.s6b.multiple + ' × ' + rand(s6a) + ', not below nil) + expenses ' + rand(exp) + ' − ' + pct(rs.s6b.floor) + ' × ' + rand(ti) + ', not below nil)' + limitedNote,
      ids('fees', 'expenses'));
    const credit = tot('credit'); const oc = Math.min(credit, left); left = r2(left - oc);
    put('otherCredits', 'Less: other credits (Tax Consultant’s decision)', -oc, credit ? (oc < credit ? 'Limited to the tax left' : 'Recorded by the Tax Consultant') : '', ids('credit'));
    const liability = put('liability', 'Tax after rebates and credits', left);
    const paye = put('paye', 'Less: PAYE', -tot('paye'), '', ids('paye'));
    const prov = put('provisional', 'Less: provisional tax paid', -tot('provisional'), '', ids('provisional'));
    const result = put('result', tot('paye') + tot('provisional') > liability ? 'Refund due' : 'Amount payable', liability + paye + prov, 'Positive: payable to SARS; negative: refund');
    const summary = { taxableIncome: ti, normalTax: nt, rebates: r2(reb), medicalCredits: r2(s6aUsed + s6bUsed), paye: tot('paye'), provisional: tot('provisional'), otherCredits: r2(oc), result };
    const schedules = {
      employment: { remuneration: emp, paye: tot('paye'), lines: ids('employment', 'paye') },
      interest: { gross: intGross, exempt: r2(intEx), taxable: r2(intGross - intEx), limit: exLimit, lines: ids('interest') },
      dividends: { exempt: tot('exempt'), lines: ids('exempt') },
      rental: { income: rentIn, expenses: rentOut, net: rental, lines: ids('rental', 'rentalCost') },
      cgt: { aggregate: agg, exclusion: excl, broughtForward: cfLoss, net: netGain, inclusion: rs.cgt.inclusion, taxable: tcg, lossCarried, lines: ids('cgt') },
      retirement: { contributions: contrib, limits: lim, deduction: r2(d11f), carriedForward: r2(contrib - d11f), lines: ids('s11f') },
      donations: { donated: don, limit: lim18a, deduction: r2(d18a), carriedForward: r2(don - d18a), lines: ids('s18a') },
      medical: { months, periods: periods.map((p) => ({ months: p.months, dependants: p.dependants })), share, disability: !!med.disability, senior: seniorMed,
        fees, s6a, expenses: exp, s6b, s6aUsed: r2(s6aUsed), s6bUsed: r2(s6bUsed), lines: ids('fees', 'expenses') },
      assessedLoss: tiRaw < 0 ? r2(-tiRaw) : 0,
      judgement: used.filter((l) => FIELDS[l.field].judgement).map((l) => ({ line: l.id, field: l.field, amount: r2(l.amount), decided: l.decided }))
        .concat(pending.filter((p) => p.field).map((p) => ({ line: p.line, field: p.field, amount: p.amount, decided: null }))),
    };
    return { ruleset: rs.version, year: rs.year, summary, lines, pending, errors, wrongYear, profile: prof, schedules, used };
  }

  // The ITR12 draft: what the firm declares (SARS assesses the tax). One entry per calculator field with its source lines.
  function itr12Of(c, cl, r, inputs) {
    const decl = Object.create(null); const raw = Object.create(null);
    r.used.forEach((l) => {
      const f = FIELDS[l.field];
      const e = decl[l.field] || (decl[l.field] = { label: f.label, category: f.cat, amount: 0, lines: [] });
      raw[l.field] = (raw[l.field] || 0) + l.amount; e.amount = r2(raw[l.field]); e.lines.push(l.id);
    });
    const med = (inputs && inputs.medical) || {};
    const periods = Array.isArray(med.periods) && med.periods.length ? med.periods : [{ months: med.months || 0, dependants: med.dependants || 0 }];
    return { taxRef: cl ? cl.taxRef : null, year: c.year, declared: Object.assign({}, decl),
      medical: { months: periods.reduce((a, p) => a + (p.months || 0), 0), periods: periods.map((p) => ({ months: p.months || 0, dependants: p.dependants || 0 })),
        share: med.share == null ? 1 : med.share, disability: !!med.disability } };
  }

  // Documents ↔ extracted values ↔ calculation ↔ ITR12. Issues fail the reconciliation (PRE-01 at G08).
  function reconcile(c, r, itr12) {
    const issues = [];
    const lines = (c.inputs && Array.isArray(c.inputs.lines)) ? c.inputs.lines : [];
    lines.forEach((l) => {
      if (!l || typeof l !== 'object') return;
      const f = fieldOf(l.field); if (!f) return;
      if (l.docId) {
        const d = (c.docs || []).find((x) => x.id === l.docId);
        if (!d) issues.push(l.id + ' (' + f.label + ') cites document ' + l.docId + ', which is not on the case');
        else if (d.status !== 'validated') issues.push(l.id + ' (' + f.label + ') comes from ' + d.name + ', which is ' + d.status);
        else if (!d.kind) issues.push(l.id + ' (' + f.label + ') comes from ' + d.name + ', which could not be classified');
        else if (f.kinds && !f.kinds.includes(d.kind)) issues.push(l.id + ': ' + f.label + ' cannot come from ' + d.name);

  /* ===================== Platform and simulation controls ===================== */

  /* ===================== Exports ===================== */
  function auditCsv() {
    const cell = (v) => {

      if (/^[=+\-@\t\r]/.test(s)) s = '\'' + s;  // spreadsheet formula injection guard
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;

  }
  const auditJson = () => JSON.stringify(S.audit, null, 2);

  function verifyChain() {
    for (let i = 0; i < S.audit.length; i++) {
      const a = S.audit[i];

      if (a.hash !== auditHash(a)) return { ok: false, n: S.audit.length, badAt: i, why: 'hash mismatch' };

    if (seal.n !== S.audit.length || (S.audit.length && seal.hash !== S.audit[S.audit.length - 1].hash)) return { ok: false, n: S.audit.length, badAt: Math.min(seal.n, S.audit.length), why: 'the trail was truncated or replaced' };
    return { ok: true, n: S.audit.length, badAt: -1 };

  /* ===================== The calculation (calc.js) ===================== */
  // Runs the calculator on the case's extracted values, records the result as a new version, then raises what it found:
  // TAX-01 validation errors, TAX-06 a ruleset for another year, TAX-02/AI-05 undecided judgement items, TAX-05 a material
  // unexplained year-on-year change (once per figure).
  function calculate(c, a, o) {
    o = o || {};
    if (typeof CALC === 'undefined') return fail('The calculator is not loaded');
    if (!c.inputs) return fail('No extracted values on ' + c.id);
    const data = CALC.forCase(c); const k = data.calc;
    k.inputs = digest(c.inputs);  // the extracted values this calculation used (calcStale compares it)
    const r = change(c, a, data, { reason: o.reason || 'Calculation on ruleset ' + k.ruleset, material: o.material });
    if (!r.ok) return r;
    const ai = ACTOR.ai(); const sys = ACTOR.system();

    if (k.wrongYear) raise(c, 'TAX-06', { by: sys, note: 'Ruleset ' + k.ruleset + ' is for the ' + k.year + ' year of assessment, not ' + c.year, noSettle: true });

    const fl = itr12InFlight(c); if (fl) return refuse(a, c, 'Extracted values refused', 'The ITR12 ' + fl.id + ' may already be with SARS (' + fl.status + '); establish its status first', { sarsTx: fl.id });

    log(a, (o.note || 'Recorded the extracted values') + ': ' + c.inputs.lines.length + ' value' + (c.inputs.lines.length === 1 ? '' : 's') + ' from ' + docs.size + ' document' + (docs.size === 1 ? '' : 's'),

  // Drafted answers to a Declaration Questionnaire ('da') or a verification request ('vrf'), each tied to its evidence.
  function draftResponse(c, a, kind, drafts) {
    const w = a.type === 'ai' ? aiWhy(a) : staffWhy(a, 'Tax Consultant'); if (w) return refuse(a, c, 'Draft refused', w);

  // The Tax Consultant's decision on a judgement item: the amount and the treatment, authority or rationale. calculate() then uses it.
  function decideItem(c, lineId, a, o) {
    o = o || {};
    const w = staffWhy(a, 'Tax Consultant'); if (w) return refuse(a, c, 'Decision refused', w);
    if (c.submission && c.submission.ok) return refuse(a, c, 'Decision refused', 'The return is submitted; a correction goes through G15 (Request for Correction)');
    const fl = itr12InFlight(c); if (fl) return refuse(a, c, 'Decision refused', 'The ITR12 ' + fl.id + ' may already be with SARS (' + fl.status + '); establish its status first', { sarsTx: fl.id });

  /* ===================== drive(): the happy path, used by the tests and the seed ===================== */

        case 'G03':
          c.questionnaire.required.concat(c.priorYear).forEach((k) => { if (!(k in c.questionnaire.answers)) portal(c, 'answer', { key: k, value: (o.answers && k in o.answers) ? o.answers[k] : (c.priorYear.includes(k) || ['employment', 'medical'].includes(k)) }); });
          r = portal(c, 'submitQuestionnaire'); break;
        case 'G04':

        case 'G12':

    approvalProblem, criteria, actorCheck, canRelease, release, reopenFrom, gateState, settle, gatesDone, preBlockers,

    setOverridable, recordFallback, reconcileFallback,

/* The demo firm's synthetic cases: one or two per workflow stage, each showing the exception codes the plan names.
   Every person is made up: the names, the tax references, and the ID numbers (built from the date of birth with a check digit
   that deliberately fails the SA ID checksum). Every figure comes from CALC through ENGINE.calculate(), so the seeded numbers
   always reproduce through calc.js; SARS's ITA34 figures are calc.js run on the inputs SARS used.
   The history is replayed in date order across all cases with the demo clock moved back to each step's date, so the audit
   trail reads chronologically. Everything goes through ENGINE; anything ENGINE refuses is collected in DEMO.problems (the

const DEMO = { cases: true, problems: [], keys: {} };

const DEMO_SEED = (() => {

    for (let i = 0; i < body.length; i++) { let d = +body[body.length - 1 - i]; if (i % 2 === 0) { d *= 2; if (d > 9) d -= 9; } sum += d; }
