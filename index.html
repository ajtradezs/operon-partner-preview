      const nx = r && r.exception;
      return finish(r, 'Raised ' + code + (nx ? ' as ' + nx.id : '') + ' on ' + c.id + '.', () => { if (nx && VK.safeId(nx.id)) location.hash = '#exception-' + nx.id; });
    }, { onOpen: (f) => {
      const upd = () => {
        const c = ENGINE.caseById(f.elements.case.value);
        $('#ops-raise-stage').textContent = phaseText(c);
        f.elements.code.innerHTML = codeOptions(c, f.elements.scope.value);
      };
      f.elements.case.addEventListener('change', upd); f.elements.scope.addEventListener('change', upd);
    } });
  }

  Object.assign(ACT, {
    'ops.sev': actSev, 'ops.sevOk': actSevOk, 'ops.ovReq': actOvReq, 'ops.ovOk': actOvOk, 'ops.fbRec': actFbRec, 'ops.fbRecon': actFbRecon, 'ops.raise': actRaise,
    'ops.exClear': () => { Object.assign(F, F0); render(); },
    'ops.exMine': () => { Object.assign(F, F0, { owner: S.role, status: 'live' }); render(); },
  });

  // Header count: what waits for the signed-in role (open ones it owns, resolved ones it closes as secondary reviewer).
  NAV_COUNT.exceptions = () => VK.myExceptions(S.role).length;
})();

/* ===================== itr12/views-sars.js ===================== */
/* SARS link (simulated): the link's status, the transaction log (S.txs) with each open transaction's eight G18 checks and blockers,
   the two-person sign-off, sending with a chosen simulated outcome, the no-blind-retry rule (check the status before any retry,
   INT-04), the manual fallback (INT-13) and its independent reconciliation, and the inbound items (S.inbound) with routing and
   date confirmation, and "Simulate SARS sending an ITA34" for a submitted return (ENGINE.receive: SARS acts, not the signed-in
   person). Nothing here connects to SARS. Every other button calls ENGINE with ACTOR.me(); a refusal shows ENGINE's reason.
   Locked buttons say which role acts; ENGINE checks the role again whatever the screen shows. */
(() => {
  const finish = (r, msg) => (r && r.ok ? () => VK.done(r, msg) : 'Not done: ' + ((r && r.why) || 'Operon refused this.'));
  const IA = 'Integration Administrator'; const TC = 'Tax Consultant';
  const OPEN_TX = ['awaiting G18', 'ready', 'unknown', 'no-response', 'manual', 'blocked', 'not processed'];
  const TX_STATUS = {
    'awaiting G18': ['Awaiting G18', 'warn'], ready: ['Signed, ready to send', 'info'], success: ['Accepted by SARS', 'ok'], rejected: ['Rejected by SARS', 'bad'],
    unknown: ['Status unknown', 'bad'], 'no-response': ['No reference back', 'bad'], manual: ['Filed manually, to reconcile', 'warn'], 'not processed': ['Not processed', 'warn'],
    superseded: ['Superseded by a retry', ''], blocked: ['Blocked: unsupported', 'bad'], cancelled: ['Cancelled', ''],
  };
  const txPill = (t) => { const s = TX_STATUS[t.status] || [t.status, '']; return VK.pill(s[0], s[1]); };
  const txNow = (t) => { const x = ENGINE.txById(t.dataset.tx); if (!x) { toast('That SARS transaction is no longer here.'); render(); } return x; };
  // A button for one role only: other roles see it locked, with who acts. ENGINE enforces the role again.
  const roleBtn = (roles, label, act, o) => btn(label, act, Object.assign({}, o, { lock: [].concat(roles).includes(S.role) ? null : [].concat(roles).join(' or ') + ' only' }));
  const openEx = (t, code) => S.exceptions.find((x) => x.txId === t.id && x.code === code && ENGINE.isOpen(x)) || null;
  const openInt15 = (it) => S.exceptions.find((x) => x.code === 'INT-15' && x.inboundId === it.id && ENGINE.isOpen(x)) || null;

  /* ---------- link status ---------- */
  function linkBlock() {
    const L = S.link;
    const rows = [
      ['up', 'SARS interface', L.up ? ['Up', 'ok'] : ['Down', 'bad'], L.up ? 'Take it down' : 'Bring it back', 'A send while it is down raises INT-03; the Tax Consultant may then file manually (INT-13).'],
      ['auth', 'Authentication', L.auth ? ['Working', 'ok'] : ['Failing', 'bad'], L.auth ? 'Make it fail' : 'Restore it', 'A G18 sign-off while it fails raises INT-01; check 3 fails.'],
      ['rights', 'eFiling rights', L.rights ? ['In place', 'ok'] : ['Missing', 'bad'], L.rights ? 'Remove them' : 'Restore them', 'A G18 sign-off while they are missing raises INT-02; check 3 fails.'],
    ];
    const table = VK.table([{ label: 'Part' }, { label: 'Status' }, { label: 'What it affects' }, { label: '', cls: 'vk-act' }],
      rows.map(([k, label, st, act, note]) => [esc(label), VK.pill(st[0], st[1]), `<span class="small">${esc(note)}</span>`, roleBtn(IA, act, 'ops.link', { cls: 'sm', data: { k, v: L[k] ? '0' : '1' } })]),
      { caption: 'Simulated SARS link status' });
    return VK.section('ops-sars-link', 'Link status (simulated)', table, {
      intro: esc('In real life SARS and the platform team decide these. In the preview the Integration Administrator can switch them to try the failure paths. Each change is audited.'),
    });
  }

  /* ---------- transaction log ---------- */
  function txActions(t) {
    const out = [];
    switch (t.status) {
      case 'awaiting G18': {
        const signedMine = t.signoffs.some((s) => s.role === S.role);
        if (signedMine) out.push(`<span class="lock">${I.hourglass}${esc('You signed. The ' + (S.role === IA ? TC : IA) + ' signs next.')}</span>`);
        else out.push(roleBtn([IA, TC], 'Sign G18', 'vk.release', { cls: 'sm', data: { case: t.caseId, gate: 'G18', tx: t.id } }));
        break;
      }
      case 'ready':
        out.push(roleBtn(IA, 'Send to SARS', 'ops.tx.send', { cls: 'sm primary', data: { tx: t.id } }));
        if (!S.link.up || openEx(t, 'INT-03')) out.push(roleBtn(TC, 'Record manual filing', 'ops.tx.manual', { cls: 'sm', data: { tx: t.id } }));
        break;
      case 'unknown': case 'no-response':
        out.push(roleBtn(IA, 'Check SARS status', 'ops.tx.check', { cls: 'sm primary', data: { tx: t.id } }));
        out.push(roleBtn(IA, 'Retry', 'ops.tx.retry', { cls: 'sm', data: { tx: t.id }, title: 'Refused until the status is checked: unknown calls are never retried blindly' }));
        break;
      case 'not processed':
        out.push(roleBtn(IA, 'Retry under a fresh G18', 'ops.tx.retry', { cls: 'sm', data: { tx: t.id } }));
        break;
      case 'manual': {
        const x = openEx(t, 'INT-13');
        if (x) out.push(btn('Reconcile independently', 'ops.fbRecon', { cls: 'sm primary', data: { ex: x.id } }));
        break;
      }
      case 'blocked':
        out.push(roleBtn(TC, 'Record manual filing', 'ops.tx.manual', { cls: 'sm', data: { tx: t.id } }));
        break;
      default: break;
    }
    return out.length ? `<span class="ops-btns">${out.join('')}</span>` : '';
  }
  function logBlock() {
    const txs = S.txs.slice().reverse();
    const codes = (t) => { const xs = S.exceptions.filter((x) => x.txId === t.id); return xs.length ? `<div class="vk-codes">${xs.map((x) => VK.codeChip(x.code, x) + (ENGINE.isOpen(x) ? '' : '<span class="small muted">done</span>')).join(' ')}</div>` : ''; };
    const signed = (t) => (t.signoffs.length ? t.signoffs.map((s) => `<div class="small">${esc(VK.who(s.id))} <span class="muted">(${esc(s.role)})</span></div>`).join('') : '<span class="small muted">Nobody yet</span>');
    const result = (t) => {
      const parts = [];
      if (t.ref) parts.push(`<div class="small">Reference <span class="mono">${esc(t.ref)}</span></div>`);
      if (t.manual) parts.push(`<div class="small">Manual reference <span class="mono">${esc(VK.scrub(t.manual.ref))}</span> · ${esc(VK.who(t.manual.by))}</div>`);
      if (t.attempts.length) parts.push(`<div class="small muted">${esc(plural(t.attempts.length, 'send'))}, last ${VK.when(t.attempts[t.attempts.length - 1].at)}</div>`);
      if (t.parentTx) parts.push(`<div class="small muted">Retry of ${esc(t.parentTx)}</div>`);
      return parts.join('');
    };
    const table = VK.table([{ label: 'Transaction' }, { label: 'Case' }, { label: 'Status' }, { label: 'G18 sign-off' }, { label: 'Result' }, { label: '', cls: 'vk-act' }],
      txs.map((t) => ({ cls: OPEN_TX.includes(t.status) ? 'ops-live' : '', cells: [
        `<span class="mono">${esc(t.id)}</span> ${esc(t.label)}<div class="small muted">${esc(t.gate)} · version ${esc(t.version)} · queued ${VK.when(t.created)}</div>`,
        VK.caseWho(t.caseId), txPill(t) + codes(t), signed(t), result(t), txActions(t)] })),
      { caption: 'SARS transaction log (simulated)', empty: 'No SARS transactions yet.' });
    return VK.section('ops-sars-txs', 'Transaction log', table, {
      count: txs.filter((t) => OPEN_TX.includes(t.status)).length,
      intro: esc('Every outbound call, newest first. The Integration Administrator sends; the outcome is chosen by you, because the SARS side is simulated.'),
    });
  }

  /* ---------- the eight G18 checks for each open transaction ---------- */
  function checksBlock() {
    const txs = S.txs.filter((t) => OPEN_TX.includes(t.status)).reverse();
    const card = (t) => {
      const ck = ENGINE.g18Checks(t); const gb = ENGINE.g18Blockers(t); const bad = ck.filter((k) => !k.ok).length;
      return `<div class="ops-tx"><div class="row"><span class="mono">${esc(t.id)}</span><strong>${esc(t.label)}</strong>${txPill(t)}</div>
        <div class="vk-meta">${VK.caseWho(t.caseId)}<span>${esc(bad ? bad + ' of 8 checks fail' : 'All 8 checks pass')}</span></div>
        <ol class="vk-checks">${ck.map((k) => `<li class="${k.ok ? 'ok' : 'bad'}">${k.ok ? I.check : I.alert}<span>${esc(k.n + '. ' + k.label)}${k.ok ? '' : `<br><span class="err">${esc(VK.scrub(k.why))}</span>`}</span></li>`).join('')}</ol>
        ${gb.length ? `<p class="err small">Also blocked by ${esc(gb.map(VK.scrub).join(', '))}</p>` : ''}</div>`;
    };
    return VK.section('ops-sars-checks', 'G18 checks on open transactions', txs.length ? `<div class="ops-txgrid">${txs.map(card).join('')}</div>` : VK.empty('No open transactions.'), {
      count: txs.length,
      intro: esc('The eight checks from the master workflow document (step 17), worked out now by the gate engine. Both people must sign while all eight pass, and they are checked again before anything is sent.'),
    });
  }

  /* ---------- inbound ---------- */
  function inboundBlock() {
    const items = S.inbound.slice().reverse();
    const iacts = (it) => {
      const out = [];
      if (it.status === 'unrouted') out.push(roleBtn(IA, 'Route to a case', 'ops.in.route', { cls: 'sm primary', data: { in: it.id } }));
      // INT-15: one person confirms the dates from the notice, then a different person reconciles them. Nothing once it is done.
      const int15 = openInt15(it);
      if (int15 && !int15.fallback.recorded) out.push(roleBtn([IA, TC], 'Confirm dates', 'ops.in.date', { cls: 'sm', data: { in: it.id } }));
      else if (int15 && !int15.fallback.reconciled) out.push(btn('Reconcile dates', 'ops.fbRecon', { cls: 'sm', data: { ex: int15.id }, title: 'A different person from the one who confirmed them' }));
      return out.length ? `<span class="ops-btns">${out.join('')}</span>` : '';
    };
    const who = (it) => { const cl = S.clients.find((x) => x.taxRef === it.taxRef); return `${VK.taxRefHtml(it.taxRef)}${cl ? `<div class="small">${VK.clientLink(cl)}</div>` : '<div class="small muted">No client with this tax reference</div>'}<div class="small muted">Tax year ${esc(it.year || '—')}</div>`; };
    const where = (it) => {
      const xs = S.exceptions.filter((x) => x.inboundId === it.id);
      const chips = xs.length ? `<div class="vk-codes">${xs.map((x) => VK.codeChip(x.code, x)).join(' ')}</div>` : '';
      return (it.caseId ? `${VK.pill('Routed', 'ok')} ${VK.caseWho(it.caseId)}` : VK.pill(it.status === 'unrouted' ? 'Not matched to a case' : it.status, 'bad')) + chips;
    };
    const dates = (it) => {
      const rawText = it.raw ? [it.raw.date ? 'date “' + it.raw.date + '”' : '', it.raw.due ? 'due “' + it.raw.due + '”' : ''].filter(Boolean).join(', ') : '';
      const x15 = openInt15(it);
      const raw = !it.raw ? '' : (x15 && !x15.fallback.recorded ? `<div class="small err">${esc('Unreadable on the notice: ' + rawText)}</div>`
        : `<div class="small muted">${esc('Received as ' + rawText + '; ' + (x15 ? 'confirmed from the notice, to reconcile' : 'confirmed from the notice'))}</div>`);
      return `<div class="small">Dated ${VK.date(it.date)}</div>${it.due ? `<div class="small">Due ${VK.date(it.due)}</div>` : ''}${raw}`;
    };
    const table = VK.table([{ label: 'Item' }, { label: 'Taxpayer' }, { label: 'Case' }, { label: 'Dates' }, { label: '', cls: 'vk-act' }],
      items.map((it) => [`${esc(it.label)} <span class="mono small">${esc(it.ref || it.id)}</span><div class="small muted">${esc(it.id)} · received ${VK.when(it.at)} · hash <span class="mono">${esc(String(it.hash || '').slice(0, 12))}…</span></div>`,
        who(it), where(it), dates(it), iacts(it)]),
      { caption: 'Inbound items from SARS (simulated)', empty: 'Nothing has arrived from SARS.' });
    const waiting = awaitingIta34();
    return VK.section('ops-sars-inbound', 'Inbound from SARS', table, {
      count: items.filter((it) => it.status === 'unrouted').length || null,
      intro: esc('Notices, assessments and requests, newest first. Each is hashed and matched to a case by tax reference and year; one that matches no case raises INT-14 and waits for the Integration Administrator. An unreadable date is never guessed (INT-15). '
        + (waiting.length ? plural(waiting.length, 'submitted return') + ' ' + (waiting.length === 1 ? 'waits' : 'wait') + ' for SARS’s assessment: “Simulate SARS sending an ITA34” plays SARS’s part.' : 'No submitted return is waiting for SARS’s assessment.')),
      actions: waiting.length ? btn('Simulate SARS sending an ITA34', 'ops.in.ita34', { cls: 'sm', id: 'ops-sim-ita34' }) : '',
    });
  }

  // Submitted returns with no assessment yet: the ones the simulated SARS can send an ITA34 for.
  const awaitingIta34 = () => S.cases.filter((c) => !c.archived && c.submission && c.submission.ok && !c.ita34 && !c.pendingIta34 && c.calc && c.calc.summary);

  /* ---------- the rules on this link ---------- */
  function rulesBlock() {
    const rule = (codes, text) => `<div class="vk-row"><span class="vk-codes">${codes.map((c) => VK.codeChip(c)).join(' ')}</span><div class="vk-row-b"><div class="vk-row-t">${esc(text)}</div></div></div>`;
    const items = [
      rule(['G18'], 'Two different people sign every outbound transaction: the Integration Administrator and the Tax Consultant, each only while all eight checks pass.'),
      rule(['INT-11'], 'A call made before its substantive gate (G09, G10, G11 or G15) has passed is blocked as a gate-bypass attempt (S1).'),
      rule(['INT-04', 'INT-05'], 'When the outcome is unknown there is no retry until “Check SARS status” has reconciled it, and a second filing of the same return is refused as a duplicate.'),
      rule(['INT-09', 'SUB-01'], 'A rejection re-opens the gate behind the transaction; the return is fixed and goes through G18 again.'),
      rule(['INT-10', 'SUB-03'], 'If SARS processes it but no reference comes back, the status is checked before anything else happens.'),
      rule(['INT-03', 'INT-13'], 'When the interface is down after G18, the Tax Consultant may file manually; a different person then reconciles that filing to the case.'),
      rule(['INT-14', 'INT-15'], 'An inbound item that matches no case, or carries an unreadable date, waits for a person to route it or confirm the date from the notice.'),
    ];
    return VK.section('ops-sars-rules', 'How the link is guarded', VK.list(items), { intro: esc('The rules the gate engine applies on this link, from Johan’s register.') });
  }

  VIEWS.sars = () => {
    const intro = esc('The SARS link is simulated: nothing here connects to SARS or eFiling. ' + S.role + ' · ' + me().name + '. The Integration Administrator runs the link; the Tax Consultant co-signs G18 and may file manually when the link is down.');
    return VK.page('SARS link', intro, linkBlock() + logBlock() + checksBlock() + inboundBlock() + rulesBlock(), { key: 'ops-sars' });
  };

  /* ---------- actions ---------- */
  function actLink(t) {
    const k = t.dataset.k; if (!['up', 'auth', 'rights'].includes(k)) return;
    const on = t.dataset.v === '1';
    VK.done(ENGINE.setLink({ [k]: on }, ACTOR.me()), 'SARS link (simulated): ' + ({ up: 'interface', auth: 'authentication', rights: 'eFiling rights' }[k]) + (on ? ' restored.' : ' switched off.'));
  }
  const OUTCOMES = [
    ['success', 'SARS accepts it', 'A SARS reference comes back.'],
    ['reject', 'SARS rejects it', 'Raises INT-09 and SUB-01 and re-opens the gate.'],
    ['unknown', 'Timeout: outcome unknown', 'Raises INT-04. No retry until the status is checked.'],
    ['no-response', 'Processed, but no reference back', 'Raises INT-10 and SUB-03.'],
  ];
  function actSend(t) {
    const tx = txNow(t); if (!tx) return;
    const ck = ENGINE.g18Checks(tx); const bad = ck.filter((k) => !k.ok);
    modal('Send ' + tx.id + ' to SARS (simulated)', `${VK.facts([['Transaction', esc(tx.id + ' · ' + tx.label + ' · version ' + tx.version)], ['Case', esc(tx.caseId + ' · ' + VK.clientName(tx.clientId))],
      ['G18', esc(tx.signoffs.map((s) => VK.who(s.id) + ' (' + s.role + ')').join(' and '))], ['Checks now', esc(bad.length ? bad.length + ' of 8 fail' : 'All 8 pass')]])}
      <fieldset class="ops-radios"><legend class="small muted">What the simulated SARS does</legend>
      ${OUTCOMES.map(([v, label, note], i) => `<label><input type="radio" name="outcome" value="${v}"${i === 0 ? ' checked' : ''}> <span><strong>${esc(label)}</strong><br><span class="small muted">${esc(note)}</span></span></label>`).join('')}</fieldset>
      <p class="hint">Operon re-checks the gates and the eight G18 checks before sending. Nothing leaves the browser.</p>`,
    'Send', (fd) => {
      const o = String(fd.outcome || 'success');
      return finish(ENGINE.transmit(tx, ACTOR.me(), o), 'Sent ' + tx.id + ': ' + (OUTCOMES.find((x) => x[0] === o) || [o, o])[1].toLowerCase() + ' (simulated).');
    });
  }
  function actCheck(t) {
    const tx = txNow(t); if (!tx) return;
    const codes = S.exceptions.filter((x) => x.txId === tx.id && ENGINE.isOpen(x) && ['INT-04', 'INT-10', 'SUB-03'].includes(x.code)).map((x) => x.code);
    const closes = codes.length ? ' and resolve ' + codes.join(' and ') : '';
    modal('Check the SARS status of ' + tx.id, `<p>${esc(tx.label + ' for ' + tx.caseId + ' is ' + (TX_STATUS[tx.status] || [tx.status])[0].toLowerCase() + '.')} ${esc('Operon never retries it blindly: first confirm what SARS has.')}</p>
      <fieldset class="ops-radios"><legend class="small muted">What SARS’s records show (simulated)</legend>
      <label><input type="radio" name="truth" value="processed" checked> <span><strong>Processed</strong><br><span class="small muted">${esc('The return is with SARS: record its reference' + closes + '.')}</span></span></label>
      <label><input type="radio" name="truth" value="not processed"> <span><strong>Not processed</strong><br><span class="small muted">${esc('SARS does not have it' + (codes.length ? ': Operon resolves ' + codes.join(' and ') + ', and' : ':') + ' a retry is allowed under a fresh G18.')}</span></span></label></fieldset>`,
    'Record status', (fd) => finish(ENGINE.checkStatus(tx, ACTOR.me(), fd.truth === 'not processed' ? 'not processed' : 'processed'), 'Checked the SARS status of ' + tx.id + '.'));
  }
  const actRetry = (t) => { const tx = txNow(t); if (!tx) return; const r = ENGINE.retry(tx, ACTOR.me()); VK.done(r, r.ok && r.tx ? 'Retry queued as ' + r.tx.id + '; it needs a fresh G18.' : ''); };
  function actManual(t) {
    const tx = txNow(t); if (!tx) return;
    modal('Record a manual filing for ' + tx.id, `<p>${esc('Use this only when the SARS interface is down after G18 (INT-03), or for a function outside the interface once the alternative channel is approved (INT-08). It raises INT-13; a different person then reconciles it.')}</p>
      <label class="f" for="ops-man-ref">Reference from the manual channel (required)<input id="ops-man-ref" name="ref" maxlength="80" autocomplete="off" placeholder="For example the eFiling case number"></label>
      <label class="f" for="ops-man-note">Note (optional)<input id="ops-man-note" name="note" maxlength="300" autocomplete="off"></label>`,
    'Record manual filing', (fd) => {
      const ref = String(fd.ref || '').trim(); if (!ref) return 'Give the reference from the manual channel.';
      return finish(ENGINE.manualFallback(tx, ACTOR.me(), { ref, note: String(fd.note || '').trim() }), 'Recorded the manual filing for ' + tx.id + ' (INT-13). Someone else reconciles it.');
    });
  }
  const inNow = (t) => { const it = S.inbound.find((x) => x.id === t.dataset.in); if (!it) { toast('That inbound item is no longer here.'); render(); } return it; };
  function actRoute(t) {
    const it = inNow(t); if (!it) return;
    const cases = S.cases.slice().sort((p, q) => p.id.localeCompare(q.id));
    modal('Route ' + it.id + ' to a case', `${VK.facts([['Item', esc(it.label + ' ' + (it.ref || ''))], ['Tax reference', VK.taxRefHtml(it.taxRef)], ['Tax year', esc(it.year || '—')]])}
      <label class="f" for="ops-route-case">Case<select id="ops-route-case" name="case">${cases.map((c) => `<option value="${esc(c.id)}">${esc(c.id + ' · ' + VK.clientName(c.clientId) + ' · ' + c.year)}</option>`).join('')}</select></label>
      <p class="hint">Operon checks that the tax reference and the year match the case before routing it.</p>`,
    'Route', (fd) => finish(ENGINE.routeInbound(it, String(fd.case || ''), ACTOR.me()), 'Routed ' + it.id + ' to ' + fd.case + '.'));
  }
  function actDate(t) {
    const it = inNow(t); if (!it) return;
    const raw = it.raw || {};
    modal('Confirm the dates on ' + it.id, `<p>${esc('Read the dates from the notice itself. A different person then reconciles them (INT-15) before any deadline runs.')}</p>
      ${raw.date || raw.due ? `<p class="note">${esc('As received: ' + [raw.date ? 'date “' + raw.date + '”' : '', raw.due ? 'due “' + raw.due + '”' : ''].filter(Boolean).join(', '))}</p>` : ''}
      <label class="f" for="ops-in-date">Date on the notice<input id="ops-in-date" name="date" type="date" value="${esc(it.date || '')}"></label>
      <label class="f" for="ops-in-due">Due date (if any)<input id="ops-in-due" name="due" type="date" value="${esc(it.due || '')}"></label>`,
    'Confirm dates', (fd) => finish(ENGINE.confirmInboundDate(it, ACTOR.me(), { date: String(fd.date || ''), due: String(fd.due || '') }), 'Confirmed the dates on ' + it.id + '.'));
  }
  // The simulated SARS issues the assessment (ITA34) for a submitted return: the firm's approved figures, or with one figure
  // changed to show a difference (ASM-02). ENGINE.receive records SARS as the actor and routes it to the case by tax reference and year.
  function actIta34(t) {
    const cases = awaitingIta34();
    if (!cases.length) { toast('No submitted return is waiting for an assessment.'); render(); return; }
    const pre = cases.find((c) => c.id === (t.dataset.case || '')) || cases[0];
    const today = ENGINE.isoDay(now());
    modal('Simulate SARS sending an ITA34', `<p class="note">${esc('This plays SARS’s part: nothing is received from SARS. Operon records it as SARS (simulated) and compares it figure by figure with the approved calculation (G12).')}</p>
      <label class="f" for="ops-ita-case">Submitted return<select id="ops-ita-case" name="case">${cases.map((c) => `<option value="${esc(c.id)}"${c === pre ? ' selected' : ''}>${esc(c.id + ' · ' + VK.clientName(c.clientId) + ' · ' + c.year + ' · reference ' + c.submission.ref)}</option>`).join('')}</select></label>
      <label class="f" for="ops-ita-date">Date of assessment<input id="ops-ita-date" name="date" type="date" value="${esc(today)}"></label>
      <fieldset class="ops-radios"><legend class="small muted">What SARS assesses (simulated)</legend>
        <label><input type="radio" name="how" value="same" checked> <span><strong>The firm’s approved figures</strong><br><span class="small muted">The assessment agrees with the approved calculation.</span></span></label>
        <label><input type="radio" name="how" value="diff"> <span><strong>One figure differs</strong><br><span class="small muted">${esc('SARS uses a different amount for the figure below; a difference over ' + CALC.rand(S.policy.materiality.amount) + ' raises ASM-02.')}</span></span></label></fieldset>
      <div class="ops-ita-diff"><label class="f" for="ops-ita-field">Figure that differs<select id="ops-ita-field" name="field">${ITA34_FIELDS.map((f) => `<option value="${esc(f.key)}">${esc(f.label)}</option>`).join('')}</select></label>
      <label class="f" for="ops-ita-amount">SARS’s amount (rand)<input id="ops-ita-amount" name="amount" inputmode="decimal" autocomplete="off"></label></div>`,
    'Send the ITA34 (simulated)', (fd) => {
      const c = cases.find((x) => x.id === String(fd.case || ''));
      if (!c || !awaitingIta34().includes(c)) return 'Pick a submitted return that has no assessment yet.';
      const date = String(fd.date || '');
      if (!DATES.dt(date)) return 'Give the date of assessment.';
      const data = Object.assign({}, c.calc.summary);
      if (fd.how === 'diff') {
        const key = String(fd.field || ''); const raw = String(fd.amount || '').replace(/[\sR,]/g, '');
        if (!ITA34_FIELDS.some((f) => f.key === key)) return 'Choose the figure that differs.';
        if (!/^-?\d+(\.\d{1,2})?$/.test(raw)) return 'Give SARS’s amount as a number, for example 498000.';
        data[key] = Number(raw);
      }
      const n = S.inbound.filter((it) => it.fn === 'ita34').length + 1;
      const it = ENGINE.receive({ fn: 'ita34', taxRef: ENGINE.clientOf(c).taxRef, year: c.year, ref: 'ITA34-SIM-' + c.id + '-' + n, date, data, submissionRef: c.submission.ref });
      const ok = !!(it && it.caseId === c.id && c.ita34 && c.ita34.ref === it.ref);
      return finish({ ok, why: ok ? '' : 'The simulated ITA34 did not reach ' + c.id }, 'SARS (simulated) sent ITA34 ' + it.ref + ' for ' + c.id + (ok && !c.ita34.recon.ok ? ': it differs from the approved calculation (ASM-02).' : ': it agrees with the approved calculation.'));
    });
  }
  Object.assign(ACT, { 'ops.in.ita34': actIta34, 'ops.link': actLink, 'ops.tx.send': actSend, 'ops.tx.check': actCheck, 'ops.tx.retry': actRetry, 'ops.tx.manual': actManual, 'ops.in.route': actRoute, 'ops.in.date': actDate });

  // Header count: transactions whose outcome is in doubt, and inbound items no case has claimed.
  NAV_COUNT.sars = () => S.txs.filter((t) => ['unknown', 'no-response', 'manual'].includes(t.status)).length + S.inbound.filter((it) => it.status === 'unrouted').length;
})();

/* ===================== itr12/views-deadlines.js ===================== */
/* Deadlines: everything the due-date engine drives (the 2026 filing season, Declaration Alert, verification and audit due dates,
   remedy deadlines, retention reviews and PaperSync reminders), each with its rule and source (PERIODS, FILING_2026), and a
   business-day calculator on DATES (the firm's SARS Business Day Calculator, ported line for line).
   Read-only: the calculator changes nothing in the firm's data. */
(() => {
  const DAY = DATES.DAY;
  const today = () => ENGINE.isoDay(now());
  const plusDays = (iso, n) => DATES.iso(DATES.add(DATES.dt(iso), n));
  const UI = {
    kind: 'all',
    count: { s: null, e: null, mode: 'es', ch9: false, res: null, err: '' },
    add: { s: null, n: 21, ch9: false, res: null, err: '' },
    v21: { s: null, method: 'after', res: null, err: '' },
  };
  const ensure = () => {
    if (!UI.count.s) { UI.count.s = today(); UI.count.e = plusDays(today(), 30); }
    if (!UI.add.s) UI.add.s = today();
    if (!UI.v21.s) UI.v21.s = today();
  };
  const src = (p) => (p && p.src ? ADM.extLink(p.src, 'Source') : '');
  const KINDS = [['all', 'All'], ['filing', 'Filing season'], ['sars', 'SARS requests'], ['remedy', 'Remedies'], ['reminder', 'Reminders'], ['exception', 'Exceptions']];
  const kindOf = (d) => (d.kind === 'client' ? 'exception' : d.kind);
  function ruleOf(d) {
    if (d.kind === 'filing') return `SARS filing season 2026 · ${ADM.extLink(FILING_2026.src, 'Source')}`;
    if (d.kind === 'sars') return `Due date on the SARS notice${d.what.startsWith('Verification') ? ' · ' + src(PERIODS.verification) : ''}`;
    if (d.kind === 'remedy') { const p = d.c && d.c.remedy ? PERIODS[d.c.remedy.route] : null; return `${esc(d.source)}${p ? ' · ' + esc(p.days + ' business days from ' + p.from) + ' · ' + src(p) : ''}`; }
    if (d.kind === 'reminder') return esc('Firm policy: reminder lapses after ' + S.policy.reminderDays.approval + ' days (approval) or ' + S.policy.reminderDays.onboarding + ' days (onboarding). Pending Johan.');
    return esc(d.source || '');
  }

  function allBlock() {
    // The filing-season close is one date for many cases: one row per date, listing the cases.
    const rows = []; const filing = {};
    VK.deadlines({ days: 100000 }).filter((d) => UI.kind === 'all' || kindOf(d) === UI.kind).forEach((d) => {
      if (d.kind !== 'filing') { rows.push(Object.assign({ cases: d.c ? [d.c] : [] }, d)); return; }
      const k = d.date + '|' + d.what;
      if (filing[k]) { filing[k].cases.push(d.c); return; }
      filing[k] = Object.assign({ cases: [d.c] }, d); rows.push(filing[k]);
    });
    const items = rows.map((d) => [
      `<div class="adm-dl-date">${VK.datebox(d.date)}<span>${VK.date(d.date)}</span></div>`,
      `<div>${esc(d.what)}</div>${d.codes.length ? `<div class="vk-codes">${d.codes.map((x) => VK.codeChip(x.code, x) + VK.sevChip(x.sev, { short: true })).join(' ')}</div>` : ''}`,
      d.cases.length > 1 ? `<span class="small">${esc(plural(d.cases.length, 'case') + ' not yet submitted:')}</span> ${d.cases.map((c) => VK.caseLink(c)).join(', ')}` : (d.c ? VK.caseWho(d.c) : '<span class="muted">No case</span>'),
      `${VK.leftPill(d.left)}${d.ch9 ? '<div class="small muted">16 Dec to 15 Jan not counted</div>' : ''}`,
      `<span class="small">${ruleOf(d)}</span>`,
    ]);
    const filters = `<div class="filters adm-filters">${ADM.seg('adm.dlk', UI.kind, KINDS, 'Show deadlines of type')}</div>`;
    return VK.section('adm-deadlines-all', 'Everything due', filters + VK.table([{ label: 'Due' }, { label: 'What' }, { label: 'Case' }, { label: 'Time left' }, { label: 'Rule and source' }], items,
      { caption: 'Every open deadline, soonest first', empty: 'Nothing of this type is due.' }), {
      count: rows.length,
      intro: esc('Soonest first, overdue included. Time left is in business days from the demo clock (' + fShort(now()) + '): weekends and South African public holidays are skipped. Operon raises PRE-04, DA-05, VRF-03 or REM-09 ' + S.policy.warnDays + ' business days before a deadline (warning window pending Johan).'),
    });
  }

  function filingBlock() {
    const F = FILING_2026; const open = S.cases.filter((c) => !c.archived && c.year === F.year && !(c.submission && c.submission.ok));
    const n = (k) => open.filter((c) => c.filing === k).length;
    const closes = (iso) => { const left = VK.bizLeft(iso); return left < 0 ? VK.pill('Closed ' + VK.toDay(iso).getDate() + ' ' + MON[VK.toDay(iso).getMonth()], '') : VK.leftPill(left); };
    const rows = [
      [esc(F.autoAssessment.label), `${VK.date(F.autoAssessment.from)} to ${VK.date(F.autoAssessment.to)}`, '<span class="muted">—</span>', '<span class="muted">—</span>'],
      [esc(F.nonProvisional.label), `${VK.date(F.nonProvisional.opens)} to ${VK.date(F.nonProvisional.closes)}`, closes(F.nonProvisional.closes), esc(plural(n('nonProvisional'), 'case'))],
      [esc(F.provisional.label), `${VK.date(F.provisional.opens)} to ${VK.date(F.provisional.closes)}`, closes(F.provisional.closes), esc(plural(n('provisional'), 'case'))],
    ];
    return VK.section('adm-deadlines-filing', 'Filing season 2026', VK.table([{ label: 'Who' }, { label: 'Dates' }, { label: 'Closes' }, { label: 'Not yet submitted' }], rows, { caption: 'ITR12 filing season 2026' }), {
      intro: `${esc('Year of assessment ' + F.period + '. A case that is not submitted counts against its group’s closing date.')} ${ADM.extLink(F.src, 'SARS: changes for filing season 2026')}`,
    });
  }

  function sarsBlock() {
    const rows = [];
    S.cases.forEach((c) => {
      [['da', 'Declaration Alert', PERIODS.daWindow], ['vrf', 'Verification', PERIODS.verification], ['aud', 'Audit', PERIODS.audit]].forEach(([k, label, p]) => {
        const r = c[k]; if (!r) return;
        const done = k === 'da' ? r.submitted || r.moved : r.uploaded;
        const status = done ? VK.pill(k === 'da' ? 'Answered' : 'Documents uploaded', 'ok') : VK.leftPill(VK.bizLeft(r.due));
        const target = r.target ? `<div class="small">SARS target: ${VK.date(r.target)} (${esc(p.days + ' business days from upload')})</div>` : '';
        rows.push([`${esc(label)} <span class="mono small">${esc(r.ref)}</span>`, VK.caseWho(c), VK.date(r.received), `${VK.date(r.due)}${target}`, status,
          `<span class="small">${esc(p.label + ': ' + (p.text || (p.days + ' business days from ' + p.from)))} ${src(p)}</span>`]);
      });
    });
    return VK.section('adm-deadlines-sars', 'SARS requests', VK.table([{ label: 'Request' }, { label: 'Case' }, { label: 'Received' }, { label: 'Due' }, { label: 'Status' }, { label: 'Rule' }], rows,
      { caption: 'Declaration Alerts, verifications and audits', empty: 'No open SARS requests.' }), {
      count: rows.length,
      intro: esc('Due dates come from the SARS notice. Notices arrive through the simulated SARS link; nothing here connects to SARS.'),
    });
  }

  function remedyBlock() {
    const rows = [];
    S.cases.filter((c) => c.ita34 && !c.archived).forEach((c) => {
      if (c.remedy) {
        const p = PERIODS[c.remedy.route];
        rows.push([VK.caseWho(c), `<strong>${esc(p ? p.label : c.remedy.route)}</strong> ${VK.pill('Chosen', 'info')}`, `${VK.date(c.remedy.from)}<div class="small muted">${esc(c.remedy.basis || '')}</div>`,
          c.remedy.deadline ? `${VK.date(c.remedy.deadline)}<div>${VK.leftPill(VK.bizLeft(c.remedy.deadline, true))}</div>` : '<span class="muted">Not set</span>',
          `<span class="small">${esc(c.remedy.rule || '')} ${src(p)}</span>`]);
        return;
      }
      if (c.decision && c.decision.choice === 'accept') return;
      ['reasons', 'objection'].forEach((route) => {
        const r = ENGINE.remedyDeadline(c, route); const p = PERIODS[route];
        rows.push([VK.caseWho(c), `${esc(p.label)} <span class="small muted">if the client disputes</span>`, `${VK.date(r.from)}<div class="small muted">${esc(r.basis || '')}</div>`,
          r.deadline ? `${VK.date(r.deadline)}<div>${VK.leftPill(VK.bizLeft(r.deadline, true))}</div>` : '<span class="muted">Not set</span>', `<span class="small">${esc(p.rule)} ${src(p)}</span>`]);
      });
    });
    return VK.section('adm-deadlines-remedies', 'Remedy deadlines (Chapter 9)', VK.table([{ label: 'Case' }, { label: 'Remedy' }, { label: 'Counted from' }, { label: 'Deadline' }, { label: 'Rule' }], rows,
      { caption: 'Statutory deadlines for requests for reasons, objections and appeals', empty: 'No assessment is open to a remedy.' }), {
      count: rows.length,
      intro: esc('Business days from the date the dispute rules name, skipping 16 December to 15 January (Chapter 9). The deadline is set when the remedy is chosen; the rows marked “if the client disputes” show what it would be today.'),
    });
  }

  function retentionBlock() {
    const cs = S.cases.filter((c) => c.retention.from);
    const rows = cs.map((c) => {
      const active = c.retention.holds.filter((h) => !h.released);
      return [VK.caseWho(c), VK.date(c.retention.from), VK.date(c.retention.until), VK.date(c.retention.review),
        active.length ? `${VK.pill(plural(active.length, 'active hold'), 'warn')}<div class="small">${esc(active.map((h) => h.label).join('; '))}</div>` : '<span class="muted">None</span>'];
    });
    const p = PERIODS.retention;
    return VK.section('adm-deadlines-retention', 'Retention reviews', VK.table([{ label: 'Case' }, { label: 'Runs from' }, { label: 'Keep until' }, { label: 'Review on' }, { label: 'Holds' }], rows,
      { caption: 'Retention periods and review dates', empty: 'No return has been submitted yet, so no retention period has started.' }), {
      count: rows.length,
      intro: `${esc(S.policy.retentionYears + ' years from ' + p.from + ' (' + p.rule + '). A longer firm period is pending Johan. Nothing is deleted automatically: the Records/Compliance Owner reviews it.')} ${src(p)} · <a href="#retention">Retention</a>`,
    });
  }

  function reminderBlock() {
    const rows = [];
    S.cases.forEach((c) => c.reminders.forEach((r) => rows.push([VK.caseWho(c), esc(r.kind === 'approval' ? 'Client approval (G06)' : 'Onboarding (G01)'), VK.when(r.sent), VK.when(r.expires),
      VK.pill({ sent: 'Waiting', answered: 'Answered', expired: 'Expired' }[r.status] || r.status, r.status === 'expired' ? 'bad' : (r.status === 'answered' ? 'ok' : 'warn'))])));
    return VK.section('adm-deadlines-reminders', 'PaperSync reminders', VK.table([{ label: 'Case' }, { label: 'Reminder' }, { label: 'Sent' }, { label: 'Lapses' }, { label: 'Status' }], rows,
      { caption: 'Reminders sent through the PaperSync portal', empty: 'No reminders have been sent.' }), {
      count: rows.length,
      intro: esc('A lapsed reminder raises CLT-05 (approval) or CLT-01 (onboarding). It never counts as approval. Lapse periods: ' + S.policy.reminderDays.approval + ' days for approval, ' + S.policy.reminderDays.onboarding + ' days for onboarding (pending Johan). The portal is simulated.'),
    });
  }

  function rulesBlock() {
    const rows = Object.keys(PERIODS).map((k) => {
      const p = PERIODS[k];
      const len = p.years ? plural(p.years, 'year') : (p.days ? p.days + ' business days' + (p.ch9 ? '; 16 Dec to 15 Jan not counted' : '') : '');
      return [`<strong>${esc(p.label)}</strong>${p.info ? ' <span class="small muted">(shown for reference)</span>' : ''}`, len ? esc(len) : '<span class="muted">—</span>',
        esc(p.from || ''), `<span class="small">${esc(p.rule || '')}${p.text ? '<br>' + esc(p.text) : ''}${p.note ? '<br>' + esc(p.note) : ''}</span>`, src(p)];
    });
    return VK.section('adm-deadlines-rules', 'The rules behind the dates', VK.table([{ label: 'Period' }, { label: 'Length' }, { label: 'Counted from' }, { label: 'Rule' }, { label: 'Source' }], rows,
      { caption: 'Statutory and service periods with their sources' }), { intro: esc('Each period with its legal or SARS source, checked on 9 Nov 2026.') });
  }

  /* ---------- Business-day calculator ---------- */
  function calcBlock() {
    ensure();
    const C = UI.count; const A = UI.add; const V = UI.v21;
    const ch9Box = (id, on) => `<label class="adm-check" for="${id}"><input type="checkbox" id="${id}" name="ch9"${on ? ' checked' : ''}> Chapter 9 period (skip 16 Dec to 15 Jan)</label>`;
    const modes = [['es', 'Exclude the start, include the end'], ['both', 'Include both dates'], ['neither', 'Exclude both dates'], ['ee', 'Include the start, exclude the end']];
    let countRes = '';
    if (C.err) countRes = `<p class="err">${esc(C.err)}</p>`;
    else if (C.res) {
      const ex = C.res.rows.filter((r) => !r.business);
      countRes = `<div class="adm-result" role="status"><p class="adm-big">${esc(plural(C.res.business, 'business day'))}</p><p class="small muted">${esc(plural(C.res.total, 'calendar day') + ' counted, ' + C.res.excluded + ' excluded.')}</p>
        ${ex.length ? `<details><summary>Excluded days (${ex.length})</summary><ul class="adm-days">${ex.slice(0, 120).map((r) => `<li><span class="mono">${VK.date(r.date)}</span> ${esc(r.reason)}</li>`).join('')}</ul>${ex.length > 120 ? '<p class="small muted">First 120 shown.</p>' : ''}</details>` : ''}</div>`;
    }
    let addRes = '';
    if (A.err) addRes = `<p class="err">${esc(A.err)}</p>`;
    else if (A.res) addRes = `<div class="adm-result" role="status"><p class="adm-big">${VK.date(A.res)}</p><p class="small muted">${esc(plural(A.n, 'business day') + ' after ' + A.s + ' (the start date is Day 0)' + (A.ch9 ? ', skipping 16 Dec to 15 Jan' : ''))}</p></div>`;
    let vRes = '';
    if (V.err) vRes = `<p class="err">${esc(V.err)}</p>`;
    else if (V.res) {
      const r = V.res;
      vRes = `<div class="adm-result" role="status"><p class="adm-big">${VK.date(DATES.iso(r.target))}</p>
        <p class="small muted">${esc('Day 1 is ' + DATES.iso(r.day1) + '. Follow up with SARS from ' + DATES.iso(r.follow) + ' if nothing has arrived.')}</p>
        <details><summary>All 21 business days</summary><ol class="adm-days">${r.rows.map(([n, d]) => `<li><span class="mono">Day ${esc(n)}</span> ${esc(DATES.iso(d))}</li>`).join('')}</ol></details></div>`;
    }
    const body = `<div class="adm-calc">
      <form data-form="adm.dlCount" class="adm-tool" novalidate><h3>Business days between two dates</h3>
        <div class="adm-two"><label class="f" for="adm-dc-s">Start<input id="adm-dc-s" name="s" type="date" value="${esc(C.s)}" required></label>
        <label class="f" for="adm-dc-e">End<input id="adm-dc-e" name="e" type="date" value="${esc(C.e)}" required></label></div>
        <label class="f" for="adm-dc-m">How to count the two dates<select id="adm-dc-m" name="mode">${modes.map(([v, t]) => `<option value="${v}"${C.mode === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
        ${ch9Box('adm-dc-c', C.ch9)}<div><button class="btn primary" type="submit">Count</button></div>${countRes}</form>
      <form data-form="adm.dlAdd" class="adm-tool" novalidate><h3>Add business days</h3>
        <div class="adm-two"><label class="f" for="adm-da-s">Start (Day 0)<input id="adm-da-s" name="s" type="date" value="${esc(A.s)}" required></label>
        <label class="f" for="adm-da-n">Business days<input id="adm-da-n" name="n" type="number" min="0" max="1000" step="1" value="${esc(A.n)}" required></label></div>
        ${ch9Box('adm-da-c', A.ch9)}<div><button class="btn primary" type="submit">Work out the date</button></div>${addRes}</form>
      <form data-form="adm.dlV21" class="adm-tool" novalidate><h3>21-business-day verification tracker</h3>
        <label class="f" for="adm-dv-s">Documents uploaded to SARS on<input id="adm-dv-s" name="s" type="date" value="${esc(V.s)}" required></label>
        <fieldset class="adm-radios"><legend class="small muted">Counting</legend>
          <label><input type="radio" name="method" value="after"${V.method === 'after' ? ' checked' : ''}> Upload date is Day 0 (recommended)</label>
          <label><input type="radio" name="method" value="include"${V.method === 'include' ? ' checked' : ''}> Upload date is Day 1 if it is a business day</label></fieldset>
        <div><button class="btn primary" type="submit">Track</button></div>${vRes}</form></div>`;
    return VK.section('adm-deadlines-calc', 'Business-day calculator', body, {
      intro: esc('The firm’s SARS Business Day Calculator (5 Oct 2026), rebuilt in Operon. A business day is not a Saturday, Sunday or public holiday (Tax Administration Act s1); a public holiday on a Sunday moves to the Monday. Tick Chapter 9 for objection, appeal and reasons periods.') + ' ' + src(PERIODS.businessDay),
    });
  }
  function holidaysBlock() {
    const y = now().getFullYear();
    const rows = [];
    [y, y + 1].forEach((yr) => {
      const m = new Map(DATES.holidays(yr));
      DATES.EXTRA.forEach((n, k) => { if (k.startsWith(yr + '-')) m.set(k, m.has(k) ? m.get(k) + '; ' + n : n); });
      [...m].sort((a, b) => (a[0] < b[0] ? -1 : 1)).forEach(([k, n]) => rows.push([`<span class="mono">${esc(k)}</span>`, esc(DOW[DATES.dt(k).getUTCDay()]), esc(n)]));
    });
    return VK.section('adm-deadlines-holidays', 'Public holidays the calculator skips', `<details class="adm-more"><summary>${esc(y + ' and ' + (y + 1) + ': ' + plural(rows.length, 'day'))}</summary>${VK.table([{ label: 'Date' }, { label: 'Day' }, { label: 'Holiday' }], rows, { caption: 'South African public holidays' })}</details>`, {
      intro: esc('Fixed holidays, Good Friday and Family Day from Easter, Sunday holidays observed on the Monday, and the 4 November 2026 local government elections (Proclamation 346 of 2026).'),
    });
  }

  VIEWS.deadlines = () => {
    const intro = esc('Every date the due-date engine tracks, with the rule and source behind it, and a business-day calculator. Dates come from the made-up cases; the SARS link and the PaperSync portal are simulated.');
    return VK.page('Deadlines', intro, allBlock() +
      `<div class="grid2 vk-grid" data-rv-key="adm-deadlines-columns">${filingBlock()}${reminderBlock()}</div>` +
      sarsBlock() + remedyBlock() + retentionBlock() + calcBlock() + holidaysBlock() + rulesBlock(), { key: 'adm-deadlines' });
  };

  /* ---------- Calculator forms ---------- */
  const dayOf = (v) => (DATES.dt(String(v || '')) ? String(v) : null);
  Object.assign(FORMS, {
    'adm.dlCount': (f) => {
      const C = UI.count; C.s = f.elements.s.value; C.e = f.elements.e.value; C.mode = ['es', 'both', 'neither', 'ee'].includes(f.elements.mode.value) ? f.elements.mode.value : 'es'; C.ch9 = f.elements.ch9.checked;
      C.res = null; C.err = '';
      const s = dayOf(C.s); const e = dayOf(C.e);
      if (!s || !e) C.err = 'Enter both dates.';
      else if (e < s) C.err = 'The end date is before the start date.';
      else if ((DATES.dt(e) - DATES.dt(s)) / DAY > 3660) C.err = 'Keep the range under ten years.';
      else C.res = DATES.countRange(DATES.dt(s), DATES.dt(e), C.mode, C.ch9);
      render();
    },
    'adm.dlAdd': (f) => {
      const A = UI.add; A.s = f.elements.s.value; A.n = f.elements.n.value; A.ch9 = f.elements.ch9.checked; A.res = null; A.err = '';
      const s = dayOf(A.s); const n = Number(A.n);
      if (!s) A.err = 'Enter a start date.';
      else if (!Number.isInteger(n) || n < 0 || n > 1000) A.err = 'Enter a whole number of business days from 0 to 1,000.';
      else { A.n = n; A.res = DATES.iso(DATES.addBusinessDays(DATES.dt(s), n, { ch9: A.ch9 })); }
      render();
    },
    'adm.dlV21': (f) => {
      const V = UI.v21; V.s = f.elements.s.value; V.method = f.elements.method.value === 'include' ? 'include' : 'after'; V.res = null; V.err = '';
      const s = dayOf(V.s);
      if (!s) V.err = 'Enter the upload date.'; else V.res = DATES.verification21(DATES.dt(s), V.method);
      render();
    },
  });
  ACT['adm.dlk'] = (t) => { UI.kind = KINDS.some(([k]) => k === t.dataset.v) ? t.dataset.v : 'all'; render(); };
})();

/* ===================== itr12/views-controls.js ===================== */
/* Controls: the gate register and its release rules, the severity and override rules, the policy values pending Johan (the

   segregation of duties, the role labels, the ruleset versions with every source, Johan's implementation checklist, a read-only

  /* ---------- Tiers ---------- */
  const tierOf = (g) => { const r = RELEASE[g] || {}; return r.by === 'system' ? 'auto' : (r.by === 'ai' ? 'hold' : 'held'); };
  function tiersBlock() {
    const gatesOf = (t) => GATE_IDS.filter((g) => tierOf(g) === t);
    const rows = [
      [tierBadge('auto'), esc('AI processing: reading documents, extracting values, the four-source checklist, drafting responses, routing exceptions. Operon itself freezes the approved version (G07).'), gatesOf('auto').map((g) => `<span class="vk-gate vk-g-idle"><b>${esc(g)}</b></span>`).join(' ')],
      [tierBadge('hold'), esc('The AI gates pass only when nothing blocks and the independent reviewer agrees; otherwise they wait for the Tax Consultant.'), gatesOf('hold').map((g) => `<span class="vk-gate vk-g-idle"><b>${esc(g)}</b></span>`).join(' ')],
      [tierBadge('held'), esc('Every other gate approval is a person (or the client in the PaperSync portal). G09 is never released by the system or the AI. G18 needs two different people.'), gatesOf('held').map((g) => `<span class="vk-gate vk-g-idle"><b>${esc(g)}</b></span>`).join(' ')],

        'Overriding an S1, or any code that would bypass missing taxpayer authority, a security control, SARS-interface authorisation or a statutory hold',
        'The AI lowering an S1 or S2 severity',
        'Staff dragging a case past a client gate (G03, G06, G14)',

      intro: esc('AI processing is Auto, gate approvals are Held for a person, and bypasses are Forbidden. The AI is simulated in the preview.'),
    });
  }

  /* ---------- Gate register ---------- */
  const releaseText = (g) => {
    const r = RELEASE[g] || {};
    if (r.by === 'role') return r.role;
    if (r.by === 'ai') return 'AI check, with the independent reviewer; ' + r.role + ' for exceptions';
    if (r.by === 'client') return 'The client, in the PaperSync portal';
    if (r.by === 'system') return 'Operon only';
    if (r.by === 'dual') return 'Two people: ' + r.roles.join(' and ');
    return '';
  };
  function gatesBlock() {
    const rows = GATE_IDS.map((g) => {
      const G = GATE[g];
      return [`<span class="vk-gate vk-g-idle"><b>${esc(g)}</b></span>`, `<strong>${esc(G.control)}</strong><div class="small muted">${esc(G.box ? 'Phase ' + G.box.phase + ': ' + G.box.phaseTitle : 'Runs alongside the case')}</div>`,
        esc(G.owner), `<span class="small">${esc(G.criterion)}</span>`, `${esc(releaseText(g))}<div>${tierBadge(tierOf(g))}</div>`, chips(G.codes || [])];

      intro: esc('Johan’s files leave these open, so the preview uses conservative defaults. Removing a code from the override list cancels the overrides already approved for it.'),
    });
  }

  /* ---------- Questions for Johan ---------- */
  function questionsBlock() {
    const items = PENDING_JOHAN.map((q, i) => `<div class="adm-q"><span class="adm-qn">${i + 1}</span><div class="vk-row-b"><div class="vk-row-t">${esc(q.topic)}</div><p class="small">${esc(q.text)}</p></div></div>`);

  /* ---------- Segregation of duties ---------- */
  const SOD_COLS = ['Tax Consultant', 'Administrator', 'Integration Administrator', 'Information Officer', 'Records/Compliance Owner', 'Client', 'AI or Operon'];

    rows.push([esc('Lowering S1 or S2')].concat(SOD_COLS.map((c) => cell(c === 'Records/Compliance Owner' ? 'Approves (not the requester)' : (c === 'AI or Operon' ? 'May raise, never lower' : '')))));

  /* ---------- Johan's implementation checklist ---------- */
  const WHERE = [
    ['Clients and Cases', '#clients', 'In the preview', 'The permanent client master and KYC repository (Clients) are kept apart from the annual ITR12 cases (Cases).'],

    ['Register viewer below', '#controls', 'In the preview', 'Generated read-only from the workbook, with its SHA-256 hash.'],
    ['Exceptions', '#exceptions', 'In the preview', 'Related and parent exceptions are linked, for example DOC-04 with SEC-01.'],
    ['People & roles; segregation of duties above', '#people', 'In the preview', 'Five firm roles; the engine refuses and records any action outside a role.'],
    ['Case page: versions', '#cases', 'In the preview', 'SHA-256 hashes for documents, calculation, schedules and the ITR12 on every version.'],

    if (UI.sheet === 'audit') return VK.table([{ label: 'Status' }, { label: 'Issue' }, { label: 'Treatment' }],
      REGISTER.audit.map((a) => [esc(a.status), esc(a.issue), esc(a.treatment)]), { caption: 'Code Audit sheet' });
    if (UI.sheet === 'instructions') return VK.table([{ label: 'Heading' }, { label: 'Text' }],
      REGISTER.instructions.map(([a, b]) => [a == null ? '' : `<strong>${esc(a)}</strong>`, esc(b == null ? '' : b)]), { caption: 'Instructions sheet' });
    const q = UI.q.trim().toLowerCase();
    const rows = REGISTER.codes.filter((c) => (UI.fam === 'all' || c.code.split('-')[0] === UI.fam) &&
      (!q || [c.code, c.title, c.trigger, c.resolution, c.owner, c.notes].some((v) => String(v || '').toLowerCase().includes(q))));
    const fams = FAMILY_ORDER.map((f) => { const c = REGISTER.codes.find((x) => x.code.startsWith(f + '-')); return [f, f + ' · ' + (c ? c.family : '')]; });
    const filters = `<div class="filters adm-filters"><label class="f" for="adm-reg-fam">Family<select id="adm-reg-fam" data-on="adm.regFam"><option value="all"${UI.fam === 'all' ? ' selected' : ''}>All families</option>${fams.map(([v, t]) => `<option value="${esc(v)}"${UI.fam === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <label class="f" for="adm-reg-q">Search<input id="adm-reg-q" class="search" type="search" data-on="adm.regQ" value="${esc(UI.q)}" placeholder="Code, words, owner" autocomplete="off"></label>
      <span class="small muted" role="status">${esc(plural(rows.length, 'code') + ' of ' + REGISTER.codes.length)}</span></div>`;
    return filters + VK.table([{ label: 'Code' }, { label: 'Title, trigger and resolution' }, { label: 'Stage and gates' }, { label: 'Severity' }, { label: 'Owner' }, { label: 'Notes' }],

        `${esc(c.stage)}<div class="small mono">${esc(c.gates)}</div>`, `${VK.sevChip(c.severity.slice(0, 2))}<div class="small">${esc(c.blocking === 'Yes' ? 'Blocking' : 'Blocking: ' + c.blocking)}</div>`,

      { caption: 'Exception Register sheet', empty: 'No code matches.' });

  function registerBlock() {
    const src = REGISTER.source; const doc = WORKFLOW.source;

    'adm.sheet': (t) => { UI.sheet = SHEETS.some(([k]) => k === t.dataset.v) ? t.dataset.v : 'codes'; render(); },
  });
  EXT_FIELD['adm.regFam'] = (el) => { UI.fam = el.value === 'all' || FAMILY_ORDER.includes(el.value) ? el.value : 'all'; };
  EXT_FIELD['adm.regQ'] = (el) => { UI.q = String(el.value || '').slice(0, 80); };
})();

/* ===================== itr12/views-records.js ===================== */
/* Records: Incidents (G17) and one incident, Retention (G16) and the Audit trail.
   Incident steps and closing go through ENGINE.incidentStep and ENGINE.closeIncident (the Information Officer); holds through
   ENGINE.legalHold and ENGINE.releaseHold (the Records/Compliance Owner). Anyone else is refused by ENGINE, which records the
   refusal; the screen shows the reason. The audit trail is read through ENGINE.verifyChain, ENGINE.auditCsv and ENGINE.auditJson. */
(() => {
  const STEPS = ENGINE.INCIDENT_STEPS;
  const stepsDone = (inc) => Object.keys(STEPS).filter((k) => inc.steps[k]).length;
  const incStatus = (inc) => (inc.status === 'open' ? VK.pill('Open', 'bad') : VK.pill('Closed', 'ok'));
  const exRow = (x) => `<div class="adm-exrow"><div class="vk-row-b"><div class="vk-row-t">${VK.codeChip(x.code, x)} ${VK.sevChip(x.sev, { short: true })} ${esc(x.title)}</div>
    <div class="vk-meta">${VK.exStatus(x)}${x.caseId ? VK.caseWho(x.caseId) : ''}<span>${esc(VK.scrub(x.note || ''))}</span></div></div>
    <div class="adm-exact">${x.status === 'closed' ? '' : VK.exceptionBtn({ x, need: ENGINE.isOpen(x) ? 'resolve' : 'close' })}</div></div>`;

  /* ===================== Incidents (G17) ===================== */
  VIEWS.incidents = () => {
    const rows = S.incidents.slice().reverse().map((inc) => [
      `<strong>${VK.link('incident', inc.id)}</strong>`,
      inc.caseId ? VK.caseWho(inc.caseId) : esc(VK.clientName(inc.clientId) || 'No case'),
      `<div class="vk-codes">${inc.codes.map((c, i) => VK.codeChip(c, inc.exceptionIds[i])).join(' ')}</div>`,
      VK.when(inc.opened),
      `${VK.pill(stepsDone(inc) + ' of ' + Object.keys(STEPS).length + ' steps', stepsDone(inc) === Object.keys(STEPS).length ? 'ok' : 'warn')}`,
      incStatus(inc),
      VK.safeId(inc.id) ? `<a class="btn sm" href="#incident-${inc.id}">Open</a>` : '',
    ]);
    const open = S.incidents.filter((i) => i.status === 'open').length;
    const table = VK.section('adm-incidents-list', 'Security and privacy incidents', VK.table([{ label: 'Incident' }, { label: 'Case' }, { label: 'Codes' }, { label: 'Opened' }, { label: 'Steps' }, { label: 'Status' }, { label: '', cls: 'vk-act' }], rows,
      { caption: 'Incidents', empty: 'No incidents have been opened.' }), {
      count: open,
      intro: esc('An S1 security exception (SEC-*) or a wrong-taxpayer upload (DOC-04) opens an incident. While it is open, no SARS transaction on that case can run. The Information Officer records containment, investigation, remediation and the notification assessment, then closes it, which releases G17.'),
    });
    const g = GATE.G17;
    const rule = VK.section('adm-incidents-rule', 'G17: ' + g.control, VK.facts([['Owner', esc(g.owner)], ['Release criterion', esc(g.criterion)], ['Blocking codes', `<span class="vk-codes">${g.codes.map((c) => VK.codeChip(c)).join(' ')}</span>`]]), {});
    return VK.page('Incidents', esc('Privacy and security incidents (G17), handled by the Information Officer under POPIA. All data is made up.'), table + rule, { key: 'adm-incidents' });
  };

  VIEWS.incident = (id) => {
    const inc = ENGINE.incById(String(id || ''));
    if (!inc) return VK.page('Incident not found', esc('There is no incident ' + (id || '') + '. ') + '<a href="#incidents">All incidents</a>', '', { key: 'adm-incident' });
    const facts = VK.facts([
      ['Status', incStatus(inc) + (inc.closed ? ` <span class="small muted">Closed by ${esc(pname(inc.closed.by))}, ${VK.when(inc.closed.at)}</span>` : '')],
      ['Case', inc.caseId ? VK.caseWho(inc.caseId) : '<span class="muted">Not tied to a case</span>'],
      ['Client', inc.clientId ? VK.clientLink(inc.clientId) : '<span class="muted">—</span>'],
      ['Codes', `<span class="vk-codes">${inc.codes.map((c, i) => VK.codeChip(c, inc.exceptionIds[i])).join(' ')}</span>`],
      ['Opened', VK.when(inc.opened)],
      ['SARS transactions', inc.status === 'open' && inc.caseId ? 'Stopped on this case until the incident closes' : 'Not stopped'],
    ]);
    const summary = VK.section('adm-incident-facts', 'Summary', facts, {});
    const stepItems = Object.keys(STEPS).map((k) => {
      const s = inc.steps[k];
      if (s) return `<div class="adm-step done"><div class="adm-step-h">${ADM.yes(STEPS[k])}<span class="small muted">${esc(pname(s.by))} · ${VK.when(s.at)}</span></div><p class="small">${esc(VK.scrub(s.note))}</p></div>`;
      if (inc.status !== 'open') return `<div class="adm-step"><div class="adm-step-h">${ADM.no(STEPS[k])}<span class="small muted">Not recorded</span></div></div>`;
      return `<form class="adm-step" data-form="adm.incStep" data-inc="${esc(inc.id)}" data-step="${esc(k)}" novalidate><div class="adm-step-h"><strong>${esc(STEPS[k])}</strong><span class="small muted">Not recorded yet</span></div>
        <label class="f" for="adm-inc-${esc(k)}">What was done<textarea id="adm-inc-${esc(k)}" name="note" maxlength="1000"></textarea></label>
        <div><button class="btn sm" type="submit">Record ${esc(STEPS[k].toLowerCase())}</button></div></form>`;
    });
    const left = Object.keys(STEPS).filter((k) => !inc.steps[k]).map((k) => STEPS[k]);
    const closeBtn = inc.status === 'open' ? `<div class="adm-gateline"><span class="small">${esc(left.length ? 'Still to record: ' + left.join(', ') + '.' : 'Every step is recorded. Closing releases G17.')}</span>${btn('Close incident and release G17', 'adm.incClose', { cls: 'sm' + (left.length ? '' : ' primary'), data: { inc: inc.id } })}</div>` : '';
    const steps = VK.section('adm-incident-steps', 'G17 steps', `<div class="adm-steps">${stepItems.join('')}</div>${closeBtn}`, {
      intro: esc('Only the Information Officer records steps and closes the incident. Anyone else is refused, and the refusal is recorded in the audit trail.'),
    });
    const xs = inc.exceptionIds.map(ENGINE.exById).filter(Boolean);
    const linked = VK.section('adm-incident-exceptions', 'Linked exceptions', VK.list(xs.map(exRow), { empty: 'No linked exceptions.' }), {
      intro: esc('Closing the incident resolves its SEC-* exceptions. Other codes (for example DOC-04) are resolved on their own.'),
    });
    const idRx = new RegExp('\\b' + inc.id + '\\b');  // INC01 must not match INC010
    const trail = S.audit.filter((a) => idRx.test(String(a.text)) || (a.exceptionId && inc.exceptionIds.includes(a.exceptionId))).slice().reverse();
    const log = VK.section('adm-incident-trail', 'Incident history', VK.list(trail.map(ADM.auditRow), { empty: 'Nothing recorded yet.' }), { count: trail.length, actions: '<a href="#audit">Audit trail</a>' });
    return VK.page('Incident ' + inc.id, esc('A privacy or security incident under G17. ') + '<a href="#incidents">All incidents</a>', summary + steps + `<div class="grid2 vk-grid" data-rv-key="adm-incident-columns">${linked}${log}</div>`, { key: 'adm-incident' });
  };

  /* ===================== Retention (G16) ===================== */
  VIEWS.retention = () => {
    const p = PERIODS.retention;
    const rule = VK.section('adm-retention-rule', 'The retention rule', VK.facts([
      ['Period', esc(plural(S.policy.retentionYears, 'year') + ' from ' + p.from)],
      ['Rule', esc(p.rule) + ' · ' + ADM.extLink(p.src, 'Source')],
      ['Firm policy', VK.pill('Pending Johan', 'warn') + ' ' + esc('A longer firm period is Johan’s call; the preview uses the statutory minimum.')],
      ['At the review date', esc('Operon raises RET-03 and, for each hold still active, RET-01, RET-02 or RET-04. Nothing is deleted automatically.')],
      ['G16', esc(GATE.G16.control + ': ' + GATE.G16.criterion)],
    ]), {});
    const cs = S.cases.filter((c) => c.retention.from || c.retention.holds.length);
    const rows = cs.map((c) => {
      const active = c.retention.holds.filter((h) => !h.released);
      return [VK.caseWho(c), VK.date(c.retention.from), VK.date(c.retention.until), VK.date(c.retention.review),
        active.length ? VK.pill(plural(active.length, 'active hold'), 'warn') : '<span class="muted">None</span>', VK.gateChip(c, 'G16'),
        btn('Add legal hold', 'adm.holdAdd', { cls: 'sm', data: { case: c.id } })];
    });
    const waiting = S.cases.filter((c) => !c.retention.from && !c.archived).length;
    const cases = VK.section('adm-retention-cases', 'Retention periods', VK.table([{ label: 'Case' }, { label: 'Runs from' }, { label: 'Keep until' }, { label: 'Review on' }, { label: 'Holds' }, { label: 'G16' }, { label: '', cls: 'vk-act' }], rows,
      { caption: 'Retention periods by case', empty: 'No return has been submitted yet.' }), {
      count: rows.length,
      intro: esc('A retention period starts when the return is submitted. ' + plural(waiting, 'case is', 'cases are') + ' not submitted yet, so retention has not started for them.'),
    });
    const holds = [];
    S.cases.forEach((c) => c.retention.holds.forEach((h) => holds.push({ c, h })));
    const holdRows = holds.reverse().map(({ c, h }) => [`<span class="mono">${esc(h.id)}</span>`, VK.caseWho(c), `${esc(h.label)}<div class="small muted">${esc({ legal: 'Legal or compliance hold', verification: 'Verification (TAA s32)', audit: 'Audit (TAA s32)', dispute: 'Dispute (TAA s32)' }[h.kind] || h.kind)}</div>`,
      VK.when(h.since), h.released ? `${VK.pill('Released', 'ok')}<div class="small muted">${esc(pname(h.released.by))}, ${VK.when(h.released.at)}</div>` : VK.pill('Active', 'warn'),
      h.released ? '' : btn('Release hold', 'adm.holdRel', { cls: 'sm', data: { case: c.id, hold: h.id } })]);
    const holdSec = VK.section('adm-retention-holds', 'Holds', VK.table([{ label: 'Hold' }, { label: 'Case' }, { label: 'Why' }, { label: 'Since' }, { label: 'Status' }, { label: '', cls: 'vk-act' }], holdRows,
      { caption: 'Retention holds', empty: 'No holds.' }), {
      count: holds.filter(({ h }) => !h.released).length,
      intro: esc('A verification, audit or dispute holds the records until it is concluded (TAA s32). Only the Records/Compliance Owner places a legal hold or releases one; anyone else is refused, and the refusal is recorded.'),
    });
    const ret = S.exceptions.filter((x) => /^RET-/.test(x.code) && x.status !== 'closed');
    const exSec = VK.section('adm-retention-exceptions', 'Retention exceptions', VK.list(ret.map(exRow), { empty: 'No open retention exceptions.' }), { count: ret.length });
    return VK.page('Retention', esc('Record retention and holds (G16). All data is made up.'), rule + cases + `<div class="grid2 vk-grid" data-rv-key="adm-retention-columns">${holdSec}${exSec}</div>`, { key: 'adm-retention' });
  };

  /* ===================== Audit trail ===================== */
  const AF = { actor: 'all', role: 'all', result: 'all', caseId: 'all', q: '', limit: 100 };
  const ACTORS = [['all', 'Everyone'], ['human', 'People and clients'], ['ai', 'AI (simulated)'], ['system', 'Operon and SARS']];
  function filtered() {
    const q = AF.q.trim().toLowerCase();
    return S.audit.filter((a) => (AF.actor === 'all' || a.actor === AF.actor) && (AF.role === 'all' || a.role === AF.role) &&
      (AF.result === 'all' || a.result === AF.result) && (AF.caseId === 'all' || a.caseId === AF.caseId) &&
      (!q || [a.id, VK.scrub(a.text), a.code, a.gate, a.caseId, VK.who(a.who)].some((v) => String(v || '').toLowerCase().includes(q))));
  }
  const distinct = (k) => Array.from(new Set(S.audit.map((a) => a[k]).filter(Boolean))).sort();
  const sel = (id, k, label, opts) => `<label class="f" for="${id}">${esc(label)}<select id="${id}" data-on="adm.af" data-k="${k}">${opts.map(([v, t]) => `<option value="${esc(v)}"${AF[k] === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
  VIEWS.audit = () => {
    const v = ENGINE.verifyChain(); const last = S.audit[S.audit.length - 1];
    const integrity = VK.section('adm-audit-integrity', 'Chain check', `${v.ok ? `<p class="vk-okline">${I.check} The chain is intact: ${esc(plural(v.n, 'entry', 'entries'))}, each linked to the one before by its SHA-256 hash.</p>`
      : `<p class="err">${I.alert} The chain is broken at entry ${esc(v.badAt + 1)}: ${esc(v.why)}.</p>`}
      ${VK.facts([['Newest entry', last ? esc(last.id) + ' · ' + VK.when(last.at) : '—'], ['Newest hash', last ? `<span class="hash">${esc(last.hash)}</span>` : '—']])}
      <div class="actions">${btn('Check the chain again', 'adm.verify', { cls: 'sm' })}${btn('Download CSV', 'adm.csv', { cls: 'sm' })}${btn('Download JSON', 'adm.json', { cls: 'sm' })}</div>`, {
      intro: esc('The trail is append-only. Operon recomputes every hash and compares the newest one with a seal kept outside the data, so an edited, shortened or replaced trail is reported. Downloads include identities in full: handle them as client data.'),
    });
    const rows = filtered(); const shown = rows.slice(-AF.limit).reverse();
    const filters = `<div class="filters adm-filters">${sel('adm-af-actor', 'actor', 'Actor', ACTORS)}${sel('adm-af-role', 'role', 'Role', [['all', 'Any role']].concat(distinct('role').map((r) => [r, r])))}
      ${sel('adm-af-result', 'result', 'Result', [['all', 'Any result']].concat(distinct('result').map((r) => [r, r])))}${sel('adm-af-case', 'caseId', 'Case', [['all', 'Any case']].concat(S.cases.map((c) => [c.id, c.id + ' · ' + VK.clientName(c.clientId)])))}
      <label class="f" for="adm-af-q">Search<input id="adm-af-q" class="search" type="search" data-on="adm.afq" value="${esc(AF.q)}" placeholder="Words, code, gate, entry" autocomplete="off"></label>
      <span class="small muted" role="status">${esc(plural(rows.length, 'entry', 'entries') + ' of ' + S.audit.length)}</span></div>`;
    const table = VK.table([{ label: 'When' }, { label: 'Who' }, { label: 'What happened' }, { label: 'Case' }, { label: 'Gate and code' }, { label: 'Entry' }], shown.map((a) => [
      `<span class="vk-when">${VK.when(a.at)}</span>`,
      `${esc(VK.who(a.who))}<div class="small muted">${esc(a.role || a.actor)}</div>`,
      `${esc(VK.scrub(a.text))}${a.result && a.result !== 'Done' ? ' ' + VK.pill(a.result, a.result === 'Refused' ? 'bad' : '') : ''}${a.reason && a.result !== 'Refused' ? `<div class="small muted">Reason: ${esc(VK.scrub(a.reason))}</div>` : ''}${a.evidence ? `<div class="small muted">Evidence: ${esc(VK.scrub(a.evidence))}</div>` : ''}`,
      a.caseId ? VK.caseLink(a.caseId) : (a.client ? VK.clientLink(a.client) : '<span class="muted">—</span>'),
      `${a.gate ? `<span class="vk-gate vk-g-idle"><b>${esc(a.gate)}</b></span> ` : ''}${a.code ? VK.codeChip(a.code, a.exceptionId) : ''}`,
      `<span class="mono small">${esc(a.id)}</span><div class="hash" title="${esc(a.hash)}">${esc(a.hash.slice(0, 12))}…</div>`,
    ]), { caption: 'Audit trail entries, newest first', empty: 'No entry matches these filters.' });
    const more = rows.length > shown.length ? `<div class="adm-more-btn">${btn('Show ' + Math.min(100, rows.length - shown.length) + ' more', 'adm.more', { cls: 'sm' })}</div>` : '';
    const trail = VK.section('adm-audit-trail', 'Entries', filters + table + more, { count: rows.length, intro: esc('Newest first. ID numbers and tax references in the text are masked on screen.') });
    const fields = VK.section('adm-audit-fields', 'What every entry records', `<ul class="adm-items">${AUDIT_ITEMS.map((t) => `<li>${esc(t)}</li>`).join('')}</ul><p class="small muted">Fields in the export: <span class="mono">${esc(AUDIT_FIELDS.join(', '))}</span></p>`, {
      intro: esc('From the master document, Phase 20 (audit trail).'),
    });
    return VK.page('Audit trail', esc('Every action, approval, refusal and AI step, hash-chained so nothing can be changed quietly. All data is made up; the AI and the SARS link are simulated.'), integrity + trail + fields, { key: 'adm-audit' });
  };

  /* ===================== Actions ===================== */
  const stamp = () => ENGINE.isoDay(now()).replace(/-/g, '');
  Object.assign(FORMS, {
    'adm.incStep': (f) => {
      const inc = ENGINE.incById(f.dataset.inc); const k = f.dataset.step;
      if (!inc || !STEPS[k]) { toast('That incident is no longer here.'); render(); return; }
      const note = String(f.elements.note.value || '').trim();
      if (!note) { toast('Write what was done first.'); return; }
      VK.done(ENGINE.incidentStep(inc, k, ACTOR.me(), { note }), STEPS[k] + ' recorded for ' + inc.id + '.');
    },
  });
  Object.assign(ACT, {
    'adm.incClose': (t) => {
      const inc = ENGINE.incById(t.dataset.inc); if (!inc) { toast('That incident is no longer here.'); render(); return; }
      modal('Close ' + inc.id, `<p>Close the incident and release G17? Closing resolves its SEC-* exceptions, and SARS transactions on the case can run again.</p>
        <p class="hint">You close it as ${esc(S.role)} (${esc(me().name)}). Only the Information Officer can.</p>`, 'Close incident', () => ADM.finish(ENGINE.closeIncident(inc, ACTOR.me()), 'Closed ' + inc.id + ' and released G17.'));
    },
    'adm.holdAdd': (t) => {
      const c = ENGINE.caseById(t.dataset.case); if (!c) { toast('That case is no longer here.'); render(); return; }
      modal('Legal hold on ' + c.id, `<p>A legal or compliance hold keeps every record of ${esc(c.id)} past its review date until it is released.</p>
        <label class="f" for="adm-hold-label">Why (required)<input id="adm-hold-label" name="label" maxlength="200" autocomplete="off"></label>
        <p class="hint">Only the Records/Compliance Owner can place a legal hold.</p>`, 'Place hold', (fd) => {
        const label = String(fd.label || '').trim(); if (!label) return 'Say why the hold is needed.';
        return ADM.finish(ENGINE.legalHold(c, ACTOR.me(), label), 'Legal hold placed on ' + c.id + '.');
      });
    },
    'adm.holdRel': (t) => {
      const c = ENGINE.caseById(t.dataset.case); const h = c && c.retention.holds.find((x) => x.id === t.dataset.hold);
      if (!h) { toast('That hold is no longer here.'); render(); return; }
      modal('Release hold ' + h.id, `<p>Release “${esc(h.label)}” on ${esc(c.id)}? Retention is then reassessed.</p><p class="hint">Only the Records/Compliance Owner can release a hold.</p>`,
        'Release hold', () => ADM.finish(ENGINE.releaseHold(c, h.id, ACTOR.me()), 'Released hold ' + h.id + '.'));
    },
    'adm.verify': () => { const v = ENGINE.verifyChain(); toast(v.ok ? 'The chain is intact: ' + plural(v.n, 'entry', 'entries') + '.' : 'The chain is broken at entry ' + (v.badAt + 1) + ': ' + v.why + '.'); render(); },
    'adm.csv': () => { ADM.download('operon-demo-audit-trail-' + stamp() + '.csv', ENGINE.auditCsv(), 'text/csv;charset=utf-8'); toast('Audit trail downloaded as CSV.'); },
    'adm.json': () => { ADM.download('operon-demo-audit-trail-' + stamp() + '.json', ENGINE.auditJson(), 'application/json'); toast('Audit trail downloaded as JSON.'); },
    'adm.more': () => { AF.limit += 100; render(); },
  });
  EXT_FIELD['adm.af'] = (el) => { const k = el.dataset.k; if (['actor', 'role', 'result', 'caseId'].includes(k)) { AF[k] = String(el.value); AF.limit = 100; } };
  EXT_FIELD['adm.afq'] = (el) => { AF.q = String(el.value || '').slice(0, 80); AF.limit = 100; };
})();

/* ===================== itr12/views-try.js ===================== */
/* Try it: one-click scenarios that show the controls at work. Each runs on a seeded demo case or on a fresh made-up case, says
   what happened and links to where to look. Everything goes through ENGINE, so every step (refusals included) is in the audit trail:
     - your own step uses ACTOR.me() (the signed-in role's person), so a role that may not do it is refused and told why;
     - the client's step goes through ENGINE.portal() (the client in the simulated PaperSync portal);
     - setting up a fresh case uses ENGINE.newClient/newCase/drive, the engine's own walk-through by the simulated team;
     - a ruleset change is the simulated platform team (ACTOR.platform), the only actor the engine lets change it.
   Results are kept for this browser tab only and vanish when the demo is reset. */
(() => {
  const RES = { s: null, map: {} };
  const results = () => { if (RES.s !== S) { RES.s = S; RES.map = {}; } return RES.map; };
  const you = () => me().name + ', ' + S.role;
  const go = (href, label) => `<a href="#${esc(href)}">${esc(label)}</a>`;
  const chips = (xs) => `<span class="vk-codes">${xs.map((x) => VK.codeChip(x.code, x) + VK.sevChip(x.sev, { short: true })).join(' ')}</span>`;
  const newEx = (n0, c) => S.exceptions.slice(n0).filter((x) => !c || x.caseId === c.id);

  /* ---------- fresh made-up cases ---------- */
  // An SA-ID-shaped number whose check digit is deliberately wrong, so it can never be a real ID (as in seed.js).
  function demoId(dob, n) {
    const body = dob.slice(2, 4) + dob.slice(5, 7) + dob.slice(8, 10) + String(n).padStart(4, '0') + '08';
    let sum = 0;
    for (let i = 0; i < body.length; i++) { let d = +body[body.length - 1 - i]; if (i % 2 === 0) { d *= 2; if (d > 9) d -= 9; } sum += d; }
    return body + (((10 - (sum % 10)) % 10 + 5) % 10);
  }
  const PEOPLE = {
    wrong: { name: 'Bongani Mahlaba', dob: '1984-02-17', others: ['Naledi Mahlaba'] },
    malware: { name: 'Carla Pretorius', dob: '1989-08-04' },
    timeout: { name: 'Yusuf Ebrahim', dob: '1977-12-11' },
    withdraw: { name: 'Annelie Swart', dob: '1983-05-29' },
    override: { name: 'Musa Khoza', dob: '1992-10-02' },
  };
  const ANSWERS = { medical: false };  // only the IRP5 is needed, so the calculation reconciles with one document
  function fresh(key, items) {
    const p = PEOPLE[key]; const n = S.clients.length + 1;
    const cl = ENGINE.newClient({ name: p.name, idNo: demoId(p.dob, 7000 + n * 13), taxRef: String(9180000000 + n * 4973), others: p.others || [] });
    const c = ENGINE.newCase(cl, { items: items || ['irp5', 'medical'], priorYear: ['employment'] });
    return { cl, c };
  }
  // A fresh case walked to `gate` by the simulated team, with values extracted from its IRP5 (simulated) so the calculation is real.
  function freshTo(key, gate) {
    const { cl, c } = fresh(key, gate === 'G04' ? ['irp5', 'medical'] : ['irp5']);
    if (gate === 'G04') { const r = ENGINE.drive(c, 'G04'); return { cl, c, r }; }
    let r = ENGINE.drive(c, 'G05', { answers: ANSWERS });
    if (!r.ok) return { cl, c, r };
    const d = c.docs.filter((x) => x.kind === 'irp5' && x.status === 'validated').pop();
    if (d) ENGINE.setInputs(c, ACTOR.ai(), { lines: [{ id: 'L1', docId: d.id, ref: 'IRP5 code 3601: income', field: 'remuneration', amount: 455000 }, { id: 'L2', docId: d.id, ref: 'IRP5 code 4102: PAYE', field: 'paye', amount: 84300 }] }, { note: 'Extracted the IRP5 values (simulated)' });
    r = ENGINE.drive(c, gate, { answers: ANSWERS });
    return { cl, c, r };
  }
  const setupLine = (c, cl, gate) => `Opened a fresh made-up case ${VK.caseLink(c)} for ${VK.clientLink(cl)} and walked it to ${esc(gate)} (the simulated team did the earlier steps).`;
  const setupFailed = (c, r) => ({ tone: 'err', head: 'Could not set up the case: ' + r.why, lines: ['The demo team could not walk ' + VK.caseLink(c) + ' forward. ' + esc(S.rulesetVersion !== '2026.1' ? 'The tax ruleset is still ' + S.rulesetVersion + ': use “Restore 2026.1 and rerun” first.' : 'If AI work is paused, resume it, or reset the demo.')], links: [VK.caseLink(c), go('audit', 'Audit trail')] });

  /* ---------- the scenarios ---------- */
  function upload(key, fileName, bytes, what) {

      lines: [setupLine(c, cl, 'G04'),
        `As the client, in the simulated PaperSync portal, uploaded <span class="mono">${esc(fileName)}</span> for the IRP5. ${esc(what)}`,

  function drag() {

    const from = ENGINE.columnOf(c); const i = BOARD.findIndex((b) => b.key === from);
    const to = BOARD[i + 1] ? BOARD[i + 1] : null;
    const n0 = S.audit.length;
    const r = ENGINE.dragForward(c, ACTOR.me(), to ? to.key : null);
    // A role that does not own the gate is refused for that reason alone, which hides the codes this scenario is about. So the
    // simulated Tax Consultant, who owns G02, tries the same drag too: that refusal names the blocking codes.
    const tcToo = !r.ok && S.role !== 'Tax Consultant' ? ENGINE.dragForward(c, ACTOR.as('Tax Consultant', c.consultant), to ? to.key : null) : null;
    const logged = S.audit.slice(n0).filter((a) => a.result === 'Refused').length;

    }

        tcToo ? `The Tax Consultant (simulated), who owns G02, tried the same drag. Refused: ${esc(tcToo.why)}${bl.length ? ' ' + chips(bl) : ''}` : '',
        esc(plural(logged, 'refusal') + ' written to the audit trail. Nothing changed on the case.')].filter(Boolean),

    const ia = ACTOR.as('Integration Administrator'); const tc = ACTOR.as('Tax Consultant', c.consultant);
    const s1 = ENGINE.signG18(t, ia); const s2 = s1.ok ? ENGINE.signG18(t, tc) : s1;

  function ruleset() {

        out.length ? 'The AI (simulated) reran each affected calculation:' : 'No case needed a rerun.',
        ...out.map((o) => `${VK.caseWho(o.c)}: ${o.k.ok ? esc('version ' + o.k.version + ' on 2026.1') + (ENGINE.currentApproval(o.c) ? '' : esc(o.c.approval ? ', so the client must approve again' : '')) : 'refused: ' + esc(o.k.why)}`),

  let runN = 0;
  Object.assign(ACT, {

  VIEWS.try = () => {

  const fmtOf = (f) => ({ date: 'Date, YYYY-MM-DD', id: '13 digits', taxref: '10 digits', email: 'Email address', phone: 'Phone number', yesno: 'Yes or No',
    postcode: '4 digits', branch: '6 digits', account: 'Digits', choice: 'One of: ' + (f.choices || []).join(', ') }[f.kind] || 'Text');
