/* ===================== itr12/views-kit.js ===================== */
/* Shared helpers for the ITR12 screens (views-*.js). Loaded after engine.js and seed.js, before the screens.
   Views only read state: every change goes through ENGINE with ACTOR.me(), and the shared actions below (ACT 'vk.*') are the
   only place the kit asks ENGINE to change anything. Every dynamic value goes through esc(); links are built only from ids
   that match [A-Za-z0-9], so data never reaches an href.
   Conventions for screens:
     - VK.page(title, intro, body, { key }) gives the page heading (data-rv-key '<key>-head').
     - Every block is VK.section(key, title, body, opts) with an explicit data-rv-key, so review notes and layouts survive rewording.
     - Tables go through VK.table(): at 760px and below each row becomes a labelled card, so the page never scrolls sideways. */
const VK = (() => {
  /* ---------- ids, names and links ---------- */
  const ID_RX = /^[A-Za-z0-9]{1,40}$/;
  const safeId = (v) => (ID_RX.test(String(v == null ? '' : v)) ? String(v) : '');
  const caseOf = (c) => (c && typeof c === 'object' ? c : ENGINE.caseById(c));
  const clientOf = (cl) => (cl && typeof cl === 'object' ? cl : (cl ? ENGINE.clientOf(String(cl)) : null));
  const exOf = (x) => (x && typeof x === 'object' ? x : ENGINE.exById(x));
  const clientName = (cl) => { const k = clientOf(cl); return k ? k.name : String(cl || ''); };
  // A link to #<route>-<id>; plain text when the id is not a safe app id.
  function link(route, id, label, o) {
    const sid = safeId(id); const text = esc(label == null ? id : label);
    if (!sid) return text;
    return `<a href="#${route}-${sid}"${o && o.cls ? ` class="${esc(o.cls)}"` : ''}${o && o.title ? ` title="${esc(o.title)}"` : ''}>${text}</a>`;
  }
  const caseLink = (c, label) => { const k = caseOf(c); const id = k ? k.id : c; return link('case', id, label == null ? id : label); };
  const clientLink = (cl, label) => { const k = clientOf(cl); const id = k ? k.id : cl; return link('client', id, label == null ? (k ? k.name : id) : label); };
  const exLink = (x, label) => { const k = exOf(x); const id = k ? k.id : x; return link('exception', id, label == null ? id : label); };
  // "C10 · Tebogo Sithole", both linked.
  const caseWho = (c) => { const k = caseOf(c); if (!k) return '<span class="muted">No case</span>'; return `${caseLink(k)} <span class="muted" aria-hidden="true">·</span> ${clientLink(k.clientId)}`; };
  // A person, the client (portal) or a simulated actor, as plain text.
  function who(id) {
    if (!id) return '';
    const p = S.people.find((x) => x.id === id) || PEOPLE0.find((x) => x.id === id);
    if (p) return p.name;
    const cl = S.clients.find((x) => x.id === id);
    return cl ? cl.name + ' (PaperSync portal)' : String(id);
  }

  /* ---------- masked identities ---------- */
  // An ID number shows only its first 6 digits (the date of birth); a tax reference only its last 4.
  const maskId = (v) => { const s = String(v == null ? '' : v).replace(/\s/g, ''); return s.length <= 6 ? '•'.repeat(s.length) : s.slice(0, 6) + '•'.repeat(s.length - 6); };
  const maskTaxRef = (v) => { const s = String(v == null ? '' : v).replace(/\s/g, ''); return s.length <= 4 ? '•'.repeat(s.length) : '•'.repeat(s.length - 4) + s.slice(-4); };
  // A client with no RSA ID number (a passport-only client) shows that plainly instead of an empty mask.
  const idHtml = (v) => (String(v == null ? '' : v).trim() ? `<span class="mono vk-masked" title="ID number, masked: only the date of birth shows">${esc(maskId(v))}</span>` : '<span class="muted">No RSA ID number</span>');
  const taxRefHtml = (v) => `<span class="mono vk-masked" title="Tax reference, masked: only the last 4 digits show">${esc(maskTaxRef(v))}</span>`;
  // Free text from the audit trail, notes and file names: any 13-digit run (an ID number) or 10-digit run (a tax reference) is
  // masked, even inside a word or next to an underscore (IRP5_9061007331_2026.pdf), so digit lookarounds are used, not \b.
  // A calendar day written YYYY-MM-DD reads as a date (12 Nov 2026); an invalid one is left as it was received.
  const isoDay = (m) => { const d = DATES.dt(m) ? toDay(m) : null; return d ? fDate(d) : m; };
  const scrub = (t) => String(t == null ? '' : t).replace(/(?<!\d)\d{13}(?!\d)/g, maskId).replace(/(?<!\d)\d{10}(?!\d)/g, maskTaxRef)
    .replace(/(?<![\d-])\d{4}-\d{2}-\d{2}(?![\d-])/g, isoDay);

  /* ---------- money and dates ---------- */
  const money = (n) => (n == null || n === '' || !isFinite(+n) ? '<span class="muted">—</span>' : `<span class="num">${esc(CALC.rand(+n))}</span>`);
  // A Date, or a calendar day 'YYYY-MM-DD' (read as a local day, so no time zone shifts it).
  function toDay(v) {
    if (v instanceof Date) return isNaN(v) ? null : v;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  const date = (v) => { const d = toDay(v); return d ? esc(fDate(d)) : '<span class="muted">—</span>'; };
  const dateShort = (v) => { const d = toDay(v); return d ? esc(fShort(d)) : '<span class="muted">—</span>'; };
  const when = (d) => (d instanceof Date && !isNaN(d) ? `<time datetime="${esc(d.toISOString())}">${esc(fWhen(d))}</time>` : '<span class="muted">—</span>');
  const datebox = (v) => { const d = toDay(v); return d ? `<span class="datebox" aria-hidden="true"><b>${d.getDate()}</b>${esc(MON[d.getMonth()])}</span>` : '<span class="datebox" aria-hidden="true">—</span>'; };
  // Business days from today (the demo clock) to a calendar day; negative when it has passed. ch9 skips 16 Dec to 15 Jan.
  const bizLeft = (iso, ch9) => { const d = DATES.dt(String(iso || '')); return d ? DATES.businessDaysBetween(DATES.fromLocal(now()), d, { ch9: !!ch9 }) : null; };
  function leftText(n) {
    if (n == null) return 'No date';
    if (n < 0) return plural(-n, 'business day') + ' overdue';
    if (n === 0) return 'Due today';
    return 'In ' + plural(n, 'business day');
  }
  const leftPill = (n) => pill(leftText(n), n == null ? '' : (n < 0 ? 'bad' : (n <= 2 ? 'warn' : 'info')));

  /* ---------- chips and pills ---------- */
  const pill = (text, tone) => `<span class="pill${tone ? ' ' + esc(tone) : ''}">${esc(text)}</span>`;
  const sevChip = (sev, o) => {
    const s = SEV.includes(sev) ? sev : 'S4';
    return `<span class="vk-sev vk-${s.toLowerCase()}" title="Severity ${esc(SEV_LABEL[s])}">${esc(o && o.short ? s : SEV_LABEL[s])}</span>`;
  };
  // An exception code with its register title as the tooltip; linked to the exception when one is given.
  function codeChip(code, x) {
    const def = CODE[code]; const tip = def ? code + ': ' + def.title : String(code);
    const inner = esc(code);
    const k = x ? exOf(x) : null;
    return k && safeId(k.id) ? `<a class="vk-code" href="#exception-${k.id}" title="${esc(tip + ' (' + k.id + ')')}">${inner}</a>` : `<span class="vk-code" title="${esc(tip)}">${inner}</span>`;
  }
  // Gate states come from ENGINE.gateState. 'in progress' with an exception stopping it reads Blocked.
  const STATE = {
    released: ['Released', 'done'], 'released, awaiting SARS': ['Released, awaiting SARS', 'sars'], ready: ['Ready', 'ready'],
    'in progress': ['In progress', 'prog'], 'not started': ['Not started', 'idle'], invalidated: ['Re-opened', 'reopen'], 'n/a': ['Not needed', 'na'],
  };
  function gateStateWord(st) {
    const s = st && STATE[st.state] ? st.state : 'not started';
    if (s === 'in progress' && st.blockers && st.blockers.length) return ['Blocked', 'blocked'];
    return STATE[s];
  }
  function gateChip(c, g, o) {
    const k = caseOf(c); const st = k ? ENGINE.gateState(k, g) : null; const [word, cls] = gateStateWord(st);
    const tip = g + ': ' + (GATE[g] ? GATE[g].control : '') + ' (' + word + ')';
    return `<span class="vk-gate vk-g-${cls}" title="${esc(tip)}"><b>${esc(g)}</b>${o && o.bare ? '' : ' ' + esc(word)}</span>`;
  }
  const gateName = (g) => (GATE[g] ? GATE[g].control : String(g));
  const EX_STATUS = { raised: ['Raised', 'warn'], assigned: ['Assigned', 'info'], 'awaiting client': ['Awaiting client', 'warn'], resolved: ['Resolved, to close', 'ok'], closed: ['Closed', ''] };
  const exStatus = (x) => { const k = exOf(x); const s = EX_STATUS[k && k.status] || [k ? k.status : '', '']; return pill(s[0], s[1]); };

  /* ---------- layout ---------- */
  // The page heading. title is text; intro is HTML the caller has already escaped. o.key names the heading block (<key>-head).
  function page(title, intro, body, o) {
    o = o || {};
    const key = o.key || routeOf().name;
    return `<div class="stack vk-page"><div class="pagehead" data-rv-key="${esc(key)}-head"><div class="vk-headtext"><h1>${esc(title)}</h1>${intro ? `<p class="muted">${intro}</p>` : ''}</div>${o.actions ? `<div class="actions">${o.actions}</div>` : ''}</div>${body || ''}</div>`;
  }
  // A card section with an explicit review key. opts: count (shown beside the title), intro (HTML), actions (HTML), cls.
  function section(key, title, body, opts) {
    opts = opts || {};
    const count = opts.count != null ? `<span class="count${opts.count ? '' : ' zero'}" aria-label="${esc(opts.count)} items">${esc(opts.count)}</span>` : '';
    return `<section class="card vk-sec${opts.cls ? ' ' + esc(opts.cls) : ''}" data-rv-key="${esc(key)}"><header class="vk-sec-h"><h2>${esc(title)}</h2>${count}${opts.actions ? `<span class="vk-sec-a">${opts.actions}</span>` : ''}</header>${opts.intro ? `<p class="vk-sec-intro">${opts.intro}</p>` : ''}${body || ''}</section>`;
  }
  // columns: [{ label, cls }] or labels. rows: arrays of cell HTML, or { cells, cls }. On phones each row becomes a labelled card
  // (opts.phone 'scroll' keeps the table and scrolls it inside its own box instead). opts: key, caption, empty, cls.
  function table(columns, rows, opts) {
    opts = opts || {};
    const cols = columns.map((c) => (typeof c === 'string' ? { label: c } : c));
    if (!rows.length) return empty(opts.empty || 'Nothing to show.');
    const head = cols.map((c) => `<th scope="col"${c.cls ? ` class="${esc(c.cls)}"` : ''}>${c.label ? esc(c.label) : '<span class="sr">Actions</span>'}</th>`).join('');
    const body = rows.map((r) => {
      const cells = Array.isArray(r) ? r : r.cells;
      return `<tr${r.cls ? ` class="${esc(r.cls)}"` : ''}>${cells.map((h, i) => { const c = cols[i] || {}; return `<td data-label="${esc(c.label || '')}"${c.cls ? ` class="${esc(c.cls)}"` : ''}><div class="vk-cell">${h == null ? '' : h}</div></td>`; }).join('')}</tr>`;
    }).join('');
    return `<div class="tablewrap vk-tablewrap${opts.phone === 'scroll' ? '' : ' vk-cards'}${opts.cls ? ' ' + esc(opts.cls) : ''}"${opts.key ? ` data-rv-key="${esc(opts.key)}"` : ''}><table>${opts.caption ? `<caption class="sr">${esc(opts.caption)}</caption>` : ''}<thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  // An empty state. text is plain text; o.html adds escaped-by-caller HTML (a hint or a link).
  const empty = (text, o) => `<div class="vk-empty">${I.check}<div><p>${esc(text)}</p>${o && o.html ? o.html : ''}</div></div>`;
  // A plain list of rows: items are HTML strings. o.cls adds a modifier class.
  const list = (items, o) => (items.length ? `<ul class="vk-list${o && o.cls ? ' ' + esc(o.cls) : ''}">${items.map((h) => `<li>${h}</li>`).join('')}</ul>` : empty((o && o.empty) || 'Nothing to show.'));

  // The phase/gate tracker for one case: the board's columns in order, each with its gates' states. Wraps on phones.
  function tracker(c) {
    const k = caseOf(c); if (!k) return '';
    const cur = ENGINE.currentGate(k); const col = ENGINE.columnOf(k);
    return `<ol class="vk-track" aria-label="Gates for ${esc(k.id)}">${BOARD.map((b) => {
      const gates = b.gates.map((g) => { const st = ENGINE.gateState(k, g); const [word, cls] = gateStateWord(st);
        return `<li class="vk-tk vk-g-${cls}${g === cur ? ' now' : ''}" title="${esc(g + ': ' + gateName(g))}"><b>${esc(g)}</b><span>${esc(word)}</span></li>`; }).join('');
      return `<li class="vk-tcol${b.key === col ? ' now' : ''}"${b.key === col ? ' aria-current="step"' : ''}><span class="vk-tcol-h">${esc(b.label)}</span><ol>${gates}</ol></li>`;
    }).join('')}</ol>`;
  }

  /* ---------- results ---------- */
  // After an ENGINE call: toast the outcome (the refusal reason when result.ok is false) and render. Returns result.ok.
  function done(result, okMessage) {
    const ok = !!(result && result.ok);
    toast(ok ? okMessage : 'Not done: ' + ((result && result.why) || 'Operon refused this.'));
    render();
    return ok;
  }

  /* ---------- lists more than one screen needs ---------- */
  const actorFor = (role) => (role === S.role ? ACTOR.me() : ACTOR.as(role));
  // Does a register owner string name this role? "AI Agent; Tax Consultant for exceptions" and "Integration Administrator +
  // substantive gate owner" name two (the substantive gates belong to the Tax Consultant). "Records/Compliance Owner" is one role.
  function ownedBy(owner, role) {
    return String(owner || '').split(/\s*;\s*|\s+\+\s+|\s+\/\s+/).some((p) => p === role || p.startsWith(role + ' ') || (p === 'substantive gate owner' && role === 'Tax Consultant'));
  }
  // The gates waiting for a role, ready ones first. Kinds: 'gate' (release with ENGINE.release), 'g18' (a transaction awaiting this
  // role's G18 sign-off) and 'incident' (G17, closed on the Incidents screen). AI gates count only once the AI has routed them to
  // the consultant; G16 only once its retention review date is reached.
  function waitingGates(role) {
    role = role || S.role;
    const a = actorFor(role); const out = []; const today = ENGINE.isoDay(now());
    S.cases.forEach((c) => {
      if (c.archived) return;
      ENGINE.seq(c).forEach((g) => {
        if (g === 'G18' || c.gates[g].status === 'released') return;
        const rel = RELEASE[g];
        if (!rel || !(rel.by === 'role' || rel.by === 'ai') || rel.role !== role) return;
        if (ENGINE.pendingBefore(c, g).length) return;
        if (rel.by === 'ai' && !c.gates[g].routed) return;
        if (g === 'G16' && !(c.retention.review && today >= c.retention.review)) return;
        const r = ENGINE.canRelease(c, g, a);
        out.push({ kind: 'gate', key: c.id + '-' + g, c, g, ready: r.ok, why: r.why, blockers: r.blockers, missing: r.missing, label: gateName(g) });
      });
    });
    if (RELEASE.G18.roles.includes(role)) {
      S.txs.filter((t) => t.status === 'awaiting G18' && !t.signoffs.some((s) => s.role === role)).forEach((t) => {
        const c = ENGINE.caseById(t.caseId); if (!c) return;
        const bad = ENGINE.g18Checks(t).filter((k) => !k.ok); const gb = ENGINE.g18Blockers(t);
        const why = [bad.length ? 'Check ' + bad.map((k) => k.n + ' fails (' + k.why + ')').join('; ') : '', gb.length ? 'Blocked by ' + gb.join(', ') : ''].filter(Boolean).join('; ');
        const other = t.signoffs.map((s) => pname(s.id) + ' (' + s.role + ') has signed');
        out.push({ kind: 'g18', key: t.id, c, g: 'G18', tx: t, ready: !why, why, blockers: [], missing: [], label: 'Sign G18 for ' + t.id + ' (' + t.label + ')', note: other.join('; ') });
      });
    }
    if (role === RELEASE.G17.role) {
      S.incidents.filter((i) => i.status === 'open').forEach((inc) => {
        const left = Object.keys(ENGINE.INCIDENT_STEPS).filter((k) => !inc.steps[k]).map((k) => ENGINE.INCIDENT_STEPS[k]);
        out.push({ kind: 'incident', key: inc.id, c: inc.caseId ? ENGINE.caseById(inc.caseId) : null, g: 'G17', inc, ready: !left.length,
          why: left.length ? 'Still to record: ' + left.join(', ') : '', blockers: [], missing: left, label: 'Close incident ' + inc.id + ' (' + inc.codes.join(', ') + ')' });
      });
    }
    return out.sort((p, q) => (p.ready === q.ready ? (p.c ? p.c.id : '').localeCompare(q.c ? q.c.id : '') : (p.ready ? -1 : 1)));
  }
  // Exceptions waiting for a role: open ones its role owns ('resolve'), and resolved ones it closes as secondary reviewer ('close').
  // o.sev limits severities, e.g. ['S1', 'S2']. Sorted by severity, then oldest first.
  function myExceptions(role, o) {
    role = role || S.role; o = o || {};
    const out = [];
    S.exceptions.forEach((x) => {
      if (o.sev && !o.sev.includes(x.sev)) return;
      if (ENGINE.isOpen(x) && ownedBy(x.owner, role)) out.push({ x, need: 'resolve' });
      else if (x.status === 'resolved' && x.secondary === role) out.push({ x, need: 'close' });
    });
    return out.sort((p, q) => (SEV.indexOf(p.x.sev) - SEV.indexOf(q.x.sev)) || (p.x.at - q.x.at));
  }
  // Deadlines up to o.days business days ahead (default 10), overdue ones included. From the case (filing season close, Declaration
  // Alert, verification and audit due dates, the remedy's statutory deadline, PaperSync reminders running out) and from open
  // exceptions (SARS deadline, client due date). One row per case and day; the codes due that day are merged into it.
  function deadlines(o) {
    o = o || {};
    const days = o.days == null ? 10 : o.days;
    const rows = []; const at = {};
    const add = (iso, what, c, extra) => {
      extra = extra || {};
      const left = bizLeft(iso, extra.ch9); if (left == null || left > days) return null;
      const k = (c ? c.id : 'none') + '|' + iso;
      if (at[k]) { (extra.codes || []).forEach((y) => { if (!at[k].codes.some((z) => z.id === y.id)) at[k].codes.push(y); }); return at[k]; }
      const row = { key: k, date: iso, left, what, c: c || null, codes: (extra.codes || []).slice(), kind: extra.kind || 'case', ch9: !!extra.ch9, source: extra.source || '' };
      at[k] = row; rows.push(row); return row;
    };
    S.cases.forEach((c) => {
      if (c.archived) return;
      if (!(c.submission && c.submission.ok) && c.year === FILING_2026.year) {
        const f = c.filing === 'provisional' ? FILING_2026.provisional : FILING_2026.nonProvisional;
        add(f.closes, 'ITR12 filing season closes (' + f.label.toLowerCase() + ')', c, { kind: 'filing', source: 'SARS filing season 2026' });
      }
      if (c.da && c.da.due && !c.da.submitted && !c.da.moved) add(c.da.due, 'Declaration Alert response due (' + c.da.ref + ')', c, { kind: 'sars', source: 'SARS notice' });
      if (c.vrf && c.vrf.due && !c.vrf.uploaded) add(c.vrf.due, 'Verification documents due (' + c.vrf.ref + ')', c, { kind: 'sars', source: 'SARS notice' });
      if (c.aud && c.aud.due && !c.aud.uploaded) add(c.aud.due, 'Audit response due (' + c.aud.ref + ')', c, { kind: 'sars', source: 'SARS notice' });
      if (c.remedy && c.remedy.deadline && !ENGINE.stepDone(c, 'G15')) {
        const p = PERIODS[c.remedy.route];
        add(c.remedy.deadline, (p ? p.label : 'Remedy') + ' due', c, { kind: 'remedy', ch9: true, source: p ? p.rule : '' });
      }
      c.reminders.filter((r) => r.status === 'sent').forEach((r) => add(ENGINE.isoDay(r.expires), 'PaperSync ' + r.kind + ' reminder runs out (policy pending Johan)', c, { kind: 'reminder', source: 'Firm policy' }));
    });
    S.exceptions.forEach((x) => {
      if (!ENGINE.isOpen(x)) return;
      const c = x.caseId ? ENGINE.caseById(x.caseId) : null;
      if (c && c.archived) return;
      if (x.sarsDeadline) add(x.sarsDeadline, x.code + ' ' + x.title, c, { kind: 'exception', codes: [x], ch9: /^REM-/.test(x.code), source: 'SARS deadline' });
      if (x.clientDue) add(x.clientDue, 'Client action due: ' + x.code + ' ' + x.title, c, { kind: 'client', codes: [x], source: 'Client due date' });
    });
    return rows.sort((p, q) => (p.date < q.date ? -1 : p.date > q.date ? 1 : (p.c ? p.c.id : '').localeCompare(q.c ? q.c.id : '')));
  }

  /* ---------- shared actions ---------- */
  // Modal flows keep the dialog open with the refusal reason; success closes it, toasts and renders.
  const finish = (r, okMessage) => (r && r.ok ? () => done(r, okMessage) : 'Not done: ' + ((r && r.why) || 'Operon refused this.'));
  const facts = (pairs) => `<dl class="facts">${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;

  // Release a gate (data-case, data-gate). For G18, data-tx names the transaction this role signs.
  function actRelease(t) {
    const c = ENGINE.caseById(t.dataset.case); const g = t.dataset.gate;
    if (!c || !GATE[g]) { toast('That case or gate is no longer here.'); render(); return; }
    const cl = ENGINE.clientOf(c);
    if (g === 'G18') {
      const tx = ENGINE.txById(t.dataset.tx);
      if (!tx || tx.caseId !== c.id) { toast('That SARS transaction is no longer here.'); render(); return; }
      const checks = ENGINE.g18Checks(tx); const gb = ENGINE.g18Blockers(tx);
      modal('Sign G18 for ' + tx.id, `${facts([['Case', esc(c.id) + ' · ' + esc(cl.name)], ['Transaction', esc(tx.id + ' · ' + tx.label + ' · version ' + tx.version)],
        ['Signed so far', tx.signoffs.length ? esc(tx.signoffs.map((s) => pname(s.id) + ' (' + s.role + ')').join(', ')) : 'Nobody yet']])}
        <ol class="vk-checks">${checks.map((k) => `<li class="${k.ok ? 'ok' : 'bad'}">${k.ok ? I.check : I.alert}<span>${esc(k.label)}${k.ok ? '' : `<br><span class="err">${esc(scrub(k.why))}</span>`}</span></li>`).join('')}</ol>
        ${gb.length ? `<p class="err">Blocked by ${esc(gb.join(', '))}</p>` : ''}
        <p class="hint">G18 needs two different people: the Integration Administrator and the Tax Consultant. Nothing is sent to SARS: the link is simulated.</p>`,
      'Sign G18', () => finish(ENGINE.signG18(tx, ACTOR.me()), 'Signed G18 for ' + tx.id + '.'));
      return;
    }
    const cr = ENGINE.canRelease(c, g, ACTOR.me());
    modal('Release ' + g + ' for ' + c.id, `${facts([['Gate', esc(g + ' · ' + gateName(g))], ['Case', esc(c.id) + ' · ' + esc(cl.name)], ['Version', esc(ENGINE.vN(c) || 'none yet')]])}
      ${GATE[g].criterion ? `<p class="small"><span class="muted">Release when:</span> ${esc(GATE[g].criterion)}</p>` : ''}
      ${cr.ok ? `<p class="vk-okline">${I.check} Every check for ${esc(g)} passes.</p>` : `<p class="err">${esc(scrub(cr.why))}</p>`}
      <label class="f" for="vk-rel-ev">Note or evidence (optional)<input id="vk-rel-ev" name="evidence" maxlength="300" autocomplete="off"></label>
      <p class="hint">You release it as ${esc(S.role)} (${esc(me().name)}). Operon records it in the audit trail.</p>`,
    'Release ' + g, (fd) => finish(ENGINE.release(c, g, ACTOR.me(), { evidence: String(fd.evidence || '').trim() }), 'Released ' + g + ' for ' + c.id + '.'));
  }
  // Resolve an exception: the action taken (required) and optional evidence.
  function actResolve(t) {
    const x = ENGINE.exById(t.dataset.ex);
    if (!x) { toast('That exception is no longer here.'); render(); return; }
    const c = x.caseId ? ENGINE.caseById(x.caseId) : null; const def = CODE[x.code] || {};
    const guard = ENGINE.resolveGuard(c, x);
    modal('Resolve ' + x.id, `<p class="row">${codeChip(x.code)}${sevChip(x.sev)}<strong>${esc(x.title)}</strong></p>
      ${facts([['Case', c ? esc(c.id) + ' · ' + esc(clientName(c.clientId)) : 'No case'], ['Resolved when', esc(def.resolution || '')]])}
      ${x.note ? `<p class="note">${esc(scrub(x.note))}</p>` : ''}
      ${guard ? `<p class="err">${esc(scrub(guard))}</p>` : ''}
      <label class="f" for="vk-res-action">What was done (required)<textarea id="vk-res-action" name="action" maxlength="1000"></textarea></label>
      <label class="f" for="vk-res-ev">Evidence (optional)<input id="vk-res-ev" name="evidence" maxlength="300" autocomplete="off" placeholder="A file name or reference"></label>
      ${x.secondary ? `<p class="hint">A different person in the ${esc(x.secondary)} role then closes it as secondary reviewer. It keeps blocking until then.</p>` : ''}`,
    'Resolve', (fd) => {
      const action = String(fd.action || '').trim();
      if (!action) return 'Write what was done.';
      return finish(ENGINE.resolve(x, ACTOR.me(), { action, evidence: String(fd.evidence || '').trim() || null }), 'Resolved ' + x.id + ' (' + x.code + ').');
    });
  }
  // Close a resolved exception as the secondary reviewer (a different person from the resolver).
  function actClose(t) {
    const x = ENGINE.exById(t.dataset.ex);
    if (!x) { toast('That exception is no longer here.'); render(); return; }
    const c = x.caseId ? ENGINE.caseById(x.caseId) : null;
    modal('Close ' + x.id + ' as secondary reviewer', `<p class="row">${codeChip(x.code)}${sevChip(x.sev)}<strong>${esc(x.title)}</strong></p>
      ${facts([['Case', c ? esc(c.id) + ' · ' + esc(clientName(c.clientId)) : 'No case'], ['Resolved by', esc(x.resolvedBy || '')], ['What was done', esc(scrub(x.resolution || ''))], ['Evidence', esc(scrub(x.evidence || 'None given'))]])}
      <label class="f" for="vk-close-note">Review note (optional)<input id="vk-close-note" name="note" maxlength="300" autocomplete="off"></label>
      <p class="hint">Close it only if the resolution meets the register’s criterion. You must not be the person who resolved it.</p>`,
    'Close exception', (fd) => finish(ENGINE.close(x, ACTOR.me(), { note: String(fd.note || '').trim() }), 'Closed ' + x.id + ' (' + x.code + ').'));
  }
  // The register gives some codes to a platform role (AI-07, AI-06, VER-02) or a platform secondary reviewer (TAX-06). The platform
  // team works outside the firm, so the preview simulates it: anyone may press the button, and ENGINE records the simulated
  // ACTOR.platform(<that role>), never the signed-in person.
  const isPlatform = (role) => /^Platform /.test(String(role || ''));
  const SIM_NOTE = 'In real life the platform team does this outside Operon. Here it is simulated: Operon records it as the platform team, not as you.';
  function actPlatResolve(t) {
    const x = ENGINE.exById(t.dataset.ex);
    if (!x || !isPlatform(x.owner)) { toast('That exception is no longer here.'); render(); return; }
    const c = x.caseId ? ENGINE.caseById(x.caseId) : null; const def = CODE[x.code] || {};
    const guard = ENGINE.resolveGuard(c, x);
    modal('Resolve ' + x.id + ' as the simulated platform team', `<p class="row">${codeChip(x.code)}${sevChip(x.sev)}<strong>${esc(x.title)}</strong></p>
      ${facts([['Case', c ? esc(c.id) + ' · ' + esc(clientName(c.clientId)) : 'No case'], ['Owner', esc(x.owner + ' (simulated platform team)')], ['Resolved when', esc(def.resolution || '')]])}
      ${guard ? `<p class="err">${esc(scrub(guard))}</p>` : ''}
      <label class="f" for="vk-pres-action">What the platform team did (required)<textarea id="vk-pres-action" name="action" maxlength="1000"></textarea></label>
      <label class="f" for="vk-pres-ev">Evidence (optional)<input id="vk-pres-ev" name="evidence" maxlength="300" autocomplete="off" placeholder="A file name or reference"></label>
      <p class="hint">${esc(SIM_NOTE)}${x.secondary ? esc(' A ' + x.secondary + ' then closes it as secondary reviewer.') : ''}</p>`,
    'Resolve as the platform team', (fd) => {
      const action = String(fd.action || '').trim();
      if (!action) return 'Write what the platform team did.';
      return finish(ENGINE.resolve(x, ACTOR.platform(x.owner), { action, evidence: String(fd.evidence || '').trim() || null }), 'Resolved ' + x.id + ' (' + x.code + ') as the simulated ' + x.owner + '.');
    });
  }
  function actPlatClose(t) {
    const x = ENGINE.exById(t.dataset.ex);
    if (!x || !isPlatform(x.secondary)) { toast('That exception is no longer here.'); render(); return; }
    const c = x.caseId ? ENGINE.caseById(x.caseId) : null;
    modal('Close ' + x.id + ' as the simulated platform team', `<p class="row">${codeChip(x.code)}${sevChip(x.sev)}<strong>${esc(x.title)}</strong></p>
      ${facts([['Case', c ? esc(c.id) + ' · ' + esc(clientName(c.clientId)) : 'No case'], ['Secondary reviewer', esc(x.secondary + ' (simulated platform team)')], ['Resolved by', esc(x.resolvedBy || '')], ['What was done', esc(scrub(x.resolution || ''))]])}
      <label class="f" for="vk-pclose-note">Review note (optional)<input id="vk-pclose-note" name="note" maxlength="300" autocomplete="off"></label>
      <p class="hint">${esc(SIM_NOTE)}</p>`,
    'Close as the platform team', (fd) => finish(ENGINE.close(x, ACTOR.platform(x.secondary), { note: String(fd.note || '').trim() }), 'Closed ' + x.id + ' (' + x.code + ') as the simulated ' + x.secondary + '.'));
  }
  Object.assign(ACT, { 'vk.release': actRelease, 'vk.resolve': actResolve, 'vk.close': actClose, 'vk.platResolve': actPlatResolve, 'vk.platClose': actPlatClose });

  // Buttons for the shared actions. A row from waitingGates() or myExceptions() picks the right one; locked buttons say why.
  function releaseBtn(row) {
    if (row.kind === 'incident') return safeId(row.inc.id) ? `<a class="btn sm" href="#incident-${row.inc.id}">Open ${esc(row.inc.id)}</a>` : '';
    const label = row.kind === 'g18' ? 'Sign G18' : 'Release ' + row.g;
    const data = { case: row.c.id, gate: row.g }; if (row.tx) data.tx = row.tx.id;
    return btn(label, 'vk.release', { cls: 'sm' + (row.ready ? ' primary' : ''), data, title: row.ready ? '' : row.why });
  }
  // Resolve, or Close as the secondary reviewer. Only the role that may act gets a live button; everyone else sees a lock saying
  // who acts. Platform-owned codes get the simulated platform team's button instead (any role may press it; ENGINE records the
  // platform actor).
  function exceptionBtn(row) {
    const x = row.x; const a = ACTOR.me();
    if (row.need === 'close') {
      if (x.status !== 'resolved') return '';
      if (!x.secondary) return `<span class="lock">${I.hourglass}${esc('Closes by itself when its gates are done')}</span>`;
      if (isPlatform(x.secondary)) return btn('Close as the simulated platform team', 'vk.platClose', { cls: 'sm', data: { ex: x.id }, title: 'The ' + x.secondary + ' closes it; the preview simulates the platform team' });
      const lock = x.secondary !== a.role ? 'Closed by the ' + x.secondary : (x.resolvedById === a.id ? 'You resolved it; someone else closes it' : null);
      return btn('Close', 'vk.close', { cls: 'sm', data: { ex: x.id }, lock });
    }
    const guard = ENGINE.resolveGuard(x.caseId ? ENGINE.caseById(x.caseId) : null, x);
    if (isPlatform(x.owner)) {
      if (guard) return `<span class="lock">${I.hourglass}${esc(scrub(guard))}</span>`;
      return btn('Resolve as the simulated platform team', 'vk.platResolve', { cls: 'sm', data: { ex: x.id }, title: 'The ' + x.owner + ' resolves it; the preview simulates the platform team' });
    }
    const whoWhy = ENGINE.resolverCheck(x, a);
    if (whoWhy) return `<span class="lock">${I.lock}${esc(whoWhy)}</span>`;
    if (guard) return `<span class="lock">${I.hourglass}${esc(scrub(guard))}</span>`;
    return btn('Resolve', 'vk.resolve', { cls: 'sm', data: { ex: x.id } });
  }

  return {
    safeId, link, caseLink, clientLink, exLink, caseWho, clientName, who,
    maskId, maskTaxRef, idHtml, taxRefHtml, scrub,
    money, toDay, date, dateShort, when, datebox, bizLeft, leftText, leftPill,
    pill, sevChip, codeChip, gateChip, gateStateWord, gateName, exStatus,
    page, section, table, empty, list, tracker, facts,
    done, ownedBy, waitingGates, myExceptions, deadlines, releaseBtn, exceptionBtn,
  };
})();

/* ===================== itr12/views-cases.js ===================== */
/* Cases: the 2026 ITR12 board. Columns are the phases in BOARD (workflow.js); a card sits in ENGINE.columnOf(c). Incidents are a
   badge on the card, not a column. There is also a table view sorted by the nearest deadline.
   Moving a card is a request to ENGINE, never a change made here:
     - forward (drag to the next column, or the card's "Next stage" button): ENGINE.dragForward(c, ACTOR.me(), toKey). It passes
       only for the gate owner with nothing blocking; otherwise the card snaps back and the open codes are listed. Client gates and
       G18 never pass by a staff drag.
     - backward (drag to an earlier column, or "Back for rework"): a reason, then ENGINE.returnForRework.
   The engine audits every attempt, refusals included. Card dragging uses the Sortable library the build loads for the review
   layer, in its own group; it is off while the review layer's page arranging is on, and rendering waits until a drag ends.
   Shared with views-case.js: CASES_BOARD.forward(c), CASES_BOARD.rework(c, toKey) and the ACT handlers 'cases.fwd' and 'cases.back'. */
const CASES_BOARD = (() => {
  const MODE_KEY = 'op-cases-view';
  let mode = LS.get(MODE_KEY) === 'table' ? 'table' : 'board';  // a per-viewer convenience, never shared state
  let last = null;       // the latest move on this screen: { id, ok, text, codes: [exception or code] }
  let sortables = [];
  let dragging = false;
  const NEAR = 10;  // cards show a deadline within this many business days (or overdue); the table shows them all

  const colIdx = (k) => BOARD.findIndex((b) => b.key === k);
  const colLabel = (k) => { const b = BOARD[colIdx(k)]; return b ? b.label : String(k || ''); };
  const applies = (c, b) => b.gates.some((g) => ENGINE.applies(c, g));
  // The next column a forward move asks for: the engine skips columns whose gates do not apply to this case.
  function nextCol(c) {
    const i = colIdx(ENGINE.columnOf(c));
    for (let j = i + 1; j < BOARD.length; j++) if (applies(c, BOARD[j])) return BOARD[j].key;
    return null;
  }
  // Columns a card can be returned to: earlier ones whose gates apply to this case.
  const earlierCols = (c) => BOARD.slice(0, Math.max(0, colIdx(ENGINE.columnOf(c)))).filter((b) => applies(c, b));
  const openEx = (c) => ENGINE.exOf(c).filter((x) => ENGINE.isOpen(x)).sort((p, q) => (SEV.indexOf(p.sev) - SEV.indexOf(q.sev)) || (p.at - q.at));
  const incidentsOf = (c) => S.incidents.filter((i) => i.caseId === c.id && i.status === 'open');
  const submitted = (c) => !!(c.submission && c.submission.ok);

  // Who releases the case's next gate, in a few words.
  function waitingOn(c, g) {
    if (!g) return 'Nothing: every gate is done';
    const r = RELEASE[g];
    switch (r.by) {
      case 'client': return 'The client, in the PaperSync portal';
      case 'system': return 'Operon’s own checks';
      case 'ai': return 'AI check (simulated) or the ' + r.role;
      case 'dual': return 'Two sign-offs on the SARS link';
      default: return 'The ' + r.role;
    }
  }
  // The nearest deadline per case, from the kit's deadline list (overdue included).
  function deadlineMap() {
    const m = {};
    VK.deadlines({ days: 100000 }).forEach((d) => { if (d.c && !m[d.c.id]) m[d.c.id] = d; });
    return m;
  }

  /* ---------- moves (each one goes through ENGINE with ACTOR.me()) ---------- */
  function codeChips(list) {
    return list.length ? `<span class="vk-codes">${list.map((x) => (typeof x === 'string' ? VK.codeChip(x) : VK.codeChip(x.code, x) + VK.sevChip(x.sev, { short: true }))).join(' ')}</span>` : '';
  }
  // toKey: the column a card was dropped in (the next one by default). A drop further on is still sent: the engine refuses it.
  function forward(c, toKey) {
    if (!c) { toast('That case is no longer here.'); render(); return false; }
    const from = ENGINE.columnOf(c);
    const r = ENGINE.dragForward(c, ACTOR.me(), toKey || nextCol(c) || undefined);
    let msg = '';
    if (r.ok) {
      msg = r.awaiting ? 'Released for ' + c.id + '. The card moves when SARS confirms the transaction (G18 on the SARS link).'
        : 'Moved ' + c.id + ' from ' + colLabel(from) + ' to ' + colLabel(r.to || ENGINE.columnOf(c)) + '.';
    }
    // Refused: list the open codes that stop it (the engine returns the blockers, or just their codes for G07).
    const blockers = r.ok ? [] : (r.blockers && r.blockers.length ? r.blockers : (r.codes || []).map((code) => ENGINE.openOf(c, code)[0] || code));
    last = { id: c.id, ok: r.ok, text: r.ok ? msg : c.id + ' stays in ' + colLabel(from) + '. ' + r.why, codes: blockers };
    return VK.done(r, msg);
  }
  // Return for rework: a modal asks where to and why, then ENGINE.returnForRework. Cancelling leaves the card where it was.
  function rework(c, toKey) {
    if (!c) { toast('That case is no longer here.'); render(); return; }
    const cols = earlierCols(c);
    const from = ENGINE.columnOf(c);
    // Nowhere earlier to go, or the return is already submitted: no reason can help, so the engine refuses (and audits) straight away.
    if (!cols.length || submitted(c)) {
      const r = ENGINE.returnForRework(c, ACTOR.me(), toKey || (cols.length ? cols[cols.length - 1].key : from), '');
      last = { id: c.id, ok: false, text: c.id + ' stays in ' + colLabel(from) + '. ' + r.why, codes: [] };
      VK.done(r, '');
      return;
    }
    const pick = cols.some((b) => b.key === toKey) ? toKey : cols[cols.length - 1].key;
    const frozen = c.frozen ? ' The version is frozen, so VER-01 is raised.' : '';
    const approved = ENGINE.currentApproval(c) ? ' The client’s approval is superseded: they approve again in the PaperSync portal.' : '';
    modal('Return ' + c.id + ' for rework', `${VK.facts([['Case', VK.caseWho(c)], ['Now in', esc(colLabel(from))]])}
      <label class="f" for="cb-rw-to">Return it to<select id="cb-rw-to" name="to">${cols.map((b) => `<option value="${esc(b.key)}"${b.key === pick ? ' selected' : ''}>${esc(b.label + ' (' + b.gates.join(', ') + ')')}</option>`).join('')}</select></label>
      <label class="f" for="cb-rw-reason">Reason (required)<textarea id="cb-rw-reason" name="reason" maxlength="500"></textarea></label>
      <p class="hint">${esc('Rework re-opens the gates from that stage on and holds the first one for the Tax Consultant.' + approved + frozen + ' Operon records the reason in the audit trail.')}</p>`,
    'Return for rework', (fd) => {
      const reason = String(fd.reason || '').trim();
      if (!reason) return 'Write the reason for the rework.';
      const r = ENGINE.returnForRework(c, ACTOR.me(), String(fd.to || ''), reason);
      last = { id: c.id, ok: r.ok, text: r.ok ? 'Returned ' + c.id + ' to ' + colLabel(r.to) + ' for rework.' : c.id + ' stays in ' + colLabel(from) + '. ' + r.why, codes: [] };
      if (!r.ok) { render(); return 'Not done: ' + r.why; }
      return () => VK.done(r, 'Returned ' + c.id + ' to ' + colLabel(r.to) + ' for rework.');
    });
  }
  // A card dropped in another column (Sortable). Forward asks to pass the gates; backward asks for a reason.
  function drop(id, toKey) {
    const c = ENGINE.caseById(id);
    if (!c || colIdx(toKey) < 0) { render(); return; }
    const fi = colIdx(ENGINE.columnOf(c)); const ti = colIdx(toKey);
    if (ti === fi) { render(); return; }
    if (ti > fi) { forward(c, toKey); return; }
    render();  // the card snaps back while the reason is asked for
    rework(c, toKey);
  }

  /* ---------- card dragging (Sortable, its own group) ---------- */
  const arranging = () => (typeof RV !== 'undefined' && RV && RV.arranging) || document.body.classList.contains('rv-arranging');
  // While a card is dragged, render() must wait: REVIEW.hold() makes REVIEW.busy() true, so render() only marks REVIEW.pending;
  // releasing the hold renders what was deferred.
  function hold(on) {
    if (dragging === on) return;
    dragging = on;
    document.body.classList.toggle('cb-dragging', on);
    if (typeof REVIEW !== 'undefined' && REVIEW.hold) REVIEW.hold(on);
  }
  function destroy() { sortables.forEach((s) => { try { s.destroy(); } catch (e) { /* detached */ } }); sortables = []; }
  function init() {
    destroy();
    if (dragging || arranging() || !window.Sortable || typeof window.Sortable.create !== 'function') return;
    $$('#app .cb-list').forEach((ul) => {
      try {
        sortables.push(window.Sortable.create(ul, {
          group: { name: 'cases-board', pull: true, put: true }, sort: false, draggable: '.cb-card',
          filter: (evt) => arranging() || !!(evt.target && evt.target.closest && evt.target.closest('a,button,select,input,textarea,.lock')), preventOnFilter: false,

      sars.forEach((f) => {
        const mine = lines.filter((l) => l.field === f).reduce((a, l) => a + l.amount, 0);
        if (got.some(([k]) => k === f) && Math.abs(mine - pre[f]) > S.policy.materiality.amount) find.push([(CALC.FIELDS[f] || {}).label + ' differs from SARS', 'bad']);
      });
      // "Consistent" only when the client answered and nothing else is flagged or open on the topic.
      if (!find.length && !xs.length) find.push(['Consistent', 'ok']);
      return [
        `<strong>${esc(q.label)}</strong>`,
        prior ? VK.pill('Declared', 'info') : '<span class="muted">Not declared</span>',
        sars.length ? sars.map((f) => `<div class="small">${esc((CALC.FIELDS[f] || {}).label || f)}: ${VK.money(pre[f])}</div>`).join('') : '<span class="muted">Nothing</span>',
        askedLast ? VK.pill('Requested', 'info') : '<span class="muted">Not requested</span>',
        yes(ans[q.key]),
        (docs.length ? docs.map((d) => `<div class="small">${esc(VK.scrub(d.name))} ${docStatus(d)}</div>`).join('') : '<span class="muted">None</span>')
          + got.map(([f, ls]) => `<div class="small muted">${esc((CALC.FIELDS[f] || {}).label || f)}: ${VK.money(ls.reduce((a, l) => a + l.amount, 0))}</div>`).join(''),
        find.map(([t, tone]) => VK.pill(t, tone)).join(' ')
          + xs.map((x) => `<div class="small">${VK.codeChip(x.code, x)} ${esc(VK.scrub(x.note || x.title))}</div>`).join(''),
      ];
    });
    const intro = 'Step 6: Operon’s AI (simulated) compares four sources for each topic: ' + SOURCES.map((t, i) => (i + 1) + '. ' + t.charAt(0).toLowerCase() + t.slice(1)).join('; ')
      + '. The documents and their extracted values are the evidence. The last column is the comparison, with any open exception on the topic; it says “Consistent” only when the client has answered and nothing is flagged or open. '
      + (req.kept ? '' : 'The preview keeps no separate record of last year’s document request, so it shows the documents last year’s return needed. ')
      + (c.prepop ? 'Pre-populated data ' + (c.prepop.ref || '') + ' received ' + fWhen(c.prepop.at) + '. ' : 'No pre-populated data has arrived from SARS (simulated). ')
      + (c.inputs && c.inputs.prior && typeof c.inputs.prior.taxableIncome === 'number' ? 'Last year’s taxable income: ' + CALC.rand(c.inputs.prior.taxableIncome) + '.' : '');
    return VK.section('cases-case-sources', 'Four-source analysis', VK.table([{ label: 'Topic' }, { label: 'Last year’s ITR12' }, { label: 'SARS pre-populated' }, { label: 'Last year’s document request' }, { label: 'This year’s questionnaire' }, { label: 'Evidence: documents and values' }, { label: 'Comparison' }], rows,
      { caption: 'Four-source analysis for ' + c.id, empty: 'No topics yet: the questionnaire has not been answered.' }), { intro: esc(intro) });
  }

  /* ---------- personalised checklist ---------- */
  const ITEM_STATE = { validated: ['Received and checked', 'ok'], held: ['Held by an exception', 'bad'], requested: ['Requested', 'warn'], na: ['Not available (approved)', ''] };
  function checklistBlock(c) {
    const rows = c.items.map((it) => {
      const st = ENGINE.itemState(c, it); const [word, tone] = ITEM_STATE[st] || [st, ''];
      const docs = c.docs.filter((d) => d.itemId === it.id);
      let act = '';
      if (it.na === 'requested') act = btn('Approve N/A', 'cases.na', { cls: 'sm', data: { case: c.id, item: it.id } });
      return [`<strong>${esc(it.label)}</strong><div class="small muted mono">${esc(it.id)}</div>`, VK.pill(word, tone),
        docs.length ? docs.map((d) => `<div class="small">${esc(VK.scrub(d.name))} ${docStatus(d)}</div>`).join('') : '<span class="muted">None yet</span>',
        it.naReason ? `<div class="small">${esc(VK.scrub('Client: ' + it.naReason))}</div>${it.na === 'requested' ? '<div class="small muted">Waiting for the Tax Consultant</div>' : ''}` : '<span class="muted">—</span>', act];
    });
    // Each gate checklist item is ticked by the person who owns that gate (RELEASE in workflow.js); others see who does it.
    const reqs = Object.keys(c.req).sort().flatMap((g) => c.req[g].map((r) => {
      const owner = (RELEASE[g] || {}).role;
      const act = r.done ? '' : `<span class="cs-reqact">${btn('Mark done', 'cases.req', { cls: 'sm', data: { case: c.id, gate: g, key: r.key }, lock: owner && S.role !== owner ? 'Done by the ' + owner + ', who owns ' + g : null })}</span>`;
      return `<div class="vk-row cs-req"><span class="vk-gate vk-g-${r.done ? 'done' : 'idle'}"><b>${esc(g)}</b></span><div class="vk-row-b"><div class="vk-row-t">${esc(r.label)}</div><div class="vk-meta">${r.done ? `${VK.pill('Done', 'ok')}<span>${esc(VK.who(r.by))}</span>${VK.when(r.at)}` : VK.pill('To do', 'warn')}</div></div>${act}</div>`;
    }));
    return VK.section('cases-case-checklist', 'Personalised checklist', VK.table([{ label: 'Item' }, { label: 'State' }, { label: 'Documents' }, { label: 'Not available' }, { label: '', cls: 'vk-act' }], rows,
      { caption: 'Checklist for ' + c.id, empty: 'Nothing has been requested yet.' })
      + `<h3 class="cs-h3">Gate checklists</h3>` + VK.list(reqs, { empty: 'No gate checklist items.' }), {
      count: c.items.length,
      intro: esc('Built from the questionnaire and last year’s return: each yes adds the document it needs. The client uploads in the PaperSync portal (simulated) or asks to mark an item not available, which the Tax Consultant approves. Each gate checklist item is ticked by the owner of that gate; the gate cannot be released until its items are done.'),
    });
  }

  /* ---------- documents and lineage ---------- */
  // The calculator fields a document of this kind can feed (CALC.FIELDS[...].kinds).
  const fieldsFor = (kind) => Object.keys(CALC.FIELDS).filter((k) => (CALC.FIELDS[k].kinds || []).includes(kind));
  function valuesBtn(c, d) {
    if (d.status !== 'validated' || !fieldsFor(d.kind).length) return '';
    const n = ((c.inputs && c.inputs.lines) || []).filter((l) => l.docId === d.id).length;
    const lock = tcLock() || (c.submission && c.submission.ok ? 'The return is submitted; a correction goes through G15' : null);
    return btn(n ? 'Change values' : 'Record values', 'cases.values', { cls: 'sm' + (n ? '' : ' primary'), data: { case: c.id, doc: d.id }, lock });
  }
  function documentsBlock(c) {
    const docs = c.docs.map((d) => {
      const it = c.items.find((x) => x.id === d.itemId);
      const kind = d.kind ? (DOC_KINDS.find((k) => k.kind === d.kind) || {}).label || d.kind : 'Not classified';
      const n = ((c.inputs && c.inputs.lines) || []).filter((l) => l.docId === d.id).length;
      return [`<strong>${esc(VK.scrub(d.name))}</strong><div class="small muted mono">${esc(d.id)} · ${esc(Math.round(d.size / 1024) + ' KB')}</div>`, esc(it ? it.label : '—'),
        `${VK.when(d.at)}<div class="small muted">${esc(VK.who(d.by))}</div>`, docStatus(d),
        `<div class="small">${esc(kind)}</div>${d.confidence != null ? `<div class="small muted">${esc('Confidence ' + Math.round(d.confidence * 100) + '%')}</div>` : ''}`,
        `<span class="mono small" title="${esc('SHA-256 ' + (d.hash || ''))}">${esc(short(d.hash))}</span>`,
        `${n ? `<div class="small">${esc(plural(n, 'value'))}</div>` : ''}${valuesBtn(c, d)}`];
    });
    const lin = CALC.lineage(c).map((l) => [`<span class="mono">${esc(l.line)}</span>`, l.file ? `${esc(VK.scrub(l.file))}${l.doc ? `<div class="small muted mono">${esc(l.doc)}</div>` : ''}` : '<span class="muted">No source</span>',
      esc(VK.scrub(l.ref)), VK.money(l.amount), esc(l.category), `<span class="small">${esc((CALC.FIELDS[l.field] || {}).label || l.field)}</span>`,
      l.judgement ? (l.decided ? `${VK.pill('Decided', 'ok')}<div class="small">${esc(VK.scrub(l.decided.rationale))}</div>` : `${VK.pill('Judgement: ' + l.judgement, 'warn')}`) : '<span class="muted">Rules</span>']);
    return VK.section('cases-case-documents', 'Documents and lineage', VK.table([{ label: 'Document' }, { label: 'Checklist item' }, { label: 'Uploaded' }, { label: 'Check' }, { label: 'AI reading (simulated)' }, { label: 'Hash' }, { label: 'Extracted values', cls: 'vk-act' }], docs,
      { caption: 'Documents on ' + c.id, empty: 'No documents yet.' })
      + `<h3 class="cs-h3">Extracted values and where they came from</h3>`
      + VK.table([{ label: 'Value' }, { label: 'Document' }, { label: 'Reference' }, { label: 'Amount' }, { label: 'Tax category' }, { label: 'Calculator field' }, { label: 'Treatment' }], lin,
        { caption: 'Lineage for ' + c.id, empty: 'No values extracted yet.' }), {
      count: c.docs.length,
      intro: esc('The AI checks each upload by its name and size only (simulated): file contents are never read, so the Tax Consultant records the values read from each checked document. Lineage runs from the document to the extracted value, its tax category and the calculator field.'),
    });
  }

  /* ---------- calculation pack ---------- */
  function calcBlock(c) {
    const k = c.calc; const canCalc = !!c.inputs;
    const recalc = canCalc ? btn('Recalculate', 'cases.recalc', { cls: 'sm', data: { case: c.id }, lock: tcLock() }) : '';
    if (!k) {
      return VK.section('cases-case-calc', 'Calculation pack', VK.empty(canCalc ? 'Not calculated yet.' : 'No calculation yet: no values have been extracted.',
        canCalc ? null : { html: '<p class="small muted">The Tax Consultant records the values from each checked document under Documents and lineage, then recalculates.</p>' }), { actions: recalc });
    }
    const summary = k.summary || {}; const errors = k.errors || [];
    const sum = ITA34_FIELDS.map((f) => [f.label, VK.money(summary[f.key])]);
    const lines = (k.lines || []).map((l) => ({ cls: ['taxableIncome', 'result', 'liability'].includes(l.key) ? 'cs-total' : '',
      cells: [esc(l.label), VK.money(l.amount), `<span class="small">${esc(l.basis || '')}</span>`, l.from && l.from.length ? `<span class="mono small">${esc(l.from.join(', '))}</span>` : '<span class="muted">—</span>'] }));
    const inputLine = (id) => ((c.inputs && c.inputs.lines) || []).find((l) => l.id === id);
    const pend = (k.pending || []).map((p) => {
      const l = inputLine(p.line);
      const decided = l && l.decided;
      return [`<span class="mono">${esc(p.line)}</span>`, esc(p.label), VK.money(p.amount), VK.codeChip(p.code, ENGINE.openOf(c, p.code)[0]),
        decided ? `${VK.pill('Decided: recalculate to use it', 'info')}<div class="small">${esc(VK.scrub(decided.rationale))}</div>` : '<span class="muted">Left out until decided</span>',
        p.field ? btn('Decide', 'cases.decide', { cls: 'sm' + (decided ? '' : ' primary'), data: { case: c.id, line: p.line }, lock: tcLock() }) : ''];
    });
    const sch = c.schedules || {}; const schRows = [];
    if (sch.interest && sch.interest.gross) schRows.push(['Interest', 'Gross ' + CALC.rand(sch.interest.gross) + ', exempt ' + CALC.rand(sch.interest.exempt) + ' (limit ' + CALC.rand(sch.interest.limit) + '), taxable ' + CALC.rand(sch.interest.taxable)]);
    if (sch.retirement && sch.retirement.contributions) schRows.push(['Retirement (s11F)', 'Contributions ' + CALC.rand(sch.retirement.contributions) + ', deducted ' + CALC.rand(sch.retirement.deduction) + ', carried forward ' + CALC.rand(sch.retirement.carriedForward)]);
    if (sch.donations && sch.donations.donated) schRows.push(['Donations (s18A)', 'Donated ' + CALC.rand(sch.donations.donated) + ', limit ' + CALC.rand(sch.donations.limit) + ', deducted ' + CALC.rand(sch.donations.deduction)]);
    if (sch.medical && (sch.medical.fees || sch.medical.expenses)) schRows.push(['Medical (s6A, s6B)', sch.medical.months + ' months; fees ' + CALC.rand(sch.medical.fees) + ', expenses ' + CALC.rand(sch.medical.expenses) + '; credits ' + CALC.rand(sch.medical.s6aUsed) + ' + ' + CALC.rand(sch.medical.s6bUsed)]);
    if (sch.cgt && (sch.cgt.aggregate || sch.cgt.broughtForward)) schRows.push(['Capital gains', 'Aggregate ' + CALC.rand(sch.cgt.aggregate) + ', taxable ' + CALC.rand(sch.cgt.taxable) + (sch.cgt.lossCarried ? ', loss carried forward ' + CALC.rand(sch.cgt.lossCarried) : '')]);
    if (sch.rental && (sch.rental.income || sch.rental.expenses)) schRows.push(['Rental', 'Income ' + CALC.rand(sch.rental.income) + ', expenses ' + CALC.rand(sch.rental.expenses) + ', net ' + CALC.rand(sch.rental.net)]);
    const rsOk = k.ruleset === S.rulesetVersion;
    const facts = VK.facts([
      ['Ruleset', `<span class="mono">${esc(k.ruleset || '—')}</span> ${rsOk ? VK.pill('Current', 'ok') : VK.pill('Current is ' + S.rulesetVersion, 'bad')}`],
      ['Year and age', esc((k.year || c.year) + ' year of assessment' + (k.age != null ? '; age ' + k.age + ' at the year end' : ''))],
      ['Version', esc(ENGINE.vN(c) ? 'Version ' + ENGINE.vN(c) : 'None') + (c.rerun ? ' ' + VK.pill('Rerun needed', 'warn') : '')],
      ['Last year', k.variance ? esc('Taxable income ' + CALC.rand(k.variance.prior) + ' last year; change ' + CALC.rand(k.variance.diff) + ' (' + Math.round(k.variance.ratio * 1000) / 10 + '%)') + (k.variance.material ? ' ' + VK.pill('Material', 'warn') : '') : '<span class="muted">No comparison</span>'],
      ['Reconciliation', !c.recon ? '<span class="muted">Not checked yet</span>' : c.recon.ok ? VK.pill('Documents, values, calculation and ITR12 agree', 'ok') : `${VK.pill('Fails', 'bad')}<div class="small">${esc(c.recon.issues.join('; '))}</div>`],
    ]);
    const body = facts + (errors.length ? `<p class="err">${esc(errors.join('; '))}</p>` : '')
      + `<div class="cs-split"><div><h3 class="cs-h3">Summary</h3>${VK.facts(sum.map(([a, b]) => [a, b]))}</div>`
      + `<div><h3 class="cs-h3">Schedules</h3>${schRows.length ? VK.facts(schRows.map(([a, b]) => [a, esc(b)])) : '<p class="muted small">No schedules beyond employment.</p>'}</div></div>`
      + `<h3 class="cs-h3">Judgement items for the Tax Consultant</h3>`
      + VK.table([{ label: 'Value' }, { label: 'Item' }, { label: 'Amount' }, { label: 'Code' }, { label: 'Decision' }, { label: '', cls: 'vk-act' }], pend, { caption: 'Judgement items on ' + c.id, empty: 'No judgement items are waiting.' })
      + `<h3 class="cs-h3">Calculation lines</h3>`
      + VK.table([{ label: 'Line' }, { label: 'Amount' }, { label: 'Basis' }, { label: 'From values' }], lines, { caption: 'Calculation lines for ' + c.id });
    return VK.section('cases-case-calc', 'Calculation pack', body, {
      intro: esc('Calculated by Operon’s calculator on the 2026 SARS rates from the extracted values. Judgement items (home office, travel, foreign income, trusts, trade) are left out until the Tax Consultant decides them; recalculating records a new version.'),
      actions: recalc,
    });
  }

  /* ---------- client approval and versions ---------- */
  function approvalBlock(c) {
    const ap = c.approval; const v = ENGINE.curVersion(c); const problem = ENGINE.approvalProblem(c);
    const apv = ap ? c.versions.find((x) => x.n === ap.version) : null;
    const bound = ap && apv ? (ap.calc === apv.calc && ap.itr12 === apv.itr12) : false;
    const facts = VK.facts([
      ['Status', problem ? VK.pill(problem, ap ? 'warn' : '') : VK.pill('Approved: version ' + ap.version, 'ok')],
      ['Approved', ap ? `${VK.when(ap.at)} <span class="small muted">${esc(VK.who(ap.by))}</span>` : '<span class="muted">Not yet</span>'],
      ['Bound to', ap ? `<span class="mono small">${esc('calc ' + short(ap.calc) + ' · ITR12 ' + short(ap.itr12))}</span> ${bound ? VK.pill('Matches version ' + ap.version, 'ok') : VK.pill('Does not match', 'bad')}` : '<span class="muted">—</span>'],
      ['Declaration', ap ? (ap.declaration === DECLARATION ? VK.pill('Confirmed', 'ok') : VK.pill('Not confirmed', 'bad')) : '<span class="muted">—</span>'],
      ['Withdrawn or superseded', ap ? esc(ap.withdrawn ? 'Withdrawn' : ap.superseded ? 'Superseded by a later version' : 'No') : '<span class="muted">—</span>'],
      ['Frozen for submission', c.frozen ? esc('Version ' + c.frozen.version + ', ') + VK.when(c.frozen.at) : '<span class="muted">Not frozen</span>'],
    ]);
    const drift = ENGINE.drift(c);
    const verCodes = ENGINE.exOf(c).filter((x) => /^VER-/.test(x.code));
    const rows = c.versions.slice().reverse().map((x) => [esc('Version ' + x.n) + (v && x.n === v.n ? ' ' + VK.pill('Current', 'info') : ''), `${VK.when(x.at)}<div class="small muted">${esc(VK.who(x.by))}</div>`,
      esc(VK.scrub(x.reason)), `<span class="mono small" title="${esc('calc ' + x.calc + ' / ITR12 ' + x.itr12)}">${esc(short(x.calc))}</span>`,
      ap && ap.version === x.n ? VK.pill(ap.withdrawn ? 'Withdrawn' : ap.superseded ? 'Superseded' : 'Approved', ap.withdrawn || ap.superseded ? 'warn' : 'ok') : '<span class="muted">—</span>']);
    return VK.section('cases-case-approval', 'Client approval and versions', facts
      + (drift.length ? `<p class="err">${esc('The record differs from version ' + ENGINE.vN(c) + ' (' + drift.join(', ') + '): VER-02 is raised.')}</p>` : '')
      + (verCodes.length ? `<div class="vk-codes"><span class="small muted">Version codes:</span> ${verCodes.map((x) => VK.codeChip(x.code, x) + VK.exStatus(x)).join(' ')}</div>` : '')
      + VK.table([{ label: 'Version' }, { label: 'Recorded' }, { label: 'Reason' }, { label: 'Calculation hash' }, { label: 'Client approval' }], rows, { caption: 'Versions of ' + c.id, empty: 'No versions yet.' }), {
      count: c.versions.length,
      intro: esc('The client approves one version in the PaperSync portal (simulated), with the declaration. The approval is bound to that version’s hashes: any later version supersedes it and raises VER-01.'),
    });
  }

  /* ---------- SARS transactions ---------- */
  function sarsBlock(c) {
    const txs = S.txs.filter((t) => t.caseId === c.id);
    const rows = txs.map((t) => {
      let act = '';
      if (t.status === 'awaiting G18' && RELEASE.G18.roles.includes(S.role) && !t.signoffs.some((s) => s.role === S.role)) {
        const ready = !ENGINE.g18Checks(t).some((k) => !k.ok) && !ENGINE.g18Blockers(t).length;
        act = VK.releaseBtn({ kind: 'g18', c, g: 'G18', tx: t, ready, why: ready ? '' : 'Not every G18 check passes' });
      }
      return [`<span class="mono">${esc(t.id)}</span>`, `${esc(t.label)}<div class="small muted">${esc('For ' + (t.gate || '—') + (t.version ? ', version ' + t.version : ''))}</div>`,
        txPill(t.status),
        t.signoffs.length ? t.signoffs.map((s) => `<div class="small">${esc(pname(s.id) + ' (' + s.role + ')')}</div>`).join('') : '<span class="muted">None yet</span>',
        `${t.ref ? `<div class="mono small">${esc(t.ref)}</div>` : ''}${t.sentAt ? `<div class="small muted">Sent ${VK.when(t.sentAt)}</div>` : ''}${t.attempts && t.attempts.length ? `<div class="small muted">${esc(plural(t.attempts.length, 'attempt'))}</div>` : ''}` || '<span class="muted">—</span>',
        act];
    });
    const inbound = S.inbound.filter((it) => it.caseId === c.id).map((it) => `<div class="vk-row">${VK.datebox(it.date)}<div class="vk-row-b"><div class="vk-row-t">${esc(it.label)} <span class="mono small">${esc(it.ref || it.id)}</span></div>
      <div class="vk-meta"><span>Received ${VK.date(it.date)}</span>${it.due ? `<span>Due ${VK.date(it.due)}</span>` : ''}<span class="mono" title="${esc('SHA-256 ' + it.hash)}">${esc(short(it.hash))}</span></div></div></div>`);
    const sub = c.submission;
    return VK.section('cases-case-sars', 'SARS transactions', (sub && sub.ok ? `<p class="small">${VK.pill('Submitted', 'ok')} ${esc('Reference ' + sub.ref + ', version ' + sub.version + ', ')}${VK.when(sub.at)}</p>` : '')
      + VK.table([{ label: 'Transaction' }, { label: 'What' }, { label: 'Status' }, { label: 'G18 sign-offs' }, { label: 'SARS reference' }, { label: '', cls: 'vk-act' }], rows, { caption: 'SARS transactions for ' + c.id, empty: 'Nothing has been sent to SARS for this case.' })
      + `<h3 class="cs-h3">Received from SARS</h3>` + VK.list(inbound, { empty: 'Nothing has arrived from SARS for this case.' }), {
      count: txs.length,
      intro: esc('The SARS link is simulated: nothing here connects to SARS. Every outbound item needs G18: two different people and all 8 checks. An unknown status is never retried blindly.'),
      actions: '<a href="#sars">SARS link</a>',
    });
  }

  /* ---------- Declaration Alert, verification and audit, ITA34 and remedies (when they apply) ---------- */
  function draftsList(t) {
    if (!t.drafts || !t.drafts.length) return VK.empty('No answers drafted yet.');
    return `<p class="small muted">${esc('Drafted by ' + (t.draftedBy ? VK.who(t.draftedBy) : 'nobody') + ' ' + (t.draftedAt ? fWhen(t.draftedAt) : '') + '. The Tax Consultant reviews every answer before anything goes to SARS.')}</p>`
      + VK.list(t.drafts.map((d) => `<div class="vk-row-b"><div class="vk-row-t">${esc(d.q)}</div><div>${esc(VK.scrub(d.a))}</div><div class="vk-meta">${d.evidence ? `<span>Evidence: ${esc(VK.scrub(d.evidence))}</span>` : VK.pill('No evidence yet', 'warn')}</div></div>`));
  }
  function daBlock(c) {
    const d = c.da; if (!d) return '';
    const left = VK.bizLeft(d.due);
    const status = d.submitted ? VK.pill('Response sent ' + (d.submitted.ref || ''), 'ok') : d.moved ? VK.pill('Moved to verification ' + (d.moved.ref || ''), 'info') : VK.leftPill(left);
    return VK.section('cases-case-da', 'Declaration Alert', VK.facts([['SARS reference', `<span class="mono">${esc(d.ref)}</span>`], ['Received', VK.date(d.received)], ['Response due', VK.date(d.due) + ' ' + status], ['G10', VK.gateChip(c, 'G10')],
      ['Questions', d.questions.length ? esc(d.questions.join('; ')) : '<span class="muted">None listed</span>']])
      + `<p class="note">${esc(d.window || PERIODS.daWindow.text)} <span class="small">(${esc(PERIODS.daWindow.rule)})</span></p>`
      + `<h3 class="cs-h3">Drafted answers</h3>` + draftsList(d), {
      intro: esc('SARS’s Declaration Questionnaire (the documents call it the Declaration Alert). The AI drafts answers from the case evidence (simulated); the Tax Consultant approves the response at G10.'),
    });
  }
  function tracker21(t) {
    if (t.uploaded) {
      const r = DATES.verification21(DATES.dt(t.uploaded));
      const target = DATES.iso(r.target); const left = VK.bizLeft(target);
      const day = Math.max(0, Math.min(21, 21 - (left == null ? 21 : left)));
      return `<div class="cs-21"><div class="cs-21-bar" role="progressbar" aria-valuemin="0" aria-valuemax="21" aria-valuenow="${day}" aria-label="Business days since upload"><span style="width:${Math.round(day / 21 * 100)}%"></span></div>
        <p class="small">${esc('Uploaded ' + dd(t.uploaded) + ' (Day 0). Day 1 is ' + dd(DATES.iso(r.day1)) + '; SARS’s 21-business-day target is ' + dd(target) + ', follow up from ' + dd(DATES.iso(r.follow)) + '.')} ${VK.leftPill(left)}</p></div>`;
    }
    const r = DATES.verification21(DATES.fromLocal(now()));
    return `<p class="small">${esc('The 21-business-day clock starts when the documents are uploaded (Day 0). They are not uploaded yet: uploaded today, SARS’s target would be ' + dd(DATES.iso(r.target)) + '.')}</p>`;
  }
  function vrfBlock(c) {
    const parts = [['vrf', c.vrf, 'Verification'], ['aud', c.aud, 'Audit or expanded enquiry']].filter(([, t]) => t);
    if (!parts.length) return '';
    const body = parts.map(([k, t, label]) => `<h3 class="cs-h3">${esc(label + ' ' + t.ref)}</h3>` + VK.facts([['Received', VK.date(t.received)], ['Documents due', VK.date(t.due) + ' ' + (t.uploaded ? VK.pill('Uploaded ' + dd(t.uploaded), 'ok') : VK.leftPill(VK.bizLeft(t.due)))],
      ['SARS asked for', t.requests.length ? esc(t.requests.join('; ')) : '<span class="muted">Nothing listed</span>'], ['G11', VK.gateChip(c, 'G11')]])
      + (k === 'vrf' ? tracker21(t) : `<p class="note">${esc(PERIODS.audit.text)}</p>`)
      + `<h4 class="cs-h4">Response pack</h4>` + draftsList(t)).join('');
    return VK.section('cases-case-verification', 'Verification and audit', body, {
      intro: esc('SARS’s service standard: “' + PERIODS.verification.text.replace(/^“|”$/g, '') + '” Business days skip weekends and South African public holidays. The response pack is indexed by the AI (simulated) and released by the Tax Consultant at G11.'),
    });

  function ita34Block(c) {
    if (!(c.ita34 || c.decision || c.remedy || c.outcome)) return '';
    let body = '';
    if (c.ita34) {
      const firm = (c.calc && c.calc.summary) || {}; const sars = c.ita34.values || {};
      const diff = new Set(c.ita34.recon.diffs.map((d) => d.key));
      const rows = ITA34_FIELDS.map((f) => ({ cls: diff.has(f.key) ? 'cs-diff' : '', cells: [esc(f.label), VK.money(firm[f.key]), VK.money(sars[f.key]), VK.money((+sars[f.key] || 0) - (+firm[f.key] || 0)), diff.has(f.key) ? VK.pill('Differs', 'bad') : VK.pill('Agrees', 'ok')] }));
      body += VK.facts([['ITA34', `<span class="mono">${esc(c.ita34.ref)}</span> · ${VK.date(c.ita34.date)}`], ['Comparison', c.ita34.recon.ok ? VK.pill('Agrees with the approved calculation', 'ok') : VK.pill('Differs: ASM-02', 'bad')], ['G12 · G13', VK.gateChip(c, 'G12') + ' ' + VK.gateChip(c, 'G13')]])
        + VK.table([{ label: 'Figure' }, { label: 'Firm’s approved calculation' }, { label: 'SARS ITA34' }, { label: 'Difference' }, { label: 'Result' }], rows, { caption: 'ITA34 against the approved calculation for ' + c.id });
    }
    const dec = c.decision;
    body += `<h3 class="cs-h3">Client decision</h3>` + (dec ? VK.facts([['Decision', esc(dec.choice === 'accept' ? 'Accept the assessment' : dec.choice === 'instruct' ? 'Instruct the firm to dispute it' : dec.choice)], ['When', VK.when(dec.at)], ['Note', dec.note ? esc(VK.scrub(dec.note)) : '<span class="muted">None</span>'], ['G14', VK.gateChip(c, 'G14')]])
      : '<p class="small muted">The client has not decided yet (PaperSync portal, simulated).</p>');
    const rem = c.remedy;
    if (ENGINE.applies(c, 'G15') && !ENGINE.stepDone(c, 'G15')) {
      body += `<div class="cs-remedy">${!rem ? `<p class="small">${esc('The client instructed the firm to act. The Tax Consultant chooses the remedy route and records the grounds and evidence; the client then authorises it in the PaperSync portal.')}</p>` : ''}`
        + btn(rem ? 'Change the remedy or its evidence' : 'Choose the remedy', 'cases.remedy', { cls: 'sm' + (rem ? '' : ' primary'), data: { case: c.id }, lock: tcLock() }) + '</div>';
    }
    if (rem) {
      const p = PERIODS[rem.route];
      body += `<h3 class="cs-h3">Remedy</h3>` + VK.facts([
        ['Route', esc(rem.route === 'advice' ? 'Documented advice, no SARS action' : (SARS_FN[rem.route] || {}).label || rem.route)],
        ['Deadline', rem.deadline ? VK.date(rem.deadline) + ' ' + VK.leftPill(VK.bizLeft(rem.deadline, true)) + ' <span class="small muted">16 Dec to 15 Jan not counted</span>' : esc(rem.basis || 'No deadline')],
        ['Counted from', rem.from ? esc(dd(rem.from) + ' (' + (p ? p.from : rem.basis) + ')') : '<span class="muted">—</span>'],
        ['Rule', esc(rem.rule || (p && p.rule) || '—') + (p && p.note ? `<div class="small muted">${esc(p.note)}</div>` : '')],
        ['Client authority', rem.authority ? VK.pill('Authorised', 'ok') : (rem.route === 'advice' ? '<span class="muted">Not needed</span>' : VK.pill('Not yet', 'warn'))],
        ['Grounds and evidence', rem.evidence ? esc(VK.scrub(rem.evidence)) : VK.pill('Not recorded', 'warn')],

      ]);
    }
    if (c.outcome) body += `<p class="small">${esc('Remedy outcome ' + (c.outcome.ref || '') + ' received ' + dd(c.outcome.date))}</p>`;
    return VK.section('cases-case-ita34', 'ITA34 and remedies', body, {
      intro: esc('The ITA34 is compared figure by figure with the firm’s approved calculation (differences over ' + CALC.rand(S.policy.materiality.amount) + ' raise ASM-02). The client decides in the PaperSync portal; a dispute runs on Chapter 9 business days.'),
    });
  }

  /* ---------- audit trail and retention ---------- */
  function auditBlock(c) {
    const all = S.audit.filter((a) => a.caseId === c.id);
    const items = all.slice(-AUDIT_N).reverse().map((a) => `<div class="vk-row vk-row-log"><span class="vk-when">${VK.when(a.at)}</span><div class="vk-row-b">
      <div class="vk-row-t">${esc(VK.scrub(a.text))}${a.result === 'Refused' ? ' ' + VK.pill('Refused', 'bad') : ''}</div>
      <div class="vk-meta"><span>${esc(VK.who(a.who) + (a.role ? ' · ' + a.role : ''))}</span>${a.gate ? `<span class="mono">${esc(a.gate)}</span>` : ''}${a.code ? `<span class="mono">${esc(a.code)}</span>` : ''}</div></div></div>`);
    return VK.section('cases-case-audit', 'Audit trail', VK.list(items, { empty: 'Nothing recorded for this case yet.' })
      + (all.length > AUDIT_N ? `<p class="small muted">${esc(plural(all.length - AUDIT_N, 'earlier entry', 'earlier entries'))} in the <a href="#audit">audit trail</a>.</p>` : ''), {
      count: all.length,
      intro: esc('Every action and every refusal on this case, newest first. The trail is append-only and hash-chained.'),
      actions: '<a href="#audit">Full audit trail</a>',
    });
  }
  function retentionBlock(c) {
    const r = c.retention;
    const holds = r.holds.map((h) => `<div class="vk-row"><span class="vk-gate vk-g-${h.released ? 'done' : 'blocked'}"><b>${esc(h.id)}</b></span><div class="vk-row-b"><div class="vk-row-t">${esc(h.label)}</div>
      <div class="vk-meta"><span>Since ${VK.when(h.since)}</span>${h.released ? `<span>Released ${VK.when(h.released.at)}</span>` : VK.pill('Active', 'warn')}</div></div></div>`);
    return VK.section('cases-case-retention', 'Retention', VK.facts([
      ['Retained from', r.from ? VK.date(r.from) : '<span class="muted">Starts when the return is submitted</span>'],
      ['Retained until', r.until ? VK.date(r.until) : '<span class="muted">—</span>'],
      ['Review date', r.review ? VK.date(r.review) : '<span class="muted">—</span>'],
      ['G16', VK.gateChip(c, 'G16')],
      ['Archived', c.archived ? VK.pill('Yes: nothing is deleted', 'info') : 'No'],
    ]) + `<h3 class="cs-h3">Holds</h3>` + VK.list(holds, { empty: 'No retention holds.' }), {
      intro: esc(PERIODS.retention.years + ' years from ' + PERIODS.retention.from + ' (' + PERIODS.retention.rule + '). The Records/Compliance Owner releases G16 at the review date; nothing is deleted automatically.'),
    });
  }

  /* ---------- the page ---------- */
  VIEWS.case = (id) => {
    const c = ENGINE.caseById(id);
    if (!c) {
      return VK.page('Case not found', esc('There is no case ' + String(id || '') + ' in this demo firm. It may have been reset.'),
        VK.section('cases-case-missing', 'Where to look', '<p><a href="#cases">All cases</a></p>'), { key: 'cases-case' });
    }
    const cl = ENGINE.clientOf(c);
    const moves = [];
    if (ENGINE.columnOf(c) !== 'closed') moves.push(btn('Next stage', 'cases.fwd', { cls: 'sm', id: 'cs-fwd', data: { case: c.id }, title: 'Ask Operon to pass ' + (ENGINE.currentGate(c) || 'the next gate') }));
    if (CASES_BOARD.earlierCols(c).length && !(c.submission && c.submission.ok)) moves.push(btn('Back for rework', 'cases.back', { cls: 'sm ghost', id: 'cs-back', data: { case: c.id } }));
    const intro = `${esc(c.year + ' ITR12 · ' + CASES_BOARD.colLabel(ENGINE.columnOf(c)) + ' · Tax Consultant ' + pname(c.consultant))}. ${esc('All data is made up; the AI, the PaperSync portal and the SARS link are simulated.')}`;
    const body = summaryBlock(c, cl) + gatesBlock(c) + exceptionsBlock(c) + sourcesBlock(c) + checklistBlock(c) + documentsBlock(c) + calcBlock(c)
      + approvalBlock(c) + sarsBlock(c) + daBlock(c) + vrfBlock(c) + ita34Block(c) + auditBlock(c) + retentionBlock(c);

  /* ---------- this page's actions ---------- */
  const caseOf = (t) => { const c = ENGINE.caseById(t.dataset.case); if (!c) { toast('That case is no longer here.'); render(); } return c; };

  Object.assign(ACT, {
    // The Tax Consultant's decision on a judgement item: the amount and the treatment, authority or rationale (ENGINE.decideItem).
    'cases.decide': (t) => {

      'Recalculate', (fd) => {
        const reason = String(fd.reason || '').trim() || 'Recalculated by the Tax Consultant on ruleset ' + S.rulesetVersion;

        return finish(r, 'Recalculated ' + c.id + ': version ' + (r.version || ENGINE.vN(c)) + '.');
      });
    },
    // Approve the client's reason that a checklist item is not available (ENGINE.approveNa).
    'cases.na': (t) => {
      const c = caseOf(t); if (!c) return;
      VK.done(ENGINE.approveNa(c, t.dataset.item, ACTOR.me()), 'Approved: the item is marked not available.');
    },
    // Tick a gate checklist item (ENGINE.markReq), for example G02's comparison with the SARS registered details or G13's review.
    'cases.req': (t) => {
      const c = caseOf(t); if (!c) return;
      const r = (c.req[t.dataset.gate] || []).find((x) => x.key === t.dataset.key);
      if (!r) { toast('That checklist item is no longer on the case.'); render(); return; }
      VK.done(ENGINE.markReq(c, t.dataset.gate, r.key, ACTOR.me()), 'Done: ' + r.label + ' (' + t.dataset.gate + ').');
    },
    // The values read from one checked document (ENGINE.setInputs): calculator field, reference and amount per value. The other

      const c = caseOf(t); if (!c) return;

      if (!d) { toast('That document is no longer on the case.'); render(); return; }

      const kindLabel = (DOC_KINDS.find((k) => k.kind === d.kind) || {}).label || 'document';
      const med = (c.inputs && c.inputs.medical) || {};
      const opt = (cur) => `<option value="">Choose the calculator field</option>` + fields.map((k) => `<option value="${esc(k)}"${k === cur ? ' selected' : ''}>${esc(CALC.FIELDS[k].label + ' (' + CALC.FIELDS[k].cat + ')')}</option>`).join('');
      const row = (i) => { const l = mine[i] || {};
        return `<fieldset class="cs-val"><legend class="small muted">${esc(l.id ? 'Value ' + l.id : 'New value')}</legend>
          <label class="f" for="cs-v-f${i}">Calculator field<select id="cs-v-f${i}" name="f${i}">${opt(l.field)}</select></label>
          <label class="f" for="cs-v-r${i}">Reference on the document<input id="cs-v-r${i}" name="r${i}" maxlength="120" autocomplete="off" value="${esc(l.ref || '')}" placeholder="For example IRP5 code 3601"></label>
          <label class="f" for="cs-v-a${i}">Amount (rand)<input id="cs-v-a${i}" name="a${i}" inputmode="decimal" autocomplete="off" value="${l.amount == null ? '' : esc(l.amount)}"></label></fieldset>`; };
      modal('Values from ' + kindLabel, `${VK.facts([['Case', VK.caseWho(c)], ['Document', esc(VK.scrub(d.name)) + ' · ' + docStatus(d)]])}
        <div class="cs-vals">${Array.from({ length: ROWS }, (_, i) => row(i)).join('')}</div>
        ${d.kind === 'medical' ? `<div class="cs-val-med"><label class="f" for="cs-v-months">Months on the medical scheme<input id="cs-v-months" name="months" inputmode="numeric" autocomplete="off" value="${esc(med.months == null ? 12 : med.months)}"></label>
